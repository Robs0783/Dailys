<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dealership Daily Ops</title>
<style>
  :root{
    --win-bg:#F3F3F3;
    --win-surface:#FFFFFF;
    --win-sidebar:#FAFAFA;
    --win-border:#E1DFDD;
    --win-border-strong:#D2D0CE;
    --win-text:#1B1A19;
    --win-text-secondary:#605E5C;
    --win-accent:#0F6CBD;
    --win-accent-light:#E9F1FB;
    --c-complete:#107C10;
    --c-incomplete:#C42B1C;
    --c-off:#605E5C;
    --kpi-good:#107C10;
    --kpi-risk:#BA7517;
    --kpi-bad:#C42B1C;
    --kpi-none:#8A8886;
    --radius:8px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.08), 0 0.5px 1.5px rgba(0,0,0,0.06);
    --shadow-2: 0 4px 8px rgba(0,0,0,0.10), 0 1.5px 4px rgba(0,0,0,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--win-bg); color:var(--win-text); -webkit-font-smoothing:antialiased;
  }
  .app-window{
    display:flex; flex-direction:column; height:100vh; min-height:640px;
    border:1px solid var(--win-border-strong); border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow-2); background:var(--win-bg);
  }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--win-surface); border-bottom:1px solid var(--win-border);
    padding:0 8px 0 14px; height:40px; flex-shrink:0; user-select:none;
  }
  .titlebar-left{ display:flex; align-items:center; gap:10px; }
  .app-icon{ width:18px;height:18px;border-radius:4px; background:linear-gradient(135deg,var(--win-accent),#59B0F5);
    display:flex;align-items:center;justify-content:center; color:white;font-size:11px;font-weight:700; }
  .titlebar-title{ font-size:13px; font-weight:600; }
  .loc-switch{ display:flex; gap:2px; background:var(--win-bg); border-radius:6px; padding:2px; margin-left:16px; }
  .loc-btn{ border:none; background:transparent; padding:5px 14px; font-size:12.5px; font-weight:600;
    border-radius:5px; cursor:pointer; color:var(--win-text-secondary); }
  .loc-btn.active{ background:var(--win-accent); color:#fff; }
  .titlebar-controls{ display:flex; }
  .tc-btn{ width:44px;height:40px;border:none;background:transparent; display:flex;align-items:center;justify-content:center;
    cursor:default; color:#444; font-size:10px; }
  .tc-btn:hover{ background:rgba(0,0,0,0.05); }
  .tc-btn.close:hover{ background:#E81123; color:white; }

  .app-body{ flex:1; display:flex; min-height:0; }
  .sidebar{ width:230px; flex-shrink:0; background:var(--win-sidebar); border-right:1px solid var(--win-border);
    padding:14px 8px; overflow-y:auto; }
  .sidebar-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    color:var(--win-text-secondary); padding:4px 10px 8px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; margin:2px 0; border-radius:6px;
    cursor:pointer; font-size:13px; position:relative; transition:background .12s ease; }
  .nav-item:hover{ background:rgba(0,0,0,0.04); }
  .nav-item.active{ background:var(--win-accent-light); font-weight:600; }
  .nav-item.active::before{ content:''; position:absolute; left:-8px; top:8px; bottom:8px; width:3px;
    border-radius:2px; background:var(--win-accent); }
  .nav-avatar{ width:26px;height:26px;border-radius:50%; background:#EDEBE9; color:#3B3A39;
    display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .nav-item.active .nav-avatar{ background:var(--win-accent); color:#fff; }
  .nav-progress{ margin-left:auto; font-size:10.5px; color:var(--win-text-secondary); font-variant-numeric:tabular-nums; }
  .nav-item.active .nav-progress{ color:var(--win-accent); font-weight:600; }

  .main{ flex:1; overflow-y:auto; overflow-x:auto; padding:20px 26px 40px; }
  .content-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .employee-title{ display:flex; align-items:center; gap:12px; }
  .employee-avatar-lg{ width:40px;height:40px;border-radius:50%; background:var(--win-accent); color:#fff;
    display:flex;align-items:center;justify-content:center; font-size:14px; font-weight:700; }
  .employee-title h1{ font-size:18px; margin:0; font-weight:600; }
  .employee-title .sub{ font-size:12px; color:var(--win-text-secondary); }

  .week-nav{ display:flex; align-items:center; gap:6px; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:6px; padding:4px 6px; box-shadow:var(--shadow-1); }
  .week-nav button{ border:none; background:transparent; width:26px;height:26px; border-radius:4px; cursor:pointer;
    font-size:13px; display:flex;align-items:center;justify-content:center; }
  .week-nav button:hover{ background:rgba(0,0,0,.05); }
  .week-label{ font-size:12.5px; font-weight:600; padding:0 6px; white-space:nowrap; }
  .today-pill{ font-size:11.5px; padding:4px 10px; border-radius:12px; background:var(--win-accent-light);
    color:var(--win-accent); font-weight:600; cursor:pointer; border:1px solid transparent; }
  .today-pill:hover{ border-color:var(--win-accent); }

  .summary-bar{ display:flex; align-items:center; gap:16px; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:var(--radius); padding:12px 18px; margin-bottom:16px; box-shadow:var(--shadow-1); flex-wrap:wrap; }
  .legend{ display:flex; gap:14px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--win-text-secondary); }
  .legend-dot{ width:10px;height:10px;border-radius:3px; }
  .legend-item.camera::before{ content:'\\1F4F7'; font-size:12px; }
  .summary-stat{ margin-left:auto; font-size:12px; color:var(--win-text-secondary); }
  .summary-stat b{ color:var(--win-text); }

  table.week-table{ border-collapse:collapse; width:100%; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-1); }
  table.week-table th, table.week-table td{ border-bottom:1px solid var(--win-border); padding:0; }
  table.week-table thead th{ background:#FAFAFA; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--win-text-secondary); padding:8px 6px; text-align:center; border-bottom:1px solid var(--win-border-strong); }
  table.week-table thead th.task-col{ text-align:left; padding-left:16px; }
  table.week-table thead th .dow-date{ display:block; font-weight:400; font-size:9.5px; color:#A19F9D; margin-top:1px; }
  .cadence-row td{ background:#F7F7F7; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--win-text-secondary); padding:6px 16px; border-bottom:1px solid var(--win-border); }
  .task-cell{ padding:8px 14px; font-size:13px; line-height:1.3; display:flex; align-items:center; gap:8px; min-width:220px; flex-wrap:wrap; }
  .toolbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; margin-right:4px; }
  .tb-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:6px; padding:6px 14px;
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--win-text-secondary); }
  .tb-btn:hover{ background:var(--win-accent-light); border-color:var(--win-accent); color:var(--win-accent); }
  .kpi-badge{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; color:#fff; white-space:nowrap; flex-shrink:0; cursor:default; }
  .kpi-badge.kpi-good{ background:var(--kpi-good); }
  .kpi-badge.kpi-risk{ background:var(--kpi-risk); }
  .kpi-badge.kpi-bad{ background:var(--kpi-bad); }
  .kpi-badge.kpi-none{ background:var(--kpi-none); }
  .spec-stats{ display:flex; gap:24px; flex-wrap:wrap; margin-bottom:6px; }
  .spec-stat{ background:var(--win-surface); border:1px solid var(--win-border); border-radius:var(--radius);
    padding:10px 16px; box-shadow:var(--shadow-1); }
  .spec-stat .num{ font-size:20px; font-weight:700; color:var(--win-accent); }
  .spec-stat .lbl{ font-size:11px; color:var(--win-text-secondary); text-transform:uppercase; letter-spacing:.04em; }
  .cadence-row.awareness-row{ background:#F0EFED !important; color:#8A8886 !important; }
  tr.awareness-task{ opacity:.72; }
  tr.awareness-task .task-cell{ font-style:italic; }
  .tb-btn.active{ background:var(--win-accent); border-color:var(--win-accent); color:#fff; }
  .monthly-view{ flex:1; overflow-y:auto; padding:24px 32px 60px; display:none; }
  .monthly-view.show{ display:block; }
  .monthly-header{ margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .monthly-header h1{ font-size:20px; margin:0; font-weight:600; }
  .month-nav{ display:flex; align-items:center; gap:6px; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:6px; padding:4px 6px; box-shadow:var(--shadow-1); }
  .month-nav button{ border:none; background:transparent; width:26px;height:26px; border-radius:4px; cursor:pointer;
    font-size:13px; display:flex;align-items:center;justify-content:center; }
  .month-nav button:hover{ background:rgba(0,0,0,.05); }
  .month-label{ font-size:12.5px; font-weight:600; padding:0 6px; white-space:nowrap; }
  .month-today-pill{ font-size:11.5px; padding:4px 10px; border-radius:12px; background:var(--win-accent-light);
    color:var(--win-accent); font-weight:600; cursor:pointer; border:1px solid transparent; }
  .month-today-pill:hover{ border-color:var(--win-accent); }
  .monthly-actions{ display:flex; gap:10px; margin:14px 0 20px; }
  .monthly-actions button{ border:1px solid var(--win-border-strong); background:#fff; border-radius:6px; padding:8px 16px;
    font-size:12.5px; font-weight:600; cursor:pointer; }
  .monthly-actions button:hover{ background:var(--win-accent-light); }
  .monthly-loc-group{ margin-bottom:26px; }
  .monthly-loc-title{ font-size:15px; font-weight:700; margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid var(--win-accent); }
  .dept-section{ margin-bottom:34px; }
  .dept-title{ font-size:19px; font-weight:800; margin:0 0 14px; padding-bottom:6px; border-bottom:3px solid var(--win-text); letter-spacing:.01em; }
  .metric-name-cell{ display:flex; align-items:center; gap:6px; }
  table.monthly-table{ border-collapse:collapse; width:100%; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-1); }
  table.monthly-table th, table.monthly-table td{ border-bottom:1px solid var(--win-border); padding:10px 14px; font-size:12.5px; text-align:left; }
  table.monthly-table thead th{ background:#FAFAFA; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--win-text-secondary); border-bottom:1px solid var(--win-border-strong); }
  table.monthly-table td.num, table.monthly-table th.num{ text-align:center; font-variant-numeric:tabular-nums; }
  .rate-pill{ display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:10px; color:#fff; }
  .rate-pill.rate-good{ background:var(--kpi-good); }
  .rate-pill.rate-risk{ background:var(--kpi-risk); }
  .rate-pill.rate-bad{ background:var(--kpi-bad); }
  .rate-pill.rate-none{ background:var(--kpi-none); }
  @media print{
    body{ background:#fff; }
    .app-window{ border:none; border-radius:0; box-shadow:none; height:auto; }
    .titlebar, .sidebar, .app-body > .main{ display:none !important; }
    .monthly-view{ display:block !important; padding:0; overflow:visible; }
    .monthly-actions{ display:none; }
  }
  .photo-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:5px; width:24px;height:24px;
    flex-shrink:0; cursor:pointer; font-size:12px; display:flex;align-items:center;justify-content:center; padding:0; }
  .photo-btn:hover{ background:var(--win-accent-light); border-color:var(--win-accent); }
  .photo-btn.has-photo{ border-color:var(--c-complete); background:#DFF6DD; }
  .photo-thumb{ width:24px;height:24px;border-radius:4px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--win-border-strong); }
  .onetime-chip{ font-size:9.5px; font-weight:700; color:#fff; background:#8764B8; border-radius:4px; padding:2px 5px; flex-shrink:0; }
  .day-cell{ text-align:center; padding:0; }
  .seg{ display:flex; justify-content:center; gap:3px; padding:8px 4px; }
  .seg-btn{ width:22px;height:22px; border-radius:5px; border:1px solid var(--win-border-strong); background:#fff;
    font-size:10.5px; font-weight:700; cursor:pointer; color:var(--win-text-secondary); padding:0; }
  .seg-btn:hover{ background:rgba(0,0,0,.04); }
  .seg-btn.sel-C{ background:var(--c-complete); color:#fff; border-color:var(--c-complete); }
  .seg-btn.sel-I{ background:var(--c-incomplete); color:#fff; border-color:var(--c-incomplete); }
  .seg-btn.sel-O{ background:var(--c-off); color:#fff; border-color:var(--c-off); }
  .completion-cell{ text-align:center; padding:6px; }

  .status-toast{ position:fixed; bottom:18px; right:18px; background:#1B1A19; color:#fff; padding:8px 14px;
    border-radius:6px; font-size:12.5px; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease;
    pointer-events:none; box-shadow:var(--shadow-2); z-index:50; }
  .status-toast.show{ opacity:1; transform:translateY(0); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-backdrop.show{ display:flex; }
  .modal{ background:#fff; border-radius:10px; padding:18px; max-width:520px; width:90%; box-shadow:var(--shadow-2); }
  .modal h3{ margin:0 0 10px; font-size:14px; }
  .modal img{ max-width:100%; border-radius:6px; display:block; margin-bottom:10px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{ border:1px solid var(--win-border-strong); background:#fff; border-radius:6px; padding:6px 14px;
    font-size:12.5px; cursor:pointer; }
  .modal-actions button.primary{ background:var(--win-accent); color:#fff; border-color:var(--win-accent); }
  .modal-actions button.danger{ color:var(--c-incomplete); }
  .file-input{ display:none; }
  .empty-note{ font-size:12px; color:var(--win-text-secondary); padding:14px 16px; }

  .onetime-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid var(--win-border); }
  .onetime-row:last-child{ border-bottom:none; }
  .onetime-row.done{ opacity:.6; }
  .onetime-row.done .onetime-text{ text-decoration:line-through; }
  .onetime-thumb-wrap{ flex-shrink:0; }
  .onetime-text{ flex:1; font-size:13px; }
  .mini-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:5px; padding:5px 10px;
    font-size:11.5px; font-weight:600; cursor:pointer; color:var(--win-text-secondary); white-space:nowrap; }
  .mini-btn:hover{ background:rgba(0,0,0,.04); }
  .mini-btn.sel-C{ background:var(--c-complete); color:#fff; border-color:var(--c-complete); }
  .mini-btn.primary-mini{ background:var(--win-accent); color:#fff; border-color:var(--win-accent); }
  .mini-btn.danger-mini{ color:var(--c-incomplete); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#C8C6C4; border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .admin-only{ display:none !important; }
  body.is-staff .admin-only{ display:inline-block !important; }
  .owner-only{ display:none !important; }
  body.is-owner .owner-only{ display:inline-block !important; }
  #adminToggleBtn.is-locked-state{ background:var(--win-accent); color:#fff; border-color:var(--win-accent); }
  .proj-card{ border:1px solid var(--win-border); border-radius:8px; background:var(--win-surface); margin-bottom:12px; }
  .proj-step-row{ border-top:1px solid var(--win-border); padding:10px 0; }
  .attach-chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--win-border-strong); border-radius:5px; padding:3px 8px; font-size:11.5px; margin:2px 4px 2px 0; background:#fff; }
  .attach-chip a{ color:var(--win-accent); text-decoration:none; }
  .attach-chip .rm{ cursor:pointer; color:var(--c-incomplete); font-weight:700; }
  .status-pill-sm{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9px; color:#fff; }
  .status-pill-sm.st-done{ background:var(--c-complete); }
  .status-pill-sm.st-progress{ background:var(--kpi-risk); }
  .status-pill-sm.st-notstarted{ background:var(--kpi-none); }
  .loc-applies-badge{ font-size:9.5px; font-weight:700; color:#fff; background:#8A8886; border-radius:4px; padding:2px 6px; flex-shrink:0; white-space:nowrap; }
  .info-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:50%; width:20px;height:20px; flex-shrink:0; cursor:pointer; font-size:12px; line-height:1; padding:0; color:var(--win-accent); }
  .info-btn:hover{ background:var(--win-accent-light); }
  .off-day-cell{ text-align:center; color:#C8C6C4; font-size:12px; background:#FAFAFA; }
  .metric-entry-btn{ display:block; margin:4px auto 0; border:1px solid var(--win-border-strong); background:#fff; border-radius:5px; width:22px;height:20px; cursor:pointer; font-size:11px; padding:0; }
  .metric-entry-btn:hover{ background:var(--win-accent-light); border-color:var(--win-accent); }
  .metric-entry-btn.has-value{ border-color:var(--win-accent); background:var(--win-accent-light); }
  /* Stands in for the C/I/O checkbox on a task whose completion IS entering a metric number -
     unfilled looks like an outstanding to-do (accent outline), filled looks like a completed
     task (solid green), same visual language as the checkbox it replaces. */
  .metric-replaces-task{ display:block; width:auto; height:auto; margin:0 auto; padding:4px 7px; font-size:11px; font-weight:600; border-radius:6px; white-space:nowrap; border:1px solid var(--win-accent); color:var(--win-accent); background:#fff; }
  .metric-replaces-task:hover{ background:var(--win-accent-light); }
  .metric-replaces-task.has-value{ border-color:var(--c-complete); color:#fff; background:var(--c-complete); }
</style>
</head>
<body>

<div class="app-window">
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="app-icon" id="appIcon">B</div>
      <div class="titlebar-title">Dealership Daily Ops</div><span style="font-size:10.5px;font-weight:700;color:var(--win-accent);background:var(--win-accent-light);padding:2px 8px;border-radius:10px;margin-left:4px;">Live &middot; shared</span><a href="/mapper" id="mapperLink" class="admin-only" style="font-size:11.5px;color:var(--win-text-secondary);text-decoration:none;margin-left:10px;border:1px solid var(--win-border-strong);border-radius:6px;padding:3px 9px;">Open Task Workflow Mapper &rarr;</a>
      <div class="loc-switch" id="locSwitch"></div>
    </div>
    <div class="toolbar-actions">
      <button class="tb-btn" id="dashboardToggleBtn">Metrics Dashboard</button>
      <button class="tb-btn" id="trainingLibraryToggleBtn">Training Library</button>
      <button class="tb-btn admin-only" id="setupToggleBtn">Setup</button>
      <button class="tb-btn admin-only" id="onetimeToggleBtn">One-Time Tasks</button>
      <button class="tb-btn admin-only" id="meetingsToggleBtn">Meetings</button>
      <button class="tb-btn owner-only" id="projectsToggleBtn">Projects</button>
      <button class="tb-btn admin-only" id="metricsToggleBtn">Metrics</button>
      <button class="tb-btn admin-only" id="trainingToggleBtn">Training Admin</button>
      <button class="tb-btn admin-only" id="targetsToggleBtn">Team Targets</button>
      <button class="tb-btn admin-only" id="monthlyToggleBtn">Monthly Overview</button>
      <button class="tb-btn owner-only" id="exportBtn">Export Data</button>
      <button class="tb-btn owner-only" id="importBtn">Import Data</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="tb-btn" id="adminToggleBtn" style="margin-left:6px;">Admin</button>
    </div>
    <div class="titlebar-controls">
      <button class="tc-btn">&#8211;</button>
      <button class="tc-btn">&#9633;</button>
      <button class="tc-btn close">&#10005;</button>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <div class="sidebar-label">Team</div>
      <div id="navList"></div>
    </div>

    <div class="main">
      <div class="content-header">
        <div class="employee-title">
          <div class="employee-avatar-lg" id="empAvatar">?</div>
          <div>
            <h1 id="empName">Loading…</h1>
            <div class="sub" id="empSub"></div>
          </div>
        </div>
        <div class="week-nav">
          <button id="prevWeek" title="Previous week">&#8592;</button>
          <span class="week-label" id="weekLabel">Week</span>
          <button id="nextWeek" title="Next week">&#8594;</button>
          <span class="today-pill" id="todayBtn">This week</span>
        </div>
      </div>

      <div class="summary-bar">
        <div class="legend">

// Give every task a permanent id so it can be reassigned between roles/locations without
// scrambling historical check-ins or KPI mappings (which are also keyed by this id).
function assignTaskIds(locs){
  let n = 0;
  Object.entries(locs).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => {
      emp.tasks.forEach((t) => {
        if(!t.id){ t.id = `seed-${locKey}-${empIdx}-${n++}`; }
        if(t.howTo === undefined) t.howTo = '';
        if(t.videoUrl === undefined) t.videoUrl = '';
        if(t.appliesTo === undefined) t.appliesTo = 'both';
      });
    });
  });
  return locs;
}
// Adds any new built-in location (currently just 'both', for dual-location roles) to a roster
// that was already saved on the server before that location existed, without touching anything
// Rob has already added/edited. Existing single-location rosters are left completely alone.
function backfillLocations(locs){
  if(!locs.both && DEFAULT_LOCATIONS.both){
    locs.both = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS.both));
    return true;

  return false;
}

function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function weekDates(monday){
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(d.getDate()+i); out.push(d); }
  return out;
}

function statusKey(loc, empIdx, dateStr){ return `${loc}:${dateStr}:${empIdx}`; }
function onetimeListKey(loc, empIdx){ return `onetime-tasks:${loc}:${empIdx}`; }

function initials(label){
  const clean = label.replace(/Bridgeland|Candy ?Cars|CC\\b/gi,'').trim();
  const parts = clean.split(/\\s+/).filter(Boolean);
  if(parts.length === 0) return label.slice(0,2).toUpperCase();
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

// ---- Owner/manager access gate. Employees can open the app, check off their own tasks, and
// view everyone else's completion pages, but Setup, Meetings, Metrics, Training, Team Targets,
// One-Time Tasks review, Monthly Overview, and the KPI mapper all require a staff code (owner
// OR manager). The owner's private Projects planner, and the raw Export/Import tools, require
// the OWNER code specifically - managers never see or touch those. Ask Rob for the right code
// (set/changed via the ADMIN_CODE / MANAGER_CODE variables on the Railway service). ----
const ADMIN_CODE_STORAGE_KEY = 'dailys_admin_code';
const ACCESS_TIER_STORAGE_KEY = 'dailys_access_tier';
function getAdminCode(){ return localStorage.getItem(ADMIN_CODE_STORAGE_KEY) || ''; }
function getAccessTier(){ return localStorage.getItem(ACCESS_TIER_STORAGE_KEY) || ''; }
function isOwnerAdmin(){ return !!getAdminCode() && getAccessTier() === 'owner'; }
function isManager(){ return !!getAdminCode() && getAccessTier() === 'manager'; }
function isStaff(){ return isOwnerAdmin() || isManager(); }
async function verifyAccessCode(code){
  try{
    const res = await fetch('/api/verify-access', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
    const data = await res.json();
    return (data && data.ok) ? data.tier : null;
  }catch(e){ return null; }
}
async function promptAdminUnlock(){
  const code = prompt('Enter your owner or manager access code:');
  if(code === null || code.trim() === '') return false;
  const tier = await verifyAccessCode(code.trim());
  if(tier){
    localStorage.setItem(ADMIN_CODE_STORAGE_KEY, code.trim());
    localStorage.setItem(ACCESS_TIER_STORAGE_KEY, tier);
    showToast(tier === 'owner' ? 'Owner access unlocked' : 'Manager access unlocked');
    applyAdminVisibility();
    return true;
  }
  showToast('Incorrect code');
  return false;
}
// Staff-level actions (Setup/Meetings/Metrics/Training/Team Targets/One-Time review/Monthly
// Overview/mapper): either code works. Prompts to unlock if not already unlocked.
async function requireStaff(){
  if(isStaff()) return true;
  return await promptAdminUnlock();
}
// Owner-only actions (Projects planner, Export/Import): only the owner code works, even if a
// manager code is already unlocked - prompts again and tells the manager plainly if so.
async function requireOwner(){
  if(isOwnerAdmin()) return true;
  if(!isStaff()){
    if(!(await promptAdminUnlock())) return false;
  }
  if(!isOwnerAdmin()){
    showToast('Owner access required for this');
    return false;
  }
  return true;
}
function lockAdmin(){
  localStorage.removeItem(ADMIN_CODE_STORAGE_KEY);
  localStorage.removeItem(ACCESS_TIER_STORAGE_KEY);
  showToast('Access locked');
  closeOtherPanels(null);
  updatePanelVisibility();
  applyAdminVisibility();
}
function applyAdminVisibility(){
  document.body.classList.toggle('is-staff', isStaff());
  document.body.classList.toggle('is-owner', isOwnerAdmin());
  const btn = document.getElementById('adminToggleBtn');
  if(btn){
    btn.textContent = isOwnerAdmin() ? 'Admin: Owner' : isManager() ? 'Admin: Manager' : 'Admin';
    btn.classList.toggle('is-locked-state', isStaff());
  }
}

// Whether a meeting action item is done, and any notes the assignee left about their work
// on it, live in their OWN store key - deliberately NOT inside 'meetings' (which is staff-
// gated). This is the same split used for metric entries vs metric definitions: staff define
// the item (text/assignee/deadline), but checking it off and leaving a note is the assignee's
// own legitimate write and needs to work without staff access, right from their work plan.
let ACTION_ITEM_STATUS = {};
async function refreshServerState(){
  try{
    const res = await fetch('/api/state');
    SERVER_STATE = await res.json();
    if(SERVER_STATE['roster']){
      try{
        LOCATIONS = JSON.parse(SERVER_STATE['roster']);
        const addedLocation = backfillLocations(LOCATIONS);
        LOCATIONS = assignTaskIds(LOCATIONS);
        if(addedLocation) await saveRoster(); // persist the newly-added 'Both Locations' tab right away
      }
      catch(e){ console.error('Bad roster data, falling back to default', e); LOCATIONS = assignTaskIds(DEFAULT_LOCATIONS); }
    } else {
      LOCATIONS = assignTaskIds(DEFAULT_LOCATIONS);
      await saveRoster(); // first client to see an empty store seeds the shared roster for everyone
    }
    try{ MEETINGS = SERVER_STATE['meetings'] ? JSON.parse(SERVER_STATE['meetings']) : []; }
    catch(e){ console.error('Bad meetings data, resetting', e); MEETINGS = []; }
    try{ PROJECTS = SERVER_STATE['projects'] ? JSON.parse(SERVER_STATE['projects']) : []; }
    catch(e){ console.error('Bad projects data, resetting', e); PROJECTS = []; }
    try{ METRICS = SERVER_STATE['metrics'] ? JSON.parse(SERVER_STATE['metrics']) : []; }
    catch(e){ console.error('Bad metrics data, resetting', e); METRICS = []; }
    try{ TRAINING = SERVER_STATE['training'] ? JSON.parse(SERVER_STATE['training']) : []; }
    catch(e){ console.error('Bad training data, resetting', e); TRAINING = []; }
    try{ TARGETS = SERVER_STATE['targets'] ? JSON.parse(SERVER_STATE['targets']) : []; }
    catch(e){ console.error('Bad targets data, resetting', e); TARGETS = []; }
    try{ ACTION_ITEM_STATUS = SERVER_STATE['action-item-status'] ? JSON.parse(SERVER_STATE['action-item-status']) : {}; }
    catch(e){ console.error('Bad action item status data, resetting', e); ACTION_ITEM_STATUS = {}; }
    return true;
  }catch(e){
    console.error('Failed to load shared state', e);
    showToast('Could not reach server \u2014 showing last known data');
    return false;
  }
}

// Entering a metric's number IS the proof of work for any task linked to it via
// linkedMetricId - no separate checkbox needed on top of it. Whenever a value is saved
// (from the inline day-cell button or the My Metrics panel) this finds every task across
// every role that points at this metric and marks it Complete for that date; clearing the
// value un-marks it the same way, so the two stay in lockstep and nobody has to do both.
async function syncLinkedTaskStatuses(metricId, dateStr, hasValue){
  const jobs = [];
  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => {
      emp.tasks.forEach((t) => {
        if(t.linkedMetricId === metricId){
          jobs.push({ locKey, empIdx, taskId: t.id });
        }
      });
    });
  });
  if(jobs.length === 0) return;
  await Promise.all(jobs.map(async ({locKey, empIdx, taskId}) => {
    const obj = await loadStatuses(locKey, empIdx, dateStr);
    if(hasValue){ obj[taskId] = 'C'; } else { delete obj[taskId]; }
    const key = statusKey(locKey, empIdx, dateStr);
    statusCache[key] = obj;
    await storSet(key, JSON.stringify(obj));
  }));
}

// Every open (not-done) action item logged across every past occurrence of a meeting -
// this is how "carried over to review next time" works: nothing is copied anywhere, an
// item just keeps showing up here, from whichever meeting it was first logged in, until
// someone checks it done. Sorted so the soonest deadline (and anything already overdue)
// surfaces first, undated items last.
function openActionItemsAcrossLog(notesLog){
  const out = [];
  (notesLog||[]).forEach(entry => {
    (entry.actionItems||[]).forEach(ai => {
      if(!actionItemDone(ai.id)) out.push({ item: ai, entryId: entry.id, fromDate: entry.date });
    });
  });
  out.sort((a,b) => (a.item.deadline||'9999-99-99').localeCompare(b.item.deadline||'9999-99-99'));
  return out;
}
// Every open action item across EVERY meeting, assigned to one specific person - this is
// what powers their own "My Action Items" work-plan panel.
function myMeetingActionItems(locKey, empIdx){
  const out = [];
  MEETINGS.forEach(m => {
    (m.notesLog||[]).forEach(entry => {
      (entry.actionItems||[]).forEach(ai => {
        if(ai.assignedLoc === locKey && ai.assignedEmp === empIdx && !actionItemDone(ai.id)){
          out.push({ meeting: m, entry, item: ai });
        }
      });
    });
  });
  out.sort((a,b) => (a.item.deadline||'9999-99-99').localeCompare(b.item.deadline||'9999-99-99'));
  return out;
}
// A compact "how's this department doing" table shown at the top of a meeting - Daily
// metrics show every entered value Mon-Fri so far this week, Weekly ones show this week's
// single number, both against goal. Meant to replace someone manually re-typing numbers
// into an agenda doc before the meeting starts.
async function meetingMetricsSummaryHtml(category){
  if(!category) return '';
  const catMetrics = METRICS.filter(m => (m.category || '') === category);
  if(catMetrics.length === 0){
    return `<div class="empty-note" style="padding:6px 0;">No metrics tagged "${escapeHtml(category)}" yet.</div>`;
  }
  const monday = mondayOf(new Date());
  const weekKey = isoDate(monday);
  const weekdayDates = weekDates(monday).slice(0,5);
  const thisMonthKey = monthKey(new Date());
  const targets = allRosterTargets();
  const rows = await Promise.all(catMetrics.map(async m => {
    const entries = await loadMetricEntries(m.id);
    const who = targets.find(x => x.locKey === m.assignedLoc && x.empIdx === m.assignedEmp);
    const whoLabel = who ? who.label : 'Unassigned';
    let valueHtml;
    if(m.cadence === 'Weekly'){
      const v = entries[weekKey];
      valueHtml = (v !== undefined && v !== '') ? escapeHtml(String(v)) : '—';
    } else {
      const vals = weekdayDates.map(d => entries[isoDate(d)]).filter(v => v !== undefined && v !== '');
      valueHtml = vals.length ? vals.map(v => escapeHtml(String(v))).join(', ') : '—';
    }
    const goal = (m.goals && m.goals[thisMonthKey]) ? escapeHtml(String(m.goals[thisMonthKey])) : '—';
    return `<tr>
      <td style="padding:4px 8px;font-size:12px;border-bottom:1px solid var(--win-border);">${escapeHtml(m.name)}${m.storeLabel ? ` <span style="color:var(--win-text-secondary);">(${escapeHtml(m.storeLabel)})</span>` : ''}</td>
      <td style="padding:4px 8px;font-size:11.5px;color:var(--win-text-secondary);border-bottom:1px solid var(--win-border);">${escapeHtml(whoLabel)}</td>
      <td style="padding:4px 8px;font-size:12px;font-weight:700;border-bottom:1px solid var(--win-border);">${valueHtml}</td>
      <td style="padding:4px 8px;font-size:11.5px;color:var(--win-text-secondary);border-bottom:1px solid var(--win-border);">${goal}</td>
    </tr>`;
  }));
  return `<table style="width:100%;border-collapse:collapse;">
    <thead><tr>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--win-text-secondary);">Metric</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--win-text-secondary);">Who</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--win-text-secondary);">This week</th>

async function storGet(key){
  return Object.prototype.hasOwnProperty.call(SERVER_STATE, key) ? SERVER_STATE[key] : null;
}
async function storSet(key, value, requireAdmin){
  SERVER_STATE[key] = value;
  try{
    const body = { key, value };
    if(requireAdmin) body.adminCode = getAdminCode();
    const res = await fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.ok;
  }catch(e){ console.error('storage set failed', e); return false; }
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getKpiForTask(loc, empIdx, taskId){
  try{
    const raw = SERVER_STATE[`map:${loc}:${empIdx}:${taskId}`];
    if(!raw) return null;
    const f = JSON.parse(raw);
    if(!f || !f.metric) return null;
    const label = (f.current && f.target) ? `${f.current} \u2192 ${f.target}`
                : (f.current || f.target || f.metric);
    const cls = f.onTrack === 'On track' ? 'good'
              : f.onTrack === 'At risk' ? 'risk'
              : f.onTrack === 'Off track' ? 'bad'
              : 'none';
    const title = f.metric + (f.onTrack ? ' \u2014 ' + f.onTrack : '');
    return { label, cls, title };
  }catch(e){ return null; }
}

// ---- Monthly Overview (resets automatically each calendar month - nothing is deleted, each month's
// numbers are computed live from that month's own daily entries) ----
let monthCursor = firstOfMonth(new Date());
let monthlyShown = false;

function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function daysInMonthOf(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function fmtMonthLabel(d){ return d.toLocaleDateString('en-US', {month:'long', year:'numeric'}); }
function rateClass(rate){
  if(rate === null) return 'none';
  if(rate >= 90) return 'good';
  if(rate >= 75) return 'risk';
  return 'bad';
}

async function computeMonthlyStats(loc, empIdx, monthDate){
  const emp = LOCATIONS[loc].data[empIdx];
  const countable = emp.tasks.filter(t => t.cadence !== 'Awareness');
  const nDays = daysInMonthOf(monthDate);
  let complete=0, incomplete=0, off=0, filled=0, totalPossible=0;
  const jobs = [];
  for(let day=1; day<=nDays; day++){
    const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const dateStr = isoDate(d);
    jobs.push(loadStatuses(loc, empIdx, dateStr).then(obj => {
      countable.forEach(t => {
        if(!taskAppliesOnDate(t, d)) return; // Specific Days tasks only count on their chosen weekdays
        totalPossible++;
        const v = obj[t.id];
        if(v === 'C'){ complete++; filled++; }
        else if(v === 'I'){ incomplete++; filled++; }
        else if(v === 'O'){ off++; filled++; }
      });
    }));
  }
  await Promise.all(jobs);
  const denom = complete + incomplete;
  const completionRate = denom > 0 ? Math.round((complete/denom)*100) : null;
  const fillRate = totalPossible > 0 ? Math.round((filled/totalPossible)*100) : 0;
  return { complete, incomplete, off, filled, totalPossible, completionRate, fillRate };
}

function fmtWeekLabel(dates){

// ---- "Specific Days" cadence: for tasks done every 2-3 days rather than daily or once a week.
// Admin picks exact weekdays in Setup; every other cadence is unaffected (always applies). ----
const SHORT_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; // indexed by Date.getDay()
function taskAppliesOnDate(t, date){
  if(t.cadence !== 'Specific Days') return true;
  return (t.specificDays||[]).includes(SHORT_DOW[date.getDay()]);
}
// A task can optionally be linked to an existing Metric as its completion verification - this
// decides which days it's valid to log a number for that metric (Mon-Fri for a Daily metric,
// Thursday only for a Weekly one, matching the same convention used everywhere else).
function metricValidOnDate(metric, date){
  if(!metric) return false;
  const dow = date.getDay();
  if(metric.cadence === 'Weekly') return dow === 4; // Thursday
  return dow >= 1 && dow <= 5; // Mon-Fri
}

function groupTasks(tasks){
  const order = ['Daily','Specific Days','Weekly','Saturday','Sunday','Monthly','Quarterly','As Needed','Awareness'];
  const groups = {};
  tasks.forEach((t) => {
    const c = t.cadence || 'Daily';
    if(!groups[c]) groups[c] = [];
    groups[c].push(t);
  });
  return order.filter(o => groups[o]).map(o => ({cadence:o, tasks:groups[o]}));
}

  let html = `<div class="group-title" style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--win-text-secondary);margin:0 0 8px 2px;">My Metrics</div>

      html += `<div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11.5px;color:var(--win-text-secondary);min-width:110px;">This week (enter Thu):</span>
        <input type="number" step="any" class="metric-input" data-datekey="${weekKey}" value="${escapeAttr(val)}" style="width:110px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
      </div>`;
    } else {
      html += `<div style="display:flex;gap:10px;flex-wrap:wrap;">`;
      weekdayDates.forEach((d,i) => {
        const dk = isoDate(d);
        const val = entries[dk] !== undefined ? entries[dk] : '';

          <span style="font-size:10.5px;color:var(--win-text-secondary);">${dow[i]}</span>

        </div>`;

      html += `</div>`;
    }
    html += `</div>`;
  });

  html += `</div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll('.metric-row').forEach(row => {
    const mid = row.dataset.mid;
    row.querySelectorAll('.metric-input').forEach(input => {
      input.onchange = async () => {

        await saveMetricEntries(mid, entries);

function computeSummary(dates, countableTasks){
  // quick aggregate across cached day statuses already in statusCache, restricted to
  // non-Awareness tasks so parked tasks never affect the reported rate, and only counting a
  // day for a task if that task actually applies that day (matters for Specific Days tasks)
  let filled=0, total=0, complete=0;
  dates.forEach(d => {
    const key = statusKey(currentLoc, currentEmployee, isoDate(d));
    const obj = statusCache[key] || {};
    countableTasks.forEach(t => {
      if(!taskAppliesOnDate(t, d)) return;
      total++;
      const v = obj[t.id];
      if(v){ filled++; if(v==='C') complete++; }
    });
  });
  updateSummaryStat(filled, total, complete);
}
function updateSummaryStat(filled, total, complete){
  const pct = total ? Math.round((filled/total)*100) : 0;
  document.getElementById('summaryStat').innerHTML =
    `<b>${pct}%</b> of this week's checkboxes filled &middot; <b>${complete}</b> marked complete`;
}

async function renderNavProgress(){
  const items = document.querySelectorAll('#navList .nav-progress');
  const dates = weekDates(weekStart);
  for(const el of items){
    const idx = parseInt(el.dataset.idx,10);
    const countableTasks = LOCATIONS[currentLoc].data[idx].tasks.filter(t => t.cadence !== 'Awareness');
    let filled=0, total=0;
    for(const d of dates){
      const obj = await loadStatuses(currentLoc, idx, isoDate(d));
      countableTasks.forEach(t => {
        if(!taskAppliesOnDate(t, d)) return;
        total++;
        if(obj[t.id]) filled++;
      });
    }
    el.textContent = total ? `${filled}/${total}` : '';
  }
}

// ---- Export / Import (backup, sharing between devices, and pulling in KPI mappings from Task Workflow Mapper) ----
async function exportData(){
  await refreshServerState();
  const data = SERVER_STATE;
  if(Object.keys(data).length === 0){ showToast('Nothing to export yet'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `dealership-daily-ops-data-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported (this is a backup - the live data already lives on the server)');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      const res = await fetch('/api/state/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminCode: getAdminCode(), data })
      });
      if(res.status === 403){ showToast('Import blocked \u2014 admin code required'); return; }
      const result = await res.json();
      statusCache = {};
      onetimeListCache = {};
      await renderAll();
      showToast(`Imported ${result.count || 0} entries into the shared store`);
    }catch(err){
      console.error(err);
      showToast('Import failed - invalid file');
    }
  };
  reader.readAsText(file);
}

// before hitting "Log this meeting" live here in memory only, keyed by meeting id, so the
// admin can add several before committing them all as one occurrence entry.
let meetingDrafts = {};
function getMeetingDraft(mid){
  if(!meetingDrafts[mid]) meetingDrafts[mid] = { recordingUrl: '', notes: '', actionItems: [] };
  return meetingDrafts[mid];
}

      sees it on their own weekly view, a week ahead, as they page forward. Each meeting can carry
      reference links, a department's metrics to open with, and a log of past occurrences - notes,
      the recording, and action items that stay visible (unchecked) until someone marks them done,
      so nothing outstanding gets lost between meetings.

    <div class="monthly-actions" style="margin-bottom:18px;">

  view.innerHTML = html;
  wireMeetingsHandlers(view);

function wireMeetingsHandlers(view){
  document.getElementById('addMeetingBtn').onclick = async () => {
    MEETINGS.push({ id: newMeetingId(), title: 'New meeting', type: 'In-house', cadence: 'Weekly', dayOfWeek: 'Monday', dayOfMonth: '', onDate: '', time: '', attendeeRoles: [], externalAttendees: '', agenda: '', links: [], metricCategory: '', notesLog: [] });
    await saveMeetingsList();
    await renderMeetings();
  };

  view.querySelectorAll('details[data-mid]').forEach(card => {
    const mid = card.dataset.mid;
    const findM = () => MEETINGS.find(m => m.id === mid);

    const bind = (sel, prop, parse) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => {
        const m = findM(); if(!m) return;
        m[prop] = parse ? parse(e.target.value) : e.target.value;
        await saveMeetingsList();
      };
    };
    bind('.m-title', 'title');
    bind('.m-type', 'type');
    bind('.m-dow', 'dayOfWeek');
    bind('.m-dom', 'dayOfMonth');
    bind('.m-date', 'onDate');
    bind('.m-time', 'time');
    bind('.m-external', 'externalAttendees');
    bind('.m-agenda', 'agenda');

    const cadenceEl = card.querySelector('.m-cadence');
    if(cadenceEl) cadenceEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.cadence = e.target.value;
      await saveMeetingsList();
      await renderMeetings(); // re-render so the right day/date field shows for the new cadence
    };

    const attendeesEl = card.querySelector('.m-attendees');
    if(attendeesEl) attendeesEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.attendeeRoles = Array.from(e.target.selectedOptions).map(o => o.value);
      await saveMeetingsList();
    };

    const removeEl = card.querySelector('.m-remove');
    if(removeEl) removeEl.onclick = async () => {
      if(!confirm('Remove this meeting series? Its notes log goes with it.')) return;
      const i = MEETINGS.findIndex(x => x.id === mid);
      if(i > -1) MEETINGS.splice(i, 1);
      delete meetingDrafts[mid];
      await saveMeetingsList();
      await renderMeetings();
    };

    // Reference links: label/url inputs bind straight to the array; add/remove re-render.
    card.querySelectorAll('.m-link-row').forEach(row => {
      const lid = row.dataset.lid;
      const labelEl = row.querySelector('.m-link-label');
      const urlEl = row.querySelector('.m-link-url');
      const save = async () => {
        const m = findM(); if(!m) return;
        const lk = (m.links||[]).find(x => x.id === lid); if(!lk) return;
        lk.label = labelEl.value; lk.url = urlEl.value;
        await saveMeetingsList();
      };
      if(labelEl) labelEl.onchange = save;
      if(urlEl) urlEl.onchange = async () => { await save(); await renderMeetings(); }; // re-render so the Open link appears
      const removeBtn = row.querySelector('.m-link-remove');
      if(removeBtn) removeBtn.onclick = async () => {
        const m = findM(); if(!m) return;
        m.links = (m.links||[]).filter(x => x.id !== lid);
        await saveMeetingsList();
        await renderMeetings();
      };
    });
    const linkAddBtn = card.querySelector('.m-link-add');
    if(linkAddBtn) linkAddBtn.onclick = async () => {
      const m = findM(); if(!m) return;
      if(!m.links) m.links = [];
      m.links.push({ id: newMeetingLinkId(), label: '', url: '' });
      await saveMeetingsList();
      await renderMeetings();
    };

    const metricCatEl = card.querySelector('.m-metriccat');
    if(metricCatEl) metricCatEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.metricCategory = e.target.value;
      await saveMeetingsList();
      await renderMeetings();
    };

    // Open-item checkboxes appear both in the "review" summary and inside each logged
    // occurrence - done state lives in the separate non-gated status store (see
    // ACTION_ITEM_STATUS above), so checking one off here works the same way it does from
    // an employee's own work plan, and never needs the staff code.
    card.querySelectorAll('.m-item-toggle').forEach(cb => {
      cb.onchange = async (e) => {
        await setActionItemDone(cb.dataset.itemid, e.target.checked);
        await renderMeetings();
      };
    });

    // Open items to review: assignee + deadline are structural (who/when), so editing them
    // here is a staff action that saves back into the meeting itself.
    card.querySelectorAll('.m-openitem-row').forEach(row => {
      const entryId = row.dataset.entryid, itemId = row.dataset.itemid;
      const findItem = () => {
        const m = findM(); if(!m) return null;
        const entry = (m.notesLog||[]).find(x => x.id === entryId); if(!entry) return null;
        return (entry.actionItems||[]).find(x => x.id === itemId) || null;
      };
      const assignEl = row.querySelector('.m-openitem-assign');
      if(assignEl) assignEl.onchange = async (e) => {
        const item = findItem(); if(!item) return;
        const [locKey, empIdxStr] = (e.target.value||'').split('::');
        item.assignedLoc = e.target.value ? locKey : '';
        item.assignedEmp = e.target.value ? parseInt(empIdxStr,10) : null;
        await saveMeetingsList();
      };
      const deadlineEl = row.querySelector('.m-openitem-deadline');
      if(deadlineEl) deadlineEl.onchange = async (e) => {
        const item = findItem(); if(!item) return;
        item.deadline = e.target.value;
        await saveMeetingsList();
        await renderMeetings(); // re-render so the overdue-red border updates
      };
    });

    // Draft ("log this meeting") composer - kept in meetingDrafts until saved, so the admin
    // can add several action items before committing them all as one occurrence entry.
    const draft = getMeetingDraft(mid);
    const recEl = card.querySelector('.m-new-recording');
    if(recEl) recEl.onchange = (e) => { draft.recordingUrl = e.target.value; };
    const noteEl = card.querySelector('.m-newnote');
    if(noteEl) noteEl.onchange = (e) => { draft.notes = e.target.value; };

    card.querySelectorAll('.m-draft-item-row').forEach(row => {
      const idx = parseInt(row.dataset.ai, 10);
      const textEl = row.querySelector('.m-draft-item-text');
      const assignEl = row.querySelector('.m-draft-item-assign');
      const deadlineEl = row.querySelector('.m-draft-item-deadline');
      if(textEl) textEl.onchange = (e) => { if(draft.actionItems[idx]) draft.actionItems[idx].text = e.target.value; };
      if(assignEl) assignEl.onchange = (e) => { if(draft.actionItems[idx]) draft.actionItems[idx].assignedKey = e.target.value; };
      if(deadlineEl) deadlineEl.onchange = (e) => { if(draft.actionItems[idx]) draft.actionItems[idx].deadline = e.target.value; };
      const removeBtn = row.querySelector('.m-draft-item-remove');
      if(removeBtn) removeBtn.onclick = async () => {
        draft.actionItems.splice(idx, 1);
        await renderMeetings();
      };
    });
    const addItemBtn = card.querySelector('.m-draft-item-add');
    if(addItemBtn) addItemBtn.onclick = async () => {
      draft.actionItems.push({ text: '', assignedKey: '', deadline: '' });
      await renderMeetings();
    };

    const addNoteBtn = card.querySelector('.m-addnote');
    if(addNoteBtn) addNoteBtn.onclick = async () => {
      const m = findM(); if(!m) return;
      const recordingUrl = (card.querySelector('.m-new-recording')||{}).value || '';
      const notes = (card.querySelector('.m-newnote')||{}).value || '';
      const items = draft.actionItems
        .map(ai => ({ ...ai, text: (ai.text||'').trim() }))
        .filter(ai => ai.text)
        .map(ai => {
          const [locKey, empIdxStr] = (ai.assignedKey||'').split('::');
          return {
            id: newActionItemId(), text: ai.text, deadline: ai.deadline || '',
            assignedLoc: ai.assignedKey ? locKey : '', assignedEmp: ai.assignedKey ? parseInt(empIdxStr,10) : null
          };
        });
      if(!recordingUrl.trim() && !notes.trim() && items.length === 0) return; // nothing to log
      if(!m.notesLog) m.notesLog = [];
      m.notesLog.push({ id: newMeetingEntryId(), date: isoDate(new Date()), recordingUrl: recordingUrl.trim(), notes: notes.trim(), actionItems: items });
      await saveMeetingsList();
      delete meetingDrafts[mid];
      await renderMeetings();
    };
  });
}

// ---- Project Planner (owner-only). Projects with steps assigned to specific employees,
// deadlines, status, and attachments (a pasted Google Drive/file link, or an uploaded file
// stored as a data URL). Employees see just their own assigned steps inline in their daily
// view (see renderProjectsPanel above) and can update status there - everything else here
// (creating projects, adding/removing steps, reassigning, deleting) is admin-only. ----
let projectsShown = false;

function allRosterTargets(){
  const out = [];
  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => out.push({ locKey, empIdx, label: `${loc.name} \u2014 ${emp.label}` }));
  });
  return out;
}

  await refreshServerState();
  const view = document.getElementById('projectsView');

      assign each to someone on the roster, set a due date, and attach a file or a Google Drive
      link. Assigned employees see their own steps on their daily page and can update status \u2014
      full editing stays here.
    </p>
    <div style="display:flex;gap:8px;margin-bottom:18px;">
      <input type="text" id="newProjName" placeholder="New project name..." style="flex:1;max-width:360px;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px 10px;font-size:12.5px;">
      <button class="mini-btn primary-mini" id="newProjBtn">+ New project</button>
    </div>
  `;

  if(PROJECTS.length === 0){

function wireProjectsHandlers(view){
  const newBtn = document.getElementById('newProjBtn');
  if(newBtn) newBtn.onclick = async () => {
    const input = document.getElementById('newProjName');
    const name = (input.value || '').trim();
    if(!name) return;
    PROJECTS.push({ id: newProjectId(), name, description: '', deadline: '', status: 'Active', createdAt: isoDate(new Date()), steps: [] });
    await saveProjects();
    await renderProjects();
  };

  view.querySelectorAll('details[data-pid]').forEach(card => {
    const pid = card.dataset.pid;
    const findP = () => PROJECTS.find(p => p.id === pid);

    const bindP = (sel, prop) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const p = findP(); if(!p) return; p[prop] = e.target.value; await saveProjects(); };
    };
    bindP('.p-name', 'name');
    bindP('.p-status', 'status');
    bindP('.p-deadline', 'deadline');
    bindP('.p-desc', 'description');

    const removeBtn = card.querySelector('.p-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!confirm('Delete this project and all its steps? This cannot be undone.')) return;
      const i = PROJECTS.findIndex(p => p.id === pid);
      if(i > -1) PROJECTS.splice(i, 1);
      await saveProjects();
      await renderProjects();
    };

    const addStepBtn = card.querySelector('.add-step-btn');
    if(addStepBtn) addStepBtn.onclick = async () => {
      const input = card.querySelector('.add-step-input');
      const title = (input.value || '').trim();
      if(!title) return;
      const p = findP(); if(!p) return;
      if(!p.steps) p.steps = [];
      p.steps.push({ id: newStepId(), title, assignedLoc: '', assignedEmp: null, dueDate: '', status: 'Not Started', notes: '', attachments: [] });
      await saveProjects();
      await renderProjects();
    };

    card.querySelectorAll('.proj-step-row').forEach(row => {
      const sid = row.dataset.sid;
      const findS = () => { const p = findP(); return p && (p.steps||[]).find(s => s.id === sid); };

      const bindS = (sel, prop) => {
        const el = row.querySelector(sel);
        if(!el) return;
        el.onchange = async (e) => { const s = findS(); if(!s) return; s[prop] = e.target.value; await saveProjects(); };
      };
      bindS('.s-title', 'title');
      bindS('.s-due', 'dueDate');
      bindS('.s-status', 'status');
      bindS('.s-notes', 'notes');

      const assignEl = row.querySelector('.s-assign');
      if(assignEl) assignEl.onchange = async (e) => {
        const s = findS(); if(!s) return;
        const val = e.target.value;
        if(!val){ s.assignedLoc = ''; s.assignedEmp = null; }
        else { const [locKey, empIdxStr] = val.split('::'); s.assignedLoc = locKey; s.assignedEmp = parseInt(empIdxStr, 10); }
        await saveProjects();
      };

      const removeS = row.querySelector('.s-remove');
      if(removeS) removeS.onclick = async () => {
        if(!confirm('Remove this step?')) return;
        const p = findP(); if(!p) return;
        const i = (p.steps||[]).findIndex(s => s.id === sid);
        if(i > -1) p.steps.splice(i, 1);
        await saveProjects();
        await renderProjects();
      };

      const addLinkBtn = row.querySelector('.s-addlink');
      if(addLinkBtn) addLinkBtn.onclick = async () => {
        const nameInput = row.querySelector('.s-link-name');
        const urlInput = row.querySelector('.s-link-url');
        const url = (urlInput.value || '').trim();
        if(!url) return;
        const name = (nameInput.value || '').trim() || url;
        const s = findS(); if(!s) return;
        if(!s.attachments) s.attachments = [];
        s.attachments.push({ id: newAttachId(), kind:'link', name, url, addedAt: isoDate(new Date()) });
        await saveProjects();
        await renderProjects();
      };

      const addFileBtn = row.querySelector('.s-addfile');
      if(addFileBtn) addFileBtn.onclick = () => {
        const input = document.getElementById('fileInput');
        input.value = '';
        input.accept = '';
        input.onchange = async () => {
          if(input.files && input.files[0]){
            const file = input.files[0];
            const durl = await fileToDataUrl(file);
            const s = findS(); if(!s) return;
            if(!s.attachments) s.attachments = [];
            s.attachments.push({ id: newAttachId(), kind:'file', name: file.name, dataUrl: durl, addedAt: isoDate(new Date()) });
            await saveProjects();
            await renderProjects();
            input.accept = 'image/*';
          }
        };
        input.click();
      };
    });
  });
}

// assigned, unit, how it's calculated, where to get the info, and a monthly goal) - this is
// where Rob replaces the manual "Metrics Dashboard 2026" Google Sheet. Each metric shows its
// own recent entries (read-only here) so there's a place to actually SEE the numbers over time.
// Entering new day-to-day numbers happens on the assigned employee's own page (see
// renderMetricsPanel above). Give two metrics for different stores the SAME name (e.g.
// "Delivered Units" for both Bridgeland and Candy Cars) and they'll line up side by side in the
// public Metrics Dashboard (see renderDashboard further down). ----
let metricsShown = false;
let trainingShown = false;
let targetsShown = false;
let trainingLibraryShown = false;

function recentDailyDates(n){
  const out = [];
  const d = new Date(); d.setHours(0,0,0,0);
  while(out.length < n){
    if(d.getDay() !== 0){ out.unshift(new Date(d)); } // skip Sundays (closed)
    d.setDate(d.getDate()-1);
  }
  return out;
}
function recentMondays(n){
  const out = [];
  let m = mondayOf(new Date());
  for(let i=0;i<n;i++){ out.unshift(new Date(m)); m.setDate(m.getDate()-7); }
  return out;
}
function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthKeyLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});
}

function wireMetricsAdminHandlers(view){
  const newBtn = document.getElementById('newMetricBtn');
  if(newBtn) newBtn.onclick = async () => {
    const name = (document.getElementById('newMetricName').value || '').trim();
    const cadence = document.getElementById('newMetricCadence').value;
    const targetVal = document.getElementById('newMetricTarget').value;
    const category = document.getElementById('newMetricCategory').value;
    const storeLabel = (document.getElementById('newMetricStoreLabel').value || '').trim();
    if(!name) return;
    let assignedLoc = '', assignedEmp = null;
    if(targetVal){ const [l, eStr] = targetVal.split('::'); assignedLoc = l; assignedEmp = parseInt(eStr,10); }
    METRICS.push({ id: newMetricId(), name, cadence, assignedLoc, assignedEmp, category, storeLabel, unit: '', calculation: '', source: '', goals: {}, createdAt: isoDate(new Date()) });
    await saveMetrics();
    await renderMetrics();
  };

  view.querySelectorAll('details[data-mid]').forEach(card => {
    const mid = card.dataset.mid;
    const findM = () => METRICS.find(m => m.id === mid);

    const bind = (sel, prop) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const m = findM(); if(!m) return; m[prop] = e.target.value; await saveMetrics(); };
    };
    bind('.mt-name', 'name');
    bind('.mt-cadence', 'cadence');
    bind('.mt-unit', 'unit');
    bind('.mt-category', 'category');
    bind('.mt-storelabel', 'storeLabel');
    bind('.mt-calc', 'calculation');
    bind('.mt-source', 'source');

    card.querySelectorAll('.mt-goal').forEach(el => {
      el.onchange = async (e) => {
        const m = findM(); if(!m) return;
        if(!m.goals) m.goals = {};
        m.goals[e.target.dataset.monthkey] = e.target.value;
        await saveMetrics();
      };
    });

    const assignEl = card.querySelector('.mt-assign');
    if(assignEl) assignEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      const val = e.target.value;
      if(!val){ m.assignedLoc = ''; m.assignedEmp = null; }
      else { const [l, eStr] = val.split('::'); m.assignedLoc = l; m.assignedEmp = parseInt(eStr,10); }
      await saveMetrics();
    };

    const removeBtn = card.querySelector('.mt-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!confirm('Delete this metric? Its recorded history stays on the server but will no longer be shown anywhere.')) return;
      const i = METRICS.findIndex(m => m.id === mid);
      if(i > -1) METRICS.splice(i,1);
      await saveMetrics();
      await renderMetrics();
    };
  });
}

function wireTrainingAdminHandlers(view){
  const newBtn = document.getElementById('newTrnBtn');
  if(newBtn) newBtn.onclick = async () => {
    const title = (document.getElementById('newTrnTitle').value || '').trim();
    const platform = (document.getElementById('newTrnPlatform').value || '').trim();
    const type = document.getElementById('newTrnType').value;
    const url = (document.getElementById('newTrnUrl').value || '').trim();
    const roleTags = (document.getElementById('newTrnRoles').value || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    const linkedMetricId = document.getElementById('newTrnMetric').value || '';
    const managersOnly = document.getElementById('newTrnManagersOnly').checked;
    if(!title || !url){ showToast('Title and URL are required'); return; }
    TRAINING.push({ id: newTrainingId(), title, platform, type, url, roleTags, linkedMetricId, managersOnly, notes: '', createdAt: isoDate(new Date()) });
    await saveTraining();
    await renderTraining();
  };

  view.querySelectorAll('.setup-task-row[data-tid]').forEach(row => {
    const tid = row.dataset.tid;
    const findT = () => TRAINING.find(t => t.id === tid);
    const bind = (sel, prop, transform) => {
      const el = row.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const t = findT(); if(!t) return; t[prop] = transform ? transform(e.target.value) : e.target.value; await saveTraining(); };
    };
    bind('.tr-title', 'title');
    bind('.tr-platform', 'platform');
    bind('.tr-type', 'type');
    bind('.tr-url', 'url');
    bind('.tr-roles', 'roleTags', v => v.split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
    const metricEl = row.querySelector('.tr-metric');
    if(metricEl) metricEl.onchange = async (e) => { const t = findT(); if(t){ t.linkedMetricId = e.target.value || ''; await saveTraining(); } };
    const moEl = row.querySelector('.tr-managers-only');
    if(moEl) moEl.onchange = async (e) => { const t = findT(); if(t){ t.managersOnly = e.target.checked; await saveTraining(); } };
    const removeBtn = row.querySelector('.tr-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!isOwnerAdmin()){ showToast('Owner access required to delete training'); return; }
      if(!confirm('Delete this training video?')) return;
      const i = TRAINING.findIndex(t => t.id === tid);
      if(i > -1) TRAINING.splice(i,1);
      await saveTraining();
      await renderTraining();
    };
  });
}

function trainingVisibleToCurrentEmployee(t){
  if(t.managersOnly && !isStaff()) return false;
  if(!t.roleTags || t.roleTags.length === 0) return true;
  const loc = LOCATIONS[currentLoc];
  const emp = loc && loc.data[currentEmployee];
  if(!emp) return true;
  const label = emp.label.toLowerCase();
  return t.roleTags.some(tag => label.includes(tag));
}

// ---- Public Metrics Dashboard: read-only, NOT admin-gated - every employee can open this to
// see how each store is doing side by side. Two metrics with the SAME name (e.g. "Delivered
// Units" defined once for Bridgeland and once for Candy Cars) are grouped into one card with a
// column per store. Shows the monthly goal, a week-by-week breakdown for the month being viewed,
// and the running month-to-date total, plus the calculation/source notes so it's clear where the
// number comes from and how it's worked out (same information the old Metrics Dashboard 2026
// Google Sheet carried). ----
let dashboardShown = false;
let dashboardMonthCursor = firstOfMonth(new Date());

function weeksTouchingMonth(monthDate){
  const n = daysInMonthOf(monthDate);
  const seen = {};
  const out = [];
  for(let day=1; day<=n; day++){
    const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const mon = mondayOf(d);
    const key = isoDate(mon);
    if(!seen[key]){ seen[key] = true; out.push(mon); }
  }
  out.sort((a,b) => a-b);
  return out;
}
function sumInMonth(entries, dateStrs, monthDate){
  const y = monthDate.getFullYear(), m = monthDate.getMonth();
  let total = 0, any = false;
  dateStrs.forEach(ds => {
    const v = entries[ds];
    if(v === undefined || v === '') return;
    const d = new Date(ds + 'T00:00:00');
    if(d.getFullYear() === y && d.getMonth() === m){
      const n = parseFloat(v);
      if(!isNaN(n)){ total += n; any = true; }
    }
  });
  return any ? total : null;
}

async function renderDashboard(){
  await refreshServerState();
  const view = document.getElementById('dashboardView');
  const monthLabel = fmtMonthLabel(dashboardMonthCursor);
  const goalMonthKey = monthKey(dashboardMonthCursor);
  const weeks = weeksTouchingMonth(dashboardMonthCursor);

  let html = `
    <div class="monthly-header"><h1>Metrics Dashboard \u2014 ${monthLabel}</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="month-nav">
          <button id="dbPrevMonth" title="Previous month">&#8592;</button>
          <span class="month-label">${monthLabel}</span>
          <button id="dbNextMonth" title="Next month">&#8594;</button>
        </div>
        <span class="month-today-pill" id="dbThisMonthBtn">This month</span>
      </div>
    </div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 18px;">
      Side-by-side store view of every KPI, for anyone to check. Metrics defined under the same
      name at more than one store line up in the same card. Numbers are entered day to day by
      whoever's assigned - see the Metrics area if you're setting up what gets tracked.
    </p>
  `;

  if(METRICS.length === 0){
    html += `<div class="empty-note">No metrics set up yet.</div>`;
    view.innerHTML = html;
    wireDashboardHandlers();
    return;
  }

  const targets = allRosterTargets();

  // Department (category) sections first, then metric-name groups (same-named metrics from
  // different stores line up side by side) within each department - keeps the whole page
  // scannable by department instead of one long flat list.
  const DEPT_ORDER = METRIC_CATEGORIES;
  const byDept = {};
  METRICS.forEach(m => {
    const dept = m.category && m.category.trim() ? m.category.trim() : 'Uncategorized';
    (byDept[dept] = byDept[dept] || {});
    (byDept[dept][m.name] = byDept[dept][m.name] || []).push(m);
  });
  const deptNames = Object.keys(byDept).sort((a,b) => {
    const ia = DEPT_ORDER.indexOf(a), ib = DEPT_ORDER.indexOf(b);
    if(ia !== -1 && ib !== -1) return ia - ib;
    if(ia !== -1) return -1;
    if(ib !== -1) return 1;
    if(a === 'Uncategorized') return 1;
    if(b === 'Uncategorized') return -1;
    return a.localeCompare(b);
  });

  for(const dept of deptNames){
    html += `<div class="dept-section"><div class="dept-title">${escapeHtml(dept)}</div>`;
    const groups = byDept[dept];

    for(const [name, metrics] of Object.entries(groups)){
      html += `<div class="monthly-loc-group"><div class="monthly-loc-title">${escapeHtml(name)}</div>
        <table class="monthly-table"><thead><tr><th>Store / who</th>`;
      weeks.forEach(w => {
        html += `<th class="num">Wk of ${w.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}</th>`;
      });
      html += `<th class="num">Month to date</th><th class="num">Goal</th></tr></thead><tbody>`;

      for(const m of metrics){
        if(!m.goals) m.goals = {};
        const entries = await loadMetricEntries(m.id);
        const assignedLabel = targets.find(x => x.locKey===m.assignedLoc && x.empIdx===m.assignedEmp);
        const goal = m.goals[goalMonthKey];
        const hasInfo = !!(m.calculation || m.source);

        html += `<tr><td><div class="metric-name-cell">${assignedLabel ? escapeHtml(assignedLabel.label) : 'Unassigned'}${m.storeLabel ? ` <span style="color:var(--win-text-secondary);">(${escapeHtml(m.storeLabel)})</span>` : ''}${m.unit ? ` <span style="color:var(--win-text-secondary);">(${escapeHtml(m.unit)})</span>` : ''}${hasInfo ? `<button class="info-btn dash-info-btn" data-mid="${m.id}" title="How it's calculated">ⓘ</button>` : ''}</div></td>`;

        let monthDateStrs = [];
        weeks.forEach(w => {
          let wVal;
          if(m.cadence === 'Weekly'){
            const v = entries[isoDate(w)];
            wVal = (v !== undefined && v !== '') ? parseFloat(v) : null;
            monthDateStrs.push(isoDate(w));
          } else {
            let sum = 0, any = false;
            for(let i=0;i<5;i++){
              const d = new Date(w); d.setDate(d.getDate()+i);
              const ds = isoDate(d);
              monthDateStrs.push(ds);
              const v = entries[ds];
              if(v !== undefined && v !== ''){ const n = parseFloat(v); if(!isNaN(n)){ sum += n; any = true; } }
            }
            wVal = any ? sum : null;
          }
          html += `<td class="num">${wVal !== null && !isNaN(wVal) ? wVal : '—'}</td>`;
        });

        const mtd = sumInMonth(entries, monthDateStrs, dashboardMonthCursor);
        html += `<td class="num"><b>${mtd !== null ? mtd : '—'}</b></td>`;
        html += `<td class="num">${goal ? escapeHtml(String(goal)) : '<span style="color:var(--kpi-risk);font-weight:600;">not set</span>'}</td>`;
        html += `</tr>`;
      }

      html += `</tbody></table></div>`;
    }
    html += `</div>`;
  }

  view.innerHTML = html;
  wireDashboardHandlers();
}

  document.querySelectorAll('.dash-info-btn').forEach(btn => {
    btn.onclick = () => {
      const m = METRICS.find(x => x.id === btn.dataset.mid);
      if(m) openMetricCalcInfoModal(m);
    };
  });
}

}
