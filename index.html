          </select>
          <select class="m-cadence" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="Weekly" ${m.cadence==='Weekly'?'selected':''}>Weekly</option>
            <option value="Monthly" ${m.cadence==='Monthly'?'selected':''}>Monthly</option>
            <option value="One-time" ${m.cadence==='One-time'?'selected':''}>One-time</option>
          </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          ${m.cadence==='Weekly' ? `<select class="m-dow" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">${DOW_NAMES.map(d=>`<option value="${d}" ${m.dayOfWeek===d?'selected':''}>${d}</option>`).join('')}</select>` : ''}
          ${m.cadence==='Monthly' ? `<select class="m-monthlymode" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="" ${m.monthlyMode!=='firstWorkday'?'selected':''}>On a specific day of month</option>
            <option value="firstWorkday" ${m.monthlyMode==='firstWorkday'?'selected':''}>First workday of the month</option>
          </select>` : ''}
          ${m.cadence==='Monthly' && m.monthlyMode!=='firstWorkday' ? `<input type="number" min="1" max="31" class="m-dom" placeholder="Day of month (1-31)" value="${escapeAttr(m.dayOfMonth||'')}" style="width:180px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">` : ''}
          ${m.cadence==='One-time' ? `<input type="date" class="m-date" value="${escapeAttr(m.onDate||'')}" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">` : ''}
          <input type="text" class="m-time" placeholder="Time (e.g. 10:00 AM)" value="${escapeAttr(m.time||'')}" style="width:160px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
          <button class="mini-btn danger-mini m-remove">Remove meeting</button>
        </div>
        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Attendees (internal \u2014 shows on their weekly view; ctrl/cmd-click for multiple)</label>
        <select class="m-attendees" multiple size="4" style="width:100%;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;margin-bottom:8px;">
          ${dropdownTargets(m.attendeeRoles||[]).map(x => `<option value="${x.locKey}::${x.empIdx}" ${(m.attendeeRoles||[]).includes(x.locKey+'::'+x.empIdx)?'selected':''}>${escapeAttr(x.label)}</option>`).join('')}
        </select>
        <input type="text" class="m-external" placeholder="External / vendor attendees (free text)" value="${escapeAttr(m.externalAttendees||'')}" style="width:100%;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;margin-bottom:8px;">
        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Agenda — one item per line, shows as a numbered 1, 2, 3... list</label>
        <textarea class="m-agenda" placeholder="One agenda item per line..." style="width:100%;min-height:60px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;margin-bottom:6px;">${escapeHtml(m.agenda||'')}</textarea>

        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Review — last time's items (previous occurrence's bullet points, plus action items assigned then with any notes the assignee added when they completed their part)</label>
        <div style="border:1px solid var(--win-border);border-radius:6px;padding:8px 10px;margin-bottom:12px;background:#FAFAFA;">
          ${reviewSectionHtml(m)}
        </div>

        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button type="button" class="mini-btn m-print-btn">\u{1F5A8} Print / PDF (date, attendees, agenda, review)</button>
        </div>

        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Reference links (Google Sheets, docs, etc. pulled up during the meeting)</label>
        <div class="m-links-list" style="margin-bottom:6px;">
          ${(m.links||[]).map(lk => `<div class="m-link-row" data-lid="${lk.id}" style="display:flex;gap:6px;margin-bottom:5px;">
            <input type="text" class="m-link-label" placeholder="Label (e.g. Metrics Dashboard 2026)" value="${escapeAttr(lk.label||'')}" style="width:220px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            <input type="text" class="m-link-url" placeholder="https://..." value="${escapeAttr(lk.url||'')}" style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            ${lk.url ? `<a href="${escapeAttr(lk.url)}" target="_blank" rel="noopener" class="mini-btn" style="text-decoration:none;">Open</a>` : ''}
            <button class="mini-btn danger-mini m-link-remove">Remove</button>
          </div>`).join('')}
        </div>
        <button class="mini-btn m-link-add" style="margin-bottom:10px;">+ Add link</button>

        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Department metrics shown at the start of this meeting</label>
        <select class="m-metriccat" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;margin-bottom:8px;">
          <option value="">None</option>
          ${DEPARTMENTS.map(c => `<option value="${c}" ${m.metricCategory===c?'selected':''}>${escapeAttr(c)}</option>`).join('')}
        </select>
        ${m.metricCategory ? `<div class="m-metrics-preview" style="border:1px solid var(--win-border);border-radius:6px;padding:6px 4px;margin-bottom:12px;">${metricsHtml}</div>` : ''}
        ${reviewMetricsSectionHtml(m.metricCategory, true)}

        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Month-end recap for a store (adds a goals-vs-actual table — last month's financials, box to set next month's)</label>
        <select class="m-monthend" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;margin-bottom:8px;">
          <option value="" ${!m.monthEndStore?'selected':''}>Not a month-end recap</option>
          <option value="bridgeland" ${m.monthEndStore==='bridgeland'?'selected':''}>Bridgeland</option>
          <option value="candycars" ${m.monthEndStore==='candycars'?'selected':''}>Candy Cars</option>
        </select>
        ${monthEndHtml ? `<div style="border:1px solid var(--win-border);border-radius:6px;padding:6px 4px;margin-bottom:12px;">${monthEndHtml}</div>` : ''}

        ${openItems.length ? `
        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Open action items to review (carried over until checked done \u2014 assign/set a deadline right here)</label>
        <div class="m-open-items" style="border:1px solid var(--win-border);border-radius:6px;padding:8px 10px;margin-bottom:12px;">
          ${openItems.map(({item, entryId, fromDate}) => {
            const overdue = item.deadline && item.deadline < isoDate(new Date());
            return `<div class="m-openitem-row" data-entryid="${entryId}" data-itemid="${item.id}" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--win-border);">
            <input type="checkbox" class="m-item-toggle" data-itemid="${item.id}">
            <span style="flex:1;min-width:160px;font-size:12.5px;">${escapeHtml(item.text)} <span style="color:var(--win-text-secondary);">(from ${escapeHtml(fromDate)})</span></span>
            <select class="m-openitem-assign" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:5px;font-size:11.5px;">
              <option value="">Unassigned</option>
              ${dropdownTargets(item.assignedLoc ? (item.assignedLoc+'::'+item.assignedEmp) : null).map(x => `<option value="${x.locKey}::${x.empIdx}" ${(item.assignedLoc===x.locKey && item.assignedEmp===x.empIdx)?'selected':''}>${escapeAttr(x.label)}</option>`).join('')}
            </select>
            <input type="date" class="m-openitem-deadline" value="${escapeAttr(item.deadline||'')}" style="border:1px solid ${overdue?'#c00':'var(--win-border-strong)'};border-radius:6px;padding:5px;font-size:11.5px;">
          </div>`;
          }).join('')}
        </div>` : ''}

        ${needsVerify.length ? `
        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Completed \u2014 verify before next meeting (stays here until you check it off, however long that takes)</label>
        <div class="m-verify-items" style="border:1px solid var(--win-border);border-radius:6px;padding:8px 10px;margin-bottom:12px;">
          ${needsVerify.map(({item}) => {
            const who = (allTargets.find(x=>x.locKey===item.assignedLoc&&x.empIdx===item.assignedEmp)||{}).label || 'Unassigned';
            const assigneeNotes = actionItemNotes(item.id);
            const links = actionItemLinks(item.id);
            return `<div class="m-verify-row" data-itemid="${item.id}" style="padding:6px 0;border-bottom:1px solid var(--win-border);">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="flex:1;min-width:160px;font-size:12.5px;">${escapeHtml(item.text)} <span style="color:var(--win-text-secondary);">\u2014 ${escapeHtml(who)}</span></span>
                <button class="mini-btn primary-mini m-verify-btn">Mark verified</button>
              </div>
              ${assigneeNotes ? `<div style="margin-top:4px;font-size:11.5px;color:var(--win-text-secondary);">Note from assignee: ${escapeHtml(assigneeNotes)}</div>` : ''}
              ${links.length ? `<div style="margin-top:4px;">${links.map(lk => `<a href="${escapeAttr(lk.url)}" target="_blank" rel="noopener" style="display:inline-block;font-size:11px;border:1px solid var(--win-border-strong);border-radius:5px;padding:2px 7px;margin:2px 4px 0 0;color:var(--win-accent);text-decoration:none;">${escapeHtml(lk.label || lk.url)}</a>`).join('')}</div>` : ''}
            </div>`;
          }).join('')}
        </div>` : ''}

        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Past occurrences</label>
        <div class="m-notes-log" style="margin-bottom:10px;">
          ${(m.notesLog && m.notesLog.length) ? m.notesLog.slice().reverse().map((n) => `<div style="border-top:1px solid var(--win-border);padding:8px 0;font-size:12px;">
            <b>${escapeHtml(n.date)}</b>${n.recordingUrl ? ` \u00b7 <a href="${escapeAttr(n.recordingUrl)}" target="_blank" rel="noopener">\u{1F3A5} Recording</a>` : ''}
            ${n.notes ? `<div style="margin-top:4px;">${bulletListHtml(n.notes) || escapeHtml(n.notes)}</div>` : ''}
            ${(n.actionItems && n.actionItems.length) ? `<div style="margin-top:6px;">
              ${n.actionItems.map(ai => {
                const done = actionItemDone(ai.id);
                const assigneeNotes = actionItemNotes(ai.id);
                const links = actionItemLinks(ai.id);
                const verified = actionItemVerified(ai.id);
                return `<div style="padding:2px 0;${done?'color:var(--win-text-secondary);':''}">
                <label style="display:flex;align-items:center;gap:8px;">
                  <input type="checkbox" class="m-item-toggle" data-itemid="${ai.id}" ${done?'checked':''}>
                  <span style="${done?'text-decoration:line-through;':''}">${escapeHtml(ai.text)}${ai.assignedLoc ? ` <span style="color:var(--win-text-secondary);">\u2014 ${escapeHtml((allTargets.find(x=>x.locKey===ai.assignedLoc&&x.empIdx===ai.assignedEmp)||{}).label||'')}</span>` : ''}${ai.deadline ? ` <span style="color:var(--win-text-secondary);">\u00b7 due ${escapeHtml(ai.deadline)}</span>` : ''}</span>
                  ${done && verified ? `<span class="status-pill-sm st-done">Verified</span>` : ''}
                </label>
                ${assigneeNotes ? `<div style="margin-left:26px;font-size:11.5px;color:var(--win-text-secondary);">Note from assignee: ${escapeHtml(assigneeNotes)}</div>` : ''}
                ${links.length ? `<div style="margin-left:26px;margin-top:2px;">${links.map(lk => `<a href="${escapeAttr(lk.url)}" target="_blank" rel="noopener" style="display:inline-block;font-size:11px;border:1px solid var(--win-border-strong);border-radius:5px;padding:2px 7px;margin:2px 4px 0 0;color:var(--win-accent);text-decoration:none;">${escapeHtml(lk.label || lk.url)}</a>`).join('')}</div>` : ''}
              </div>`;
              }).join('')}
            </div>` : ''}
          </div>`).join('') : '<div class="empty-note" style="padding:6px 0;">No occurrences logged yet.</div>'}
        </div>

        <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Log this meeting</label>
        <input type="text" class="m-new-recording" placeholder="Recording link (Zoom, Teams, Google Drive, Guidde...)" value="${escapeAttr(draft.recordingUrl)}" style="width:100%;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;margin-bottom:6px;">
        <textarea class="m-newnote" placeholder="One bullet point per line..." style="width:100%;min-height:60px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;margin-bottom:6px;">${escapeHtml(draft.notes)}</textarea>
        <div class="m-draft-items" style="margin-bottom:6px;">
          ${draft.actionItems.map((ai, ai_i) => `<div class="m-draft-item-row" data-ai="${ai_i}" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;">
            <input type="text" class="m-draft-item-text" placeholder="Action item / task..." value="${escapeAttr(ai.text)}" style="flex:1;min-width:180px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            <select class="m-draft-item-assign" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
              <option value="">Unassigned</option>
              ${dropdownTargets(ai.assignedKey).map(x => `<option value="${x.locKey}::${x.empIdx}" ${ai.assignedKey===(x.locKey+'::'+x.empIdx)?'selected':''}>${escapeAttr(x.label)}</option>`).join('')}
            </select>
            <input type="date" class="m-draft-item-deadline" value="${escapeAttr(ai.deadline||'')}" title="Deadline" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <button class="mini-btn danger-mini m-draft-item-remove">Remove</button>
          </div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;">
          <button class="mini-btn m-draft-item-add">+ Add action item</button>
          <button class="mini-btn primary-mini m-addnote">Log this meeting</button>
        </div>
      </div>
    </details>`;
  }

  view.innerHTML = html;
  wireMeetingsHandlers(view);
}

function wireMeetingsHandlers(view){
  document.getElementById('addMeetingBtn').onclick = async () => {
    MEETINGS.push({ id: newMeetingId(), title: 'New meeting', type: 'In-house', cadence: 'Weekly', dayOfWeek: 'Monday', dayOfMonth: '', monthlyMode: '', onDate: '', time: '', attendeeRoles: [], externalAttendees: '', agenda: '', links: [], metricCategory: '', monthEndStore: '', notesLog: [] });
    await saveMeetingsList();
    await renderMeetings();
  };

  view.querySelectorAll('details[data-mid]').forEach(card => {
    const mid = card.dataset.mid;
    const findM = () => MEETINGS.find(m => m.id === mid);

    // Keep expandedMeetingIds in sync with manual open/close too, not just re-renders -
    // this also fires right after we re-apply the "open" attribute on render, which is fine,
    // it just re-adds the id that's already there.
    card.addEventListener('toggle', () => {
      if(card.open) expandedMeetingIds.add(mid); else expandedMeetingIds.delete(mid);
    });

    const bind = (sel, prop, parse) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => {
        const m = findM(); if(!m) return;
        m[prop] = parse ? parse(e.target.value) : e.target.value;
        await saveMeetingsList();
      };
    };
    bind('.m-title', 'title');
    bind('.m-type', 'type');
    bind('.m-dow', 'dayOfWeek');
    bind('.m-dom', 'dayOfMonth');
    bind('.m-date', 'onDate');
    const monthlyModeEl = card.querySelector('.m-monthlymode');
    if(monthlyModeEl) monthlyModeEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.monthlyMode = e.target.value;
      await saveMeetingsList();
      await renderMeetings(); // re-render so the day-of-month box shows/hides correctly
    };
    bind('.m-time', 'time');
    bind('.m-external', 'externalAttendees');
    bind('.m-agenda', 'agenda');

    const cadenceEl = card.querySelector('.m-cadence');
    if(cadenceEl) cadenceEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.cadence = e.target.value;
      await saveMeetingsList();
      await renderMeetings(); // re-render so the right day/date field shows for the new cadence
    };

    const attendeesEl = card.querySelector('.m-attendees');
    if(attendeesEl) attendeesEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.attendeeRoles = Array.from(e.target.selectedOptions).map(o => o.value);
      await saveMeetingsList();
    };

    const removeEl = card.querySelector('.m-remove');
    if(removeEl) removeEl.onclick = async () => {
      if(!await appConfirm('Remove this meeting series? Its notes log goes with it.')) return;
      const i = MEETINGS.findIndex(x => x.id === mid);
      if(i > -1) MEETINGS.splice(i, 1);
      delete meetingDrafts[mid];
      await saveMeetingsList();
      await renderMeetings();
    };

    const printEl = card.querySelector('.m-print-btn');
    if(printEl) printEl.onclick = () => openMeetingPrint(mid);

    // Reference links: label/url inputs bind straight to the array; add/remove re-render.
    card.querySelectorAll('.m-link-row').forEach(row => {
      const lid = row.dataset.lid;
      const labelEl = row.querySelector('.m-link-label');
      const urlEl = row.querySelector('.m-link-url');
      const save = async () => {
        const m = findM(); if(!m) return;
        const lk = (m.links||[]).find(x => x.id === lid); if(!lk) return;
        lk.label = labelEl.value; lk.url = urlEl.value;
        await saveMeetingsList();
      };
      if(labelEl) labelEl.onchange = save;
      if(urlEl) urlEl.onchange = async () => { await save(); await renderMeetings(); }; // re-render so the Open link appears
      const removeBtn = row.querySelector('.m-link-remove');
      if(removeBtn) removeBtn.onclick = async () => {
        const m = findM(); if(!m) return;
        m.links = (m.links||[]).filter(x => x.id !== lid);
        await saveMeetingsList();
        await renderMeetings();
      };
    });
    const linkAddBtn = card.querySelector('.m-link-add');
    if(linkAddBtn) linkAddBtn.onclick = async () => {
      const m = findM(); if(!m) return;
      if(!m.links) m.links = [];
      m.links.push({ id: newMeetingLinkId(), label: '', url: '' });
      await saveMeetingsList();
      await renderMeetings();
    };

    const metricCatEl = card.querySelector('.m-metriccat');
    if(metricCatEl) metricCatEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.metricCategory = e.target.value;
      await saveMeetingsList();
      await renderMeetings();
    };

    const monthEndEl = card.querySelector('.m-monthend');
    if(monthEndEl) monthEndEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.monthEndStore = e.target.value;
      await saveMeetingsList();
      await renderMeetings();
    };
    card.querySelectorAll('.mer-goal-input').forEach(el => {
      el.onchange = async (e) => {
        const metric = METRICS.find(x => x.id === e.target.dataset.mid); if(!metric) return;
        if(!metric.goals) metric.goals = {};
        metric.goals[e.target.dataset.monthkey] = e.target.value;
        await saveMetrics();
        showToast('Saved');
      };
    });

    // Removing a review item doesn't delete the metric - it's soft-archived, same pattern as
    // roster roles, so nothing referencing its past numbers breaks.
    card.querySelectorAll('.review-metric-remove').forEach(btn => {
      btn.onclick = async () => {
        const rm = METRICS.find(x => x.id === btn.dataset.mid);
        if(!rm) return;
        if(!(await appConfirm(`Remove "${rm.name}" from Review? It won't be brought back up in this meeting again. Past numbers stay on record.`, 'Remove'))) return;
        rm.archived = true;
        await saveMetrics();
        await renderMeetings();
      };
    });

    // Open-item checkboxes appear both in the "review" summary and inside each logged
    // occurrence - done state lives in the separate non-gated status store (see
    // ACTION_ITEM_STATUS above), so checking one off here works the same way it does from
    // an employee's own work plan, and never needs the staff code.
    card.querySelectorAll('.m-item-toggle').forEach(cb => {
      cb.onchange = async (e) => {
        await setActionItemDone(cb.dataset.itemid, e.target.checked);
        await renderMeetings();
      };
    });

    // "Mark verified" on a completed item - the owner's own confirmation, separate from the
    // assignee's "done". Clears it from this meeting's verify-queue (and the Owner Board's).
    card.querySelectorAll('.m-verify-row').forEach(row => {
      const btn = row.querySelector('.m-verify-btn');
      if(btn) btn.onclick = async () => {
        await setActionItemVerified(row.dataset.itemid, true);
        showToast('Verified');
        await renderMeetings();
      };
    });

    // Open items to review: assignee + deadline are structural (who/when), so editing them
    // here is a staff action that saves back into the meeting itself.
    card.querySelectorAll('.m-openitem-row').forEach(row => {
      const entryId = row.dataset.entryid, itemId = row.dataset.itemid;
      const findItem = () => {
        const m = findM(); if(!m) return null;
        const entry = (m.notesLog||[]).find(x => x.id === entryId); if(!entry) return null;
        return (entry.actionItems||[]).find(x => x.id === itemId) || null;
      };
      const assignEl = row.querySelector('.m-openitem-assign');
      if(assignEl) assignEl.onchange = async (e) => {
        const item = findItem(); if(!item) return;
        const [locKey, empIdxStr] = (e.target.value||'').split('::');
        item.assignedLoc = e.target.value ? locKey : '';
        item.assignedEmp = e.target.value ? parseInt(empIdxStr,10) : null;
        await saveMeetingsList();
      };
      const deadlineEl = row.querySelector('.m-openitem-deadline');
      if(deadlineEl) deadlineEl.onchange = async (e) => {
        const item = findItem(); if(!item) return;
        item.deadline = e.target.value;
        await saveMeetingsList();
        await renderMeetings(); // re-render so the overdue-red border updates
      };
    });

    // Draft ("log this meeting") composer - kept in meetingDrafts until saved, so the admin
    // can add several action items before committing them all as one occurrence entry.
    const draft = getMeetingDraft(mid);
    const recEl = card.querySelector('.m-new-recording');
    if(recEl) recEl.onchange = (e) => { draft.recordingUrl = e.target.value; };
    const noteEl = card.querySelector('.m-newnote');
    if(noteEl) noteEl.onchange = (e) => { draft.notes = e.target.value; };

    card.querySelectorAll('.m-draft-item-row').forEach(row => {
      const idx = parseInt(row.dataset.ai, 10);
      const textEl = row.querySelector('.m-draft-item-text');
      const assignEl = row.querySelector('.m-draft-item-assign');
      const deadlineEl = row.querySelector('.m-draft-item-deadline');
      if(textEl) textEl.onchange = (e) => { if(draft.actionItems[idx]) draft.actionItems[idx].text = e.target.value; };
      if(assignEl) assignEl.onchange = (e) => { if(draft.actionItems[idx]) draft.actionItems[idx].assignedKey = e.target.value; };
      if(deadlineEl) deadlineEl.onchange = (e) => { if(draft.actionItems[idx]) draft.actionItems[idx].deadline = e.target.value; };
      const removeBtn = row.querySelector('.m-draft-item-remove');
      if(removeBtn) removeBtn.onclick = async () => {
        draft.actionItems.splice(idx, 1);
        await renderMeetings();
      };
    });
    const addItemBtn = card.querySelector('.m-draft-item-add');
    if(addItemBtn) addItemBtn.onclick = async () => {
      draft.actionItems.push({ text: '', assignedKey: '', deadline: '' });
      await renderMeetings();
    };

    const addNoteBtn = card.querySelector('.m-addnote');
    if(addNoteBtn) addNoteBtn.onclick = async () => {
      const m = findM(); if(!m) return;
      const recordingUrl = (card.querySelector('.m-new-recording')||{}).value || '';
      const notes = (card.querySelector('.m-newnote')||{}).value || '';
      const items = draft.actionItems
        .map(ai => ({ ...ai, text: (ai.text||'').trim() }))
        .filter(ai => ai.text)
        .map(ai => {
          const [locKey, empIdxStr] = (ai.assignedKey||'').split('::');
          return {
            id: newActionItemId(), text: ai.text, deadline: ai.deadline || '',
            assignedLoc: ai.assignedKey ? locKey : '', assignedEmp: ai.assignedKey ? parseInt(empIdxStr,10) : null
          };
        });
      if(!recordingUrl.trim() && !notes.trim() && items.length === 0) return; // nothing to log
      if(!m.notesLog) m.notesLog = [];
      m.notesLog.push({ id: newMeetingEntryId(), date: isoDate(new Date()), recordingUrl: recordingUrl.trim(), notes: notes.trim(), actionItems: items });
      await saveMeetingsList();
      delete meetingDrafts[mid];
      await renderMeetings();
    };
  });
}

function wireVendorMeetingsHandlers(view){
  const tabDay = document.getElementById('vmTabDay');
  if(tabDay) tabDay.onclick = async () => { vendorMeetingsViewTab = 'day'; await renderVendorMeetings(); };
  const tabCompany = document.getElementById('vmTabCompany');
  if(tabCompany) tabCompany.onclick = async () => { vendorMeetingsViewTab = 'company'; await renderVendorMeetings(); };

  const completedDetails = document.getElementById('vmCompletedDetails');
  if(completedDetails) completedDetails.addEventListener('toggle', () => { vmCompletedExpanded = completedDetails.open; });

  view.querySelectorAll('.vmday-complete-btn').forEach(btn => {
    btn.onclick = async () => {
      const row = btn.closest('[data-cid]');
      const c = VENDOR_MEETINGS.find(x => x.id === row.dataset.cid);
      const m = c && (c.meetings||[]).find(x => x.id === row.dataset.mid);
      if(!m) return;
      m.status = 'Completed';
      m.completedAt = isoDate(new Date());
      await saveVendorMeetings();
      await renderVendorMeetings();
    };
  });

  const catDetails = document.getElementById('vmCatManagerDetails');
  if(catDetails) catDetails.addEventListener('toggle', () => { vmCatManagerExpanded = catDetails.open; });

  view.querySelectorAll('.vm-cat-row').forEach(row => {
    const idx = parseInt(row.dataset.idx, 10);
    row.querySelector('.vm-cat-name').onchange = async (e) => {
      const newName = (e.target.value || '').trim();
      if(!newName || newName === VENDOR_MEETING_CATEGORIES[idx]) { e.target.value = VENDOR_MEETING_CATEGORIES[idx]; return; }
      if(VENDOR_MEETING_CATEGORIES.includes(newName)){ showToast('That category already exists'); e.target.value = VENDOR_MEETING_CATEGORIES[idx]; return; }
      const oldName = VENDOR_MEETING_CATEGORIES[idx];
      VENDOR_MEETING_CATEGORIES[idx] = newName;
      await saveVendorMeetingCategories();
      await renameVendorMeetingCategory(oldName, newName);
      await renderVendorMeetings();
    };
    row.querySelector('.vm-cat-remove').onclick = async () => {
      const name = VENDOR_MEETING_CATEGORIES[idx];
      const inUse = VENDOR_MEETINGS.filter(c => c.category === name).length;
      const msg = inUse
        ? `Remove "${name}"? ${inUse} compan${inUse===1?'y':'ies'} tagged with it will show "No category" until reassigned.`
        : `Remove "${name}"?`;
      if(!await appConfirm(msg, 'Remove')) return;
      VENDOR_MEETING_CATEGORIES.splice(idx, 1);
      await saveVendorMeetingCategories();
      await removeVendorMeetingCategory(name);
      await renderVendorMeetings();
    };
  });
  const newVmCatBtn = document.getElementById('newVmCatBtn');
  if(newVmCatBtn) newVmCatBtn.onclick = async () => {
    const input = document.getElementById('newVmCatName');
    const name = (input.value || '').trim();
    if(!name) return;
    if(VENDOR_MEETING_CATEGORIES.includes(name)){ showToast('That category already exists'); return; }
    VENDOR_MEETING_CATEGORIES.push(name);
    await saveVendorMeetingCategories();
    await renderVendorMeetings();
  };

  const newVendorBtn = document.getElementById('newVendorBtn');
  if(newVendorBtn) newVendorBtn.onclick = async () => {
    const name = (document.getElementById('newVendorName').value || '').trim();
    const category = document.getElementById('newVendorCategory').value;
    if(!name) return;
    VENDOR_MEETINGS.push({ id: newVendorId(), company: name, category, notes: '', meetings: [], createdAt: isoDate(new Date()) });
    await saveVendorMeetings();
    await renderVendorMeetings();
  };

  view.querySelectorAll('.vendor-card').forEach(card => {
    const cid = card.dataset.cid;
    const findC = () => VENDOR_MEETINGS.find(c => c.id === cid);

    const bindC = (sel, prop) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const c = findC(); if(!c) return; c[prop] = e.target.value; await saveVendorMeetings(); };
    };
    bindC('.vm-company-name', 'company');
    bindC('.vm-company-cat', 'category');
    bindC('.vm-company-notes', 'notes');

    const removeBtn = card.querySelector('.vendor-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      const c = findC(); if(!c) return;
      if(!await appConfirm(`Delete "${c.company}" and its whole meeting history? This cannot be undone.`, 'Delete')) return;
      const i = VENDOR_MEETINGS.findIndex(x => x.id === cid);
      if(i > -1) VENDOR_MEETINGS.splice(i, 1);
      await saveVendorMeetings();
      await renderVendorMeetings();
    };

    const addDateBtn = card.querySelector('.add-vm-date-btn');
    if(addDateBtn) addDateBtn.onclick = async () => {
      const input = card.querySelector('.add-vm-date-input');
      const date = input.value;
      if(!date) return;
      const c = findC(); if(!c) return;
      if(!c.meetings) c.meetings = [];
      c.meetings.push({ id: newVendorMeetingId(), date, status: 'Scheduled', completedAt: '', notes: '', attendees: [] });
      await saveVendorMeetings();
      await renderVendorMeetings();
    };

    card.querySelectorAll('.vm-date-row').forEach(row => {
      const mid = row.dataset.mid;
      const findM = () => { const c = findC(); return c && (c.meetings||[]).find(m => m.id === mid); };

      const dateInput = row.querySelector('.vm-date-input');
      if(dateInput) dateInput.onchange = async (e) => {
        const m = findM(); if(!m) return;
        m.date = e.target.value;
        await saveVendorMeetings();
        await renderVendorMeetings();
      };

      const completeBtn = row.querySelector('.vm-complete-btn');
      if(completeBtn) completeBtn.onclick = async () => {
        const m = findM(); if(!m) return;
        m.status = 'Completed';
        m.completedAt = isoDate(new Date());
        await saveVendorMeetings();
        await renderVendorMeetings();
      };

      row.querySelectorAll('.vm-attendee-check').forEach(cb => {
        cb.onchange = async () => {
          const m = findM(); if(!m) return;
          m.attendees = Array.from(row.querySelectorAll('.vm-attendee-check:checked')).map(el => el.value);
          await saveVendorMeetings();
        };
      });

      const removeDateBtn = row.querySelector('.vm-date-remove');
      if(removeDateBtn) removeDateBtn.onclick = async () => {
        if(!await appConfirm('Remove this meeting date?')) return;
        const c = findC(); if(!c) return;
        const i = (c.meetings||[]).findIndex(m => m.id === mid);
        if(i > -1) c.meetings.splice(i, 1);
        await saveVendorMeetings();
        await renderVendorMeetings();
      };
    });
  });
}

// ---- Project Planner (owner-only). Projects with steps assigned to specific employees,
// deadlines, status, and attachments (a pasted Google Drive/file link, or an uploaded file
// stored as a data URL). Employees see just their own assigned steps inline in their daily
// view (see renderProjectsPanel above) and can update status there - everything else here
// (creating projects, adding/removing steps, reassigning, deleting) is admin-only. ----
let projectsShown = false;
let ownerBoardShown = false;

function allRosterTargets(){
  const out = [];
  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => out.push({ locKey, empIdx, label: `${loc.name} \u2014 ${emp.label}`, archived: !!emp.archived }));
  });
  return out;
}
// Same as allRosterTargets() but leaves out removed roles - use this for populating any
// "assign to" / "attendee" dropdown so a removed role can't be picked for NEW work. Existing
// assignments made before a role was removed keep resolving fine through allRosterTargets()
// itself (which still includes everyone), so nothing already on the books breaks or goes
// "Unassigned" - see dropdownTargets() below for showing an already-picked removed role too.
function activeRosterTargets(){
  return allRosterTargets().filter(x => !x.archived);
}
// Builds the option list for one "assign to"/attendee dropdown: every active role, PLUS
// whichever already-selected value(s) are a removed role, so an existing pick doesn't just
// silently vanish from the UI - it stays visible, labeled (Removed), until someone changes it.
// selectedKeys is a single "loc::idx" string, an array of them (multi-selects), or null/empty.
function dropdownTargets(selectedKeys){
  const active = activeRosterTargets();
  const activeKeys = new Set(active.map(x => x.locKey + '::' + x.empIdx));
  const wanted = Array.isArray(selectedKeys) ? selectedKeys : (selectedKeys ? [selectedKeys] : []);
  const full = allRosterTargets();
  const extras = [];
  wanted.forEach(k => {
    if(!k || activeKeys.has(k) || extras.some(e => (e.locKey+'::'+e.empIdx) === k)) return;
    const found = full.find(x => (x.locKey+'::'+x.empIdx) === k);
    if(found) extras.push({ ...found, label: found.label + ' (Removed)' });
  });
  return [...active, ...extras];
}

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">

        <div class="p-steps">`;

    (p.steps||[]).forEach(s => {
      const assigneeKeys = s.assignees || [];
      const assigneeChecks = dropdownTargets(assigneeKeys).map(x => {
        const key = x.locKey + '::' + x.empIdx;
        return `<label style="display:flex;align-items:center;gap:4px;font-size:12px;">
          <input type="checkbox" class="s-assignee-check" value="${key}" ${assigneeKeys.includes(key)?'checked':''}> ${escapeAttr(x.label)}
        </label>`;
      }).join('');
      html += `<div class="proj-step-row" data-sid="${s.id}">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <input type="text" class="s-title" value="${escapeAttr(s.title)}" placeholder="Step / task" style="flex:1;min-width:200px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
          <input type="date" class="s-due" value="${escapeAttr(s.dueDate||'')}" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
          <select class="s-status" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="Not Started" ${s.status==='Not Started'?'selected':''}>Not Started</option>
            <option value="In Progress" ${s.status==='In Progress'?'selected':''}>In Progress</option>
            <option value="Done" ${s.status==='Done'?'selected':''}>Done</option>
          </select>
          <button class="mini-btn danger-mini s-remove">Remove</button>
        </div>
        <div style="margin-top:6px;">
          <span style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);display:block;margin-bottom:4px;">Assigned to (check everyone who should see and work this step):</span>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">${assigneeChecks || '<span style="font-size:11.5px;color:var(--win-text-secondary);">No roster roles yet</span>'}</div>
        </div>
        <textarea class="s-notes" placeholder="Notes for this step..." style="width:100%;min-height:36px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;margin-top:6px;">${escapeHtml(s.notes||'')}</textarea>
        <div class="s-attachments" style="margin-top:6px;">${renderAttachmentChips(s.attachments)}</div>
        <div style="display:flex;gap:8px;margin-top:6px;">
          <input type="text" class="s-link-name" placeholder="Link name (e.g. Drive folder)" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:5px 8px;font-size:11.5px;width:180px;">
          <input type="text" class="s-link-url" placeholder="https://drive.google.com/..." style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:5px 8px;font-size:11.5px;">
          <button class="mini-btn s-addlink">+ Add link</button>
          <button class="mini-btn s-addfile">+ Add file</button>
        </div>
      </div>`;
    });

    html += `</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <input type="text" class="add-step-input" placeholder="New step / task..." style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;">
          <button class="mini-btn primary-mini add-step-btn">+ Add step</button>
        </div>
      </div>
    </details>`;
  });

  view.innerHTML = html;
  wireProjectsHandlers(view);
}

function wireProjectsHandlers(view){
  const newBtn = document.getElementById('newProjBtn');
  if(newBtn) newBtn.onclick = async () => {
    const input = document.getElementById('newProjName');
    const name = (input.value || '').trim();
    if(!name) return;
    PROJECTS.push({ id: newProjectId(), name, description: '', deadline: '', status: 'Active', createdAt: isoDate(new Date()), steps: [] });
    await saveProjects();
    await renderProjects();
  };

  view.querySelectorAll('details[data-pid]').forEach(card => {
    const pid = card.dataset.pid;
    const findP = () => PROJECTS.find(p => p.id === pid);

    const bindP = (sel, prop) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const p = findP(); if(!p) return; p[prop] = e.target.value; await saveProjects(); };
    };
    bindP('.p-name', 'name');
    bindP('.p-status', 'status');
    bindP('.p-deadline', 'deadline');
    bindP('.p-desc', 'description');

    const removeBtn = card.querySelector('.p-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!await appConfirm('Delete this project and all its steps? This cannot be undone.', 'Delete')) return;
      const i = PROJECTS.findIndex(p => p.id === pid);
      if(i > -1) PROJECTS.splice(i, 1);
      await saveProjects();
      await renderProjects();
    };

    const addStepBtn = card.querySelector('.add-step-btn');
    if(addStepBtn) addStepBtn.onclick = async () => {
      const input = card.querySelector('.add-step-input');
      const title = (input.value || '').trim();
      if(!title) return;
      const p = findP(); if(!p) return;
      if(!p.steps) p.steps = [];
      p.steps.push({ id: newStepId(), title, assignees: [], dueDate: '', status: 'Not Started', notes: '', attachments: [] });
      await saveProjects();
      await renderProjects();
    };

    card.querySelectorAll('.proj-step-row').forEach(row => {
      const sid = row.dataset.sid;
      const findS = () => { const p = findP(); return p && (p.steps||[]).find(s => s.id === sid); };

      const bindS = (sel, prop) => {
        const el = row.querySelector(sel);
        if(!el) return;
        el.onchange = async (e) => { const s = findS(); if(!s) return; s[prop] = e.target.value; await saveProjects(); };
      };
      bindS('.s-title', 'title');
      bindS('.s-due', 'dueDate');
      bindS('.s-status', 'status');
      bindS('.s-notes', 'notes');

      row.querySelectorAll('.s-assignee-check').forEach(cb => {
        cb.onchange = async () => {
          const s = findS(); if(!s) return;
          s.assignees = Array.from(row.querySelectorAll('.s-assignee-check:checked')).map(el => el.value);
          await saveProjects();
        };
      });

      const removeS = row.querySelector('.s-remove');
      if(removeS) removeS.onclick = async () => {
        if(!await appConfirm('Remove this step?')) return;
        const p = findP(); if(!p) return;
        const i = (p.steps||[]).findIndex(s => s.id === sid);
        if(i > -1) p.steps.splice(i, 1);
        await saveProjects();
        await renderProjects();
      };

      const addLinkBtn = row.querySelector('.s-addlink');
      if(addLinkBtn) addLinkBtn.onclick = async () => {
        const nameInput = row.querySelector('.s-link-name');
        const urlInput = row.querySelector('.s-link-url');
        const url = (urlInput.value || '').trim();
        if(!url) return;
        const name = (nameInput.value || '').trim() || url;
        const s = findS(); if(!s) return;
        if(!s.attachments) s.attachments = [];
        s.attachments.push({ id: newAttachId(), kind:'link', name, url, addedAt: isoDate(new Date()) });
        await saveProjects();
        await renderProjects();
      };

      const addFileBtn = row.querySelector('.s-addfile');
      if(addFileBtn) addFileBtn.onclick = () => {
        const input = document.getElementById('fileInput');
        input.value = '';
        input.accept = '';
        input.onchange = async () => {
          if(input.files && input.files[0]){
            const file = input.files[0];
            const durl = await fileToDataUrl(file);
            const s = findS(); if(!s) return;
            if(!s.attachments) s.attachments = [];
            s.attachments.push({ id: newAttachId(), kind:'file', name: file.name, dataUrl: durl, addedAt: isoDate(new Date()) });
            await saveProjects();
            await renderProjects();
            input.accept = 'image/*';
          }
        };
        input.click();
      };
    });
  });
}

// ---- Owner Board (owner-only). Everything that needs the owner's own attention in one place:
// action items assigned to the owner, completed items still waiting on the owner's own
// verification, everything overdue across the whole team, metrics/meetings that haven't been
// kept up with, and the owner's own personal task list. Nothing here is new data the owner
// enters by hand except the personal task list and the "which roster line is me" picker -
// everything else is just a different lens on MEETINGS/METRICS/ACTION_ITEM_STATUS. ----
async function renderOwnerBoard(){
  await refreshServerState();
  await loadAllMetricEntriesSnapshot();
  const view = document.getElementById('ownerBoardView');
  const targets = allRosterTargets();
  const today = todayStr();

  const [selLoc, selEmpStr] = (OWNER_SELF||'').split('::');
  const selEmp = selEmpStr !== undefined ? parseInt(selEmpStr,10) : null;
  const myItems = (selLoc && selEmp !== null && !isNaN(selEmp)) ? myMeetingActionItems(selLoc, selEmp) : [];
  const toVerify = allUnverifiedCompleted();
  const overdue = overdueActionItemsGlobal();
  const missingMetrics = metricsNotEntered();
  const missedMeetings = meetingsNotCompleted();

  const section = (title, bodyHtml, emptyMsg) => `
    <div class="group-title" style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--win-text-secondary);margin:22px 0 8px 2px;">${title}</div>
    ${bodyHtml || `<div class="empty-note">${emptyMsg}</div>`}
  `;

  let html = `<div class="monthly-header"><h1>Owner Board</h1></div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 10px;">
      Everything that needs your attention in one place: what's assigned to you, completed work
      still waiting on your sign-off, everything overdue across the team, metrics and meetings
      that have gone quiet, progress on every active project, what's next on the vendor meeting
      schedule, and your own personal task list.
    </p>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <label style="font-size:11.5px;font-weight:600;color:var(--win-text-secondary);">Which roster line is you?</label>
      <select id="ownerSelfSelect" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:5px;font-size:12px;">
        <option value="">— Select —</option>
        ${dropdownTargets(OWNER_SELF).map(x => `<option value="${x.locKey}::${x.empIdx}" ${OWNER_SELF===(x.locKey+'::'+x.empIdx)?'selected':''}>${escapeAttr(x.label)}</option>`).join('')}
      </select>
    </div>
  `;

  html += section('Assigned to you', myItems.length ? myItems.map(({meeting, item}) => {
    const od = item.deadline && item.deadline < today;
    return `<div class="task-card" data-itemid="${item.id}" style="padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:12.5px;font-weight:600;flex:1;min-width:180px;">${escapeHtml(item.text)}</span>
        <span style="font-size:11px;color:var(--win-text-secondary);">${escapeHtml(meeting.title||'Meeting')}</span>
        ${item.deadline ? `<span class="status-pill-sm" style="background:${od?'var(--kpi-bad)':'var(--kpi-risk)'};">${od?'Overdue — ':'Due '}${escapeHtml(item.deadline)}</span>` : ''}
        <button class="mini-btn primary-mini ob-complete-btn">Mark complete</button>
      </div>
    </div>`;
  }).join('') : '', OWNER_SELF ? 'Nothing assigned to you right now.' : 'Pick which roster line is you above to see items assigned to you here.');

  html += section('Needs your verification', toVerify.length ? toVerify.map(({meeting, item, who}) => {
    const assigneeNotes = actionItemNotes(item.id);
    const links = actionItemLinks(item.id);
    return `<div class="task-card" data-itemid="${item.id}" style="padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:12.5px;font-weight:600;flex:1;min-width:180px;">${escapeHtml(item.text)}</span>
        <span style="font-size:11px;color:var(--win-text-secondary);">${escapeHtml(who)} · ${escapeHtml(meeting.title||'Meeting')}</span>
        <button class="mini-btn primary-mini ob-verify-btn">Mark verified</button>
      </div>
      ${assigneeNotes ? `<div style="margin-top:4px;font-size:11.5px;color:var(--win-text-secondary);">Note: ${escapeHtml(assigneeNotes)}</div>` : ''}
      ${links.length ? `<div style="margin-top:4px;">${links.map(lk => `<a href="${escapeAttr(lk.url)}" target="_blank" rel="noopener" style="display:inline-block;font-size:11px;border:1px solid var(--win-border-strong);border-radius:5px;padding:2px 7px;margin:2px 4px 0 0;color:var(--win-accent);text-decoration:none;">${escapeHtml(lk.label || lk.url)}</a>`).join('')}</div>` : ''}
    </div>`;
  }).join('') : '', 'Nothing waiting on your sign-off.');

  html += section('Overdue action items (everyone)', overdue.length ? `<table style="width:100%;border-collapse:collapse;font-size:12.5px;">
    <thead><tr>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Item</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Assigned to</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Meeting</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Due</th>
    </tr></thead>
    <tbody>${overdue.map(({meeting, item, who}) => `<tr style="border-top:1px solid var(--win-border);">
      <td style="padding:5px 8px;">${escapeHtml(item.text)}</td>
      <td style="padding:5px 8px;color:var(--win-text-secondary);">${escapeHtml(who)}</td>
      <td style="padding:5px 8px;color:var(--win-text-secondary);">${escapeHtml(meeting.title||'')}</td>
      <td style="padding:5px 8px;"><span class="status-pill-sm" style="background:var(--kpi-bad);">${escapeHtml(item.deadline)}</span></td>
    </tr>`).join('')}</tbody>

  html += section('Metrics not entered', missingMetrics.length ? `<table style="width:100%;border-collapse:collapse;font-size:12.5px;">
    <thead><tr>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Metric</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Assigned to</th>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Missing period</th>

    <tbody>${missingMetrics.map(({metric, who, period}) => `<tr style="border-top:1px solid var(--win-border);">

      <td style="padding:5px 8px;color:var(--win-text-secondary);">${escapeHtml(who)}</td>
      <td style="padding:5px 8px;"><span class="status-pill-sm" style="background:var(--kpi-bad);">${escapeHtml(period)}</span></td>

  html += section('Meetings not completed', missedMeetings.length ? `<table style="width:100%;border-collapse:collapse;font-size:12.5px;">
    <thead><tr>
      <th style="text-align:left;padding:4px 8px;font-size:10.5px;text-transform:uppercase;color:var(--win-text-secondary);">Meeting</th>

    <tbody>${missedMeetings.map(({meeting, scheduled}) => `<tr style="border-top:1px solid var(--win-border);">

    </tr>`).join('')}</tbody>
  </table>` : '', 'Every meeting is logged.');

  const activeProjects = PROJECTS.filter(p => p.status !== 'Completed');
  html += section('Projects', activeProjects.length ? activeProjects.map(p => {
    const steps = p.steps || [];
    const doneSteps = steps.filter(s => s.status === 'Done');
    const total = steps.length;
    const doneCount = doneSteps.length;
    const pct = total ? Math.round((doneCount/total)*100) : 0;
    const od = p.deadline && p.deadline < today;
    return `<div class="task-card" style="padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:13px;font-weight:600;flex:1;min-width:180px;">${escapeHtml(p.name)}</span>
        <span class="status-pill-sm" style="background:${p.status==='On Hold'?'var(--kpi-risk)':'var(--kpi-good)'};">${escapeHtml(p.status||'Active')}</span>

  view.innerHTML = html;

    OWNER_SELF = e.target.value;
    await saveOwnerSelf();
    await renderOwnerBoard();

  view.querySelectorAll('.ob-complete-btn').forEach(btn => {

      await renderOwnerBoard();

  view.querySelectorAll('.ob-verify-btn').forEach(btn => {
    btn.onclick = async () => {

      showToast('Verified');
      await renderOwnerBoard();
    };
  });

  view.querySelectorAll('.ob-vm-complete-btn').forEach(btn => {
    btn.onclick = async () => {
      const row = btn.closest('[data-cid]');
      const c = VENDOR_MEETINGS.find(x => x.id === row.dataset.cid);
      const m = c && (c.meetings||[]).find(x => x.id === row.dataset.mid);
      if(!m) return;
      m.status = 'Completed';
      m.completedAt = isoDate(new Date());
      await saveVendorMeetings();
      showToast('Marked complete');
      await renderOwnerBoard();
    };
  });

  view.querySelectorAll('.ort-add').forEach(btn => {
    btn.onclick = async () => {
      const cadence = btn.dataset.cadence;
      const input = view.querySelector(`.ort-input[data-cadence="${cadence}"]`);
      const text = (input.value||'').trim();
      if(!text) return;
      OWNER_RECURRING_TASKS.push({ id: newOwnerRecurringId(), text, cadence });
      await saveOwnerRecurringTasks();
      showToast('Added');
      await renderOwnerBoard();
    };
  });
  view.querySelectorAll('.seg-group[data-ortid]').forEach(seg => {
    const tid = seg.dataset.ortid;
    seg.querySelectorAll('.seg-btn').forEach(btn => {
      btn.onclick = async () => {
        const t = OWNER_RECURRING_TASKS.find(x => x.id === tid); if(!t) return;
        const periodKey = ownerRecurringPeriodKey(t.cadence);
        const current = (OWNER_RECURRING_STATUS[tid] || {})[periodKey] || '';
        const newVal = current === btn.dataset.val ? '' : btn.dataset.val;
        if(!OWNER_RECURRING_STATUS[tid]) OWNER_RECURRING_STATUS[tid] = {};
        if(newVal) OWNER_RECURRING_STATUS[tid][periodKey] = newVal; else delete OWNER_RECURRING_STATUS[tid][periodKey];
        await saveOwnerRecurringStatus();
        seg.querySelectorAll('.seg-btn').forEach(b => b.className = 'seg-btn');
        if(newVal) btn.classList.add('sel-'+newVal);
      };
    });
  });
  view.querySelectorAll('.onetime-row[data-ortid] .ort-remove').forEach(btn => {
    btn.onclick = async () => {
      const row = btn.closest('[data-ortid]');
      const tid = row.dataset.ortid;
      if(!await appConfirm('Remove this task? Past check-ins for it are kept but will no longer be shown.')) return;
      OWNER_RECURRING_TASKS = OWNER_RECURRING_TASKS.filter(x => x.id !== tid);
      await saveOwnerRecurringTasks();
      await renderOwnerBoard();
    };
  });

  const addBtn = document.getElementById('ownerTaskAddBtn');
  if(addBtn) addBtn.onclick = async () => {
    const input = document.getElementById('ownerTaskInput');
    const dateInput = document.getElementById('ownerTaskDate');
    const text = (input.value||'').trim();
    if(!text) return;
    OWNER_TASKS.push({ id: newOwnerTaskId(), text, dueDate: dateInput.value || '', done: false });
    await saveOwnerTasks();
    input.value = ''; dateInput.value = '';
    showToast('Added');
    await renderOwnerBoard();
  };
  view.querySelectorAll('#ownerTaskList [data-tid]').forEach(row => {
    const tid = row.dataset.tid;
    const toggle = row.querySelector('.ob-task-toggle');
    if(toggle) toggle.onchange = async (e) => {
      const t = OWNER_TASKS.find(x => x.id === tid); if(!t) return;
      t.done = e.target.checked;
      await saveOwnerTasks();
      await renderOwnerBoard();
    };
    const rm = row.querySelector('.ob-task-remove');
    if(rm) rm.onclick = async () => {
      OWNER_TASKS = OWNER_TASKS.filter(x => x.id !== tid);
      await saveOwnerTasks();
      await renderOwnerBoard();
    };
  });
}

// assigned, unit, how it's calculated, where to get the info, and a monthly goal) - this is
// where Rob replaces the manual "Metrics Dashboard 2026" Google Sheet. Each metric shows its
// own recent entries (read-only here) so there's a place to actually SEE the numbers over time.
// Entering new day-to-day numbers happens on the assigned employee's own page (see
// renderMetricsPanel above). Give two metrics for different stores the SAME name (e.g.
// "Delivered Units" for both Bridgeland and Candy Cars) and they'll line up side by side in the
// public Metrics Dashboard (see renderDashboard further down). ----
let metricsShown = false;
let trainingShown = false;
let targetsShown = false;
let trainingLibraryShown = false;

function recentDailyDates(n){
  const out = [];
  const d = new Date(); d.setHours(0,0,0,0);
  while(out.length < n){
    if(d.getDay() !== 0){ out.unshift(new Date(d)); } // skip Sundays (closed)
    d.setDate(d.getDate()-1);
  }
  return out;
}
function recentMondays(n){
  const out = [];
  let m = mondayOf(new Date());
  for(let i=0;i<n;i++){ out.unshift(new Date(m)); m.setDate(m.getDate()-7); }
  return out;
}
function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthKeyLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});
}

  html += `</div>`;
  }

  if(reviewOrArchived.length){

      <div style="padding:4px 12px 12px;">

        </div>`).join('')}

    </details>`;
  }

  view.innerHTML = html;
  wireMetricsAdminHandlers(view);
}

function wireMetricsAdminHandlers(view){
  const deptDetails = document.getElementById('deptManagerDetails');
  if(deptDetails) deptDetails.addEventListener('toggle', () => { deptManagerExpanded = deptDetails.open; });
  const catDetails = document.getElementById('catManagerDetails');
  if(catDetails) catDetails.addEventListener('toggle', () => { catManagerExpanded = catDetails.open; });
  const archDetails = document.getElementById('archivedMetricsDetails');
  if(archDetails) archDetails.addEventListener('toggle', () => { expandedArchivedMetrics = archDetails.open; });

  const tabDaily = document.getElementById('metricsTabDaily');
  const tabWeekly = document.getElementById('metricsTabWeekly');
  if(tabDaily) tabDaily.onclick = async () => { metricsCadenceTab = 'Daily'; await renderMetrics(); };
  if(tabWeekly) tabWeekly.onclick = async () => { metricsCadenceTab = 'Weekly'; await renderMetrics(); };

  view.querySelectorAll('.dept-row').forEach(row => {
    const idx = parseInt(row.dataset.idx, 10);
    const nameEl = row.querySelector('.dept-name');
    nameEl.onchange = async (e) => {
      const newName = (e.target.value || '').trim();
      if(!newName || newName === DEPARTMENTS[idx]) { e.target.value = DEPARTMENTS[idx]; return; }
      if(DEPARTMENTS.includes(newName)){ showToast('That department already exists'); e.target.value = DEPARTMENTS[idx]; return; }
      const oldName = DEPARTMENTS[idx];
      DEPARTMENTS[idx] = newName;
      await saveDepartments();
      await renameDepartment(oldName, newName);
      await renderMetrics();
    };
    row.querySelector('.dept-remove').onclick = async () => {
      const name = DEPARTMENTS[idx];
      const inUse = METRICS.filter(m => m.department === name).length;
      const msg = inUse
        ? `Remove "${name}"? ${inUse} metric${inUse===1?'':'s'} tagged with it will show "No department" until reassigned. Any meeting set to it switches to no department selected.`
        : `Remove "${name}"?`;
      if(!await appConfirm(msg, 'Remove')) return;
      DEPARTMENTS.splice(idx, 1);
      await saveDepartments();
      await removeDepartment(name);
      await renderMetrics();
    };
  });
  const newDeptBtn = document.getElementById('newDeptBtn');
  if(newDeptBtn) newDeptBtn.onclick = async () => {
    const input = document.getElementById('newDeptName');
    const name = (input.value || '').trim();
    if(!name) return;
    if(DEPARTMENTS.includes(name)){ showToast('That department already exists'); return; }
    DEPARTMENTS.push(name);
    await saveDepartments();
    await renderMetrics();
  };

  view.querySelectorAll('.cat-row').forEach(row => {
    const idx = parseInt(row.dataset.idx, 10);
    const nameEl = row.querySelector('.cat-name');
    nameEl.onchange = async (e) => {
      const newName = (e.target.value || '').trim();
      if(!newName || newName === METRIC_CATEGORIES[idx]) { e.target.value = METRIC_CATEGORIES[idx]; return; }
      if(METRIC_CATEGORIES.includes(newName)){ showToast('That category already exists'); e.target.value = METRIC_CATEGORIES[idx]; return; }
      const oldName = METRIC_CATEGORIES[idx];
      METRIC_CATEGORIES[idx] = newName;
      await saveMetricCategories();
      await renameMetricCategory(oldName, newName);
      await renderMetrics();
    };
    row.querySelector('.cat-remove').onclick = async () => {
      const name = METRIC_CATEGORIES[idx];
      const inUse = METRICS.filter(m => (m.categories||[]).includes(name)).length;
      const msg = inUse
        ? `Remove "${name}"? It's currently tagged on ${inUse} metric${inUse===1?'':'s'} — they'll keep any other categories they're tagged with, they just lose this one.`
        : `Remove "${name}"?`;
      if(!await appConfirm(msg, 'Remove')) return;
      METRIC_CATEGORIES.splice(idx, 1);
      await saveMetricCategories();
      await removeMetricCategory(name);
      await renderMetrics();
    };
  });
  const newCatBtn = document.getElementById('newCatBtn');
  if(newCatBtn) newCatBtn.onclick = async () => {
    const input = document.getElementById('newCatName');
    const name = (input.value || '').trim();
    if(!name) return;
    if(METRIC_CATEGORIES.includes(name)){ showToast('That category already exists'); return; }
    METRIC_CATEGORIES.push(name);
    await saveMetricCategories();
    await renderMetrics();
  };

  const newBtn = document.getElementById('newMetricBtn');
  if(newBtn) newBtn.onclick = async () => {
    const name = (document.getElementById('newMetricName').value || '').trim();
    const cadence = document.getElementById('newMetricCadence').value;
    const targetVal = document.getElementById('newMetricTarget').value;
    const department = document.getElementById('newMetricDept').value;
    const category = document.getElementById('newMetricCategory').value;
    const storeLabel = (document.getElementById('newMetricStoreLabel').value || '').trim();
    if(!name) return;
    let assignedLoc = '', assignedEmp = null;
    if(targetVal){ const [l, eStr] = targetVal.split('::'); assignedLoc = l; assignedEmp = parseInt(eStr,10); }
    METRICS.push({ id: newMetricId(), name, cadence, assignedLoc, assignedEmp, department, status: 'active', categories: category ? [category] : [], storeLabel, unit: '', calculation: '', source: '', goals: {}, createdAt: isoDate(new Date()) });
    await saveMetrics();
    await renderMetrics();
  };

  view.querySelectorAll('.mt-restore').forEach(btn => {
    btn.onclick = async () => {
      const m = METRICS.find(x => x.id === btn.dataset.mid); if(!m) return;
      m.archived = false; m.status = 'active';
      await saveMetrics();
      await renderMetrics();
    };
  });

  view.querySelectorAll('details[data-mid]').forEach(card => {
    const mid = card.dataset.mid;
    const findM = () => METRICS.find(m => m.id === mid);

    const bind = (sel, prop) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const m = findM(); if(!m) return; m[prop] = e.target.value; await saveMetrics(); };
    };
    bind('.mt-name', 'name');
    bind('.mt-cadence', 'cadence');
    bind('.mt-unit', 'unit');
    bind('.mt-storelabel', 'storeLabel');
    bind('.mt-calc', 'calculation');
    bind('.mt-source', 'source');
    bind('.mt-dept', 'department');

    card.querySelectorAll('.mt-cat-check').forEach(cb => {
      cb.onchange = async () => {
        const m = findM(); if(!m) return;
        const checked = Array.from(card.querySelectorAll('.mt-cat-check')).filter(x => x.checked).map(x => x.value);
        m.categories = checked;
        await saveMetrics();
      };
    });

    card.querySelectorAll('.mt-goal').forEach(el => {
      el.onchange = async (e) => {
        const m = findM(); if(!m) return;
        if(!m.goals) m.goals = {};
        m.goals[e.target.dataset.monthkey] = e.target.value;
        await saveMetrics();
      };
    });

    const assignEl = card.querySelector('.mt-assign');
    if(assignEl) assignEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      const val = e.target.value;
      if(!val){ m.assignedLoc = ''; m.assignedEmp = null; }
      else { const [l, eStr] = val.split('::'); m.assignedLoc = l; m.assignedEmp = parseInt(eStr,10); }
      await saveMetrics();
    };

    const reviewBtn = card.querySelector('.mt-review');
    if(reviewBtn) reviewBtn.onclick = async () => {
      const m = findM(); if(!m) return;
      m.status = m.status === 'review' ? 'active' : 'review';
      await saveMetrics();
      await renderMetrics();
    };

    const removeBtn = card.querySelector('.mt-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!await appConfirm('Delete this metric? Its recorded history stays on the server but will no longer be shown anywhere.', 'Delete')) return;
      const i = METRICS.findIndex(m => m.id === mid);
      if(i > -1) METRICS.splice(i,1);
      await saveMetrics();
      await renderMetrics();
    };
  });
}

    TRAINING.filter(t => (t.platform || 'Uncategorized') === platform).forEach(t => {

          <input type="text" class="tr-title" value="${escapeAttr(t.title)}" style="flex:1;min-width:180px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
          <input type="text" class="tr-platform" value="${escapeAttr(t.platform||'')}" placeholder="Platform" style="width:160px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">

function wireTrainingAdminHandlers(view){
  const newBtn = document.getElementById('newTrnBtn');
  if(newBtn) newBtn.onclick = async () => {
    const title = (document.getElementById('newTrnTitle').value || '').trim();
    const platform = (document.getElementById('newTrnPlatform').value || '').trim();
    const type = document.getElementById('newTrnType').value;
    const url = (document.getElementById('newTrnUrl').value || '').trim();
    const roleTags = (document.getElementById('newTrnRoles').value || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    const linkedMetricId = document.getElementById('newTrnMetric').value || '';
    const managersOnly = document.getElementById('newTrnManagersOnly').checked;
    if(!title || !url){ showToast('Title and URL are required'); return; }
    TRAINING.push({ id: newTrainingId(), title, platform, type, url, roleTags, linkedMetricId, managersOnly, notes: '', createdAt: isoDate(new Date()) });
    await saveTraining();
    await renderTraining();
  };

  view.querySelectorAll('.setup-task-row[data-tid]').forEach(row => {
    const tid = row.dataset.tid;
    const findT = () => TRAINING.find(t => t.id === tid);
    const bind = (sel, prop, transform) => {
      const el = row.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const t = findT(); if(!t) return; t[prop] = transform ? transform(e.target.value) : e.target.value; await saveTraining(); };
    };
    bind('.tr-title', 'title');
    bind('.tr-platform', 'platform');
    bind('.tr-type', 'type');
    bind('.tr-url', 'url');
    bind('.tr-roles', 'roleTags', v => v.split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
    const metricEl = row.querySelector('.tr-metric');
    if(metricEl) metricEl.onchange = async (e) => { const t = findT(); if(t){ t.linkedMetricId = e.target.value || ''; await saveTraining(); } };
    const moEl = row.querySelector('.tr-managers-only');
    if(moEl) moEl.onchange = async (e) => { const t = findT(); if(t){ t.managersOnly = e.target.checked; await saveTraining(); } };
    const removeBtn = row.querySelector('.tr-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!isOwnerAdmin()){ showToast('Owner access required to delete training'); return; }
      if(!await appConfirm('Delete this training video?', 'Delete')) return;
      const i = TRAINING.findIndex(t => t.id === tid);
      if(i > -1) TRAINING.splice(i,1);
      await saveTraining();
      await renderTraining();
    };
  });
}

// ---- Public Training Library: NOT admin-gated (everyone can browse), filtered to whoever is
// currently selected in the sidebar - same "who's selected" model the daily checklist itself
// uses. Manager-only videos only show once the viewer has unlocked staff access. ----
function trainingVisibleToCurrentEmployee(t){
  if(t.managersOnly && !isStaff()) return false;
  if(!t.roleTags || t.roleTags.length === 0) return true;
  const loc = LOCATIONS[currentLoc];
  const emp = loc && loc.data[currentEmployee];
  if(!emp) return true;
  const label = emp.label.toLowerCase();
  return t.roleTags.some(tag => label.includes(tag));
}

async function renderTrainingLibrary(){
  await refreshServerState();
  const view = document.getElementById('trainingLibraryView');
  const loc = LOCATIONS[currentLoc];
  const emp = loc && loc.data[currentEmployee];
  const empLabel = emp ? emp.label : 'the selected role';

  let html = `
    <div class="monthly-header"><h1>Training Library</h1></div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 16px;">
      Showing videos relevant to <b>${escapeHtml(empLabel)}</b>${isStaff() ? ' — staff access unlocked, so manager-only videos are included' : ''}.
      Switch who's selected in the sidebar to see what someone else sees.
    </p>
  `;

  const visible = TRAINING.filter(trainingVisibleToCurrentEmployee);
  if(visible.length === 0){
    html += `<div class="empty-note">No training videos for this role yet.</div>`;
  }

  const platforms = [...new Set(visible.map(t => t.platform || 'Uncategorized'))].sort((a,b) => a.localeCompare(b));
  platforms.forEach(platform => {
    html += `<div class="group-title" style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--win-text-secondary);margin:18px 0 8px 2px;">${escapeHtml(platform)}</div>`;
    visible.filter(t => (t.platform || 'Uncategorized') === platform).forEach(t => {

        <div style="font-weight:600;font-size:13px;">${escapeHtml(t.title)}
          <span style="font-weight:400;color:var(--win-text-secondary);font-size:11.5px;"> · ${escapeHtml(t.type||'')}</span>
          ${t.managersOnly ? `<span class="status-pill-sm st-progress" style="margin-left:8px;">Managers only</span>` : ''}
        </div>
        ${metric ? `<div style="font-size:11.5px;color:var(--win-text-secondary);margin-top:3px;">KPI: ${escapeHtml(metric.name)}</div>` : ''}
      </a>`;
    });
  });

  view.innerHTML = html;
}

// ---- Team Targets: a manager (or owner) sets a target + tolerance for a specific employee on
// a specific KPI. Reference only - shown next to that metric's latest entered number so a
// manager can scan the list and see who needs coaching on what. Nothing is auto-flagged. Full
// CRUD for any staff (owner or manager). ----
async function renderTargets(){
  await refreshServerState();
  const view = document.getElementById('targetsView');
  const targets = allRosterTargets();

  let html = `
    <div class="monthly-header"><h1>Team Targets</h1></div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 16px;">
      Set the target and acceptable tolerance you expect from each person on a KPI they track.
      This is reference only — it shows their latest entered number right next to your target
      so you can scan the list and see who needs coaching, but nothing is auto-flagged. Any
      manager or owner can add, edit, or remove targets here.
    </p>
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <select id="newTgtEmp" style="flex:1;min-width:200px;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px;font-size:12.5px;">
        <option value="">Employee…</option>
        ${dropdownTargets().map(x => `<option value="${x.locKey}::${x.empIdx}">${escapeAttr(x.label)}</option>`).join('')}
      </select>
      <select id="newTgtMetric" style="flex:1;min-width:200px;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px;font-size:12.5px;">
        <option value="">Metric…</option>
        ${METRICS.map(m => `<option value="${m.id}">${escapeAttr(m.name)}</option>`).join('')}
      </select>
      <input type="text" id="newTgtTarget" placeholder="Target (e.g. 90%)" style="width:130px;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px 10px;font-size:12.5px;">
      <input type="text" id="newTgtTolerance" placeholder="Tolerance (e.g. ± 5%)" style="width:150px;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px 10px;font-size:12.5px;">
      <button class="mini-btn primary-mini" id="newTgtBtn">+ Set target</button>
    </div>
  `;

  if(TARGETS.length === 0){
    html += `<div class="empty-note">No targets set yet.</div>`;
  } else {
    const byEmp = {};
    TARGETS.forEach(tg => {
      const key = `${tg.locKey}::${tg.empIdx}`;
      if(!byEmp[key]) byEmp[key] = [];
      byEmp[key].push(tg);
    });
    Object.keys(byEmp).forEach(key => {
      const x = targets.find(t => `${t.locKey}::${t.empIdx}` === key);
      html += `<div class="group-title" style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--win-text-secondary);margin:18px 0 8px 2px;">${escapeHtml(x ? x.label : key)}</div>`;
      byEmp[key].forEach(tg => {
        const metric = METRICS.find(m => m.id === tg.metricId);
        html += `<div class="setup-task-row" data-tgid="${tg.id}" data-metricid="${tg.metricId}" style="border-top:1px solid var(--win-border);padding:10px 0;">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <div style="flex:1;min-width:160px;font-size:12.5px;font-weight:600;">${escapeHtml(metric ? metric.name : '(deleted metric)')}</div>
            <input type="text" class="tg-target" value="${escapeAttr(tg.target||'')}" placeholder="Target" style="width:110px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            <input type="text" class="tg-tolerance" value="${escapeAttr(tg.tolerance||'')}" placeholder="Tolerance" style="width:130px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            <span class="attach-chip tg-actual">Loading latest…</span>
            <button class="mini-btn danger-mini tg-remove">Remove</button>
          </div>
        </div>`;
      });
    });
  }

  view.innerHTML = html;
  wireTargetsHandlers(view);
  view.querySelectorAll('.setup-task-row[data-tgid]').forEach(async row => {
    const metricId = row.dataset.metricid;
    const chip = row.querySelector('.tg-actual');
    if(!metricId || !chip) return;
    const latest = await latestMetricEntry(metricId);
    chip.textContent = latest ? `Latest: ${latest.value} (${latest.date})` : 'No entries yet';
  });
}

function wireTargetsHandlers(view){
  const newBtn = document.getElementById('newTgtBtn');
  if(newBtn) newBtn.onclick = async () => {
    const empVal = document.getElementById('newTgtEmp').value;
    const metricId = document.getElementById('newTgtMetric').value;
    const target = (document.getElementById('newTgtTarget').value || '').trim();
    const tolerance = (document.getElementById('newTgtTolerance').value || '').trim();
    if(!empVal || !metricId){ showToast('Pick an employee and a metric'); return; }
    const [locKey, empIdxStr] = empVal.split('::');
    TARGETS.push({ id: newTargetId(), locKey, empIdx: parseInt(empIdxStr,10), metricId, target, tolerance, notes: '', updatedAt: isoDate(new Date()) });
    await saveTargets();
    await renderTargets();
  };

  view.querySelectorAll('.setup-task-row[data-tgid]').forEach(row => {
    const tgid = row.dataset.tgid;
    const findTg = () => TARGETS.find(t => t.id === tgid);
    const targetEl = row.querySelector('.tg-target');
    if(targetEl) targetEl.onchange = async (e) => { const tg = findTg(); if(tg){ tg.target = e.target.value; await saveTargets(); } };
    const tolEl = row.querySelector('.tg-tolerance');
    if(tolEl) tolEl.onchange = async (e) => { const tg = findTg(); if(tg){ tg.tolerance = e.target.value; await saveTargets(); } };
    const removeBtn = row.querySelector('.tg-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!await appConfirm('Remove this target?')) return;
      const i = TARGETS.findIndex(t => t.id === tgid);
      if(i > -1) TARGETS.splice(i,1);
      await saveTargets();
      await renderTargets();
    };
  });
}
