// Sums one metric's entries into a single month-to-date total - same logic the Entry table
// uses for "Month to date", just callable for any month so the Visual tab can build a trend.
async function metricMonthlyTotal(m, monthDate){
  const weeks = weeksTouchingMonth(monthDate);
  const entries = await loadMetricEntries(m.id);
  let dateStrs = [];
  weeks.forEach(w => {
    if(m.cadence === 'Weekly'){ dateStrs.push(isoDate(w)); }
    else { for(let i=0;i<5;i++){ const d = new Date(w); d.setDate(d.getDate()+i); dateStrs.push(isoDate(d)); } }
  });
  return sumInMonth(entries, dateStrs, monthDate);
}
// Small dependency-free inline-SVG charts, in the app's own accent color plus one secondary
// color for a second store - no chart library needed, keeps the app zero-dependency.
function svgLineChart(seriesList, monthLabels){
  const W=560, H=180, padL=40, padR=14, padT=16, padB=24;
  const allVals = seriesList.flatMap(s => s.values.filter(v => v!==null && v!==undefined && !isNaN(v)));
  const maxV = allVals.length ? Math.max(...allVals, 0) : 1;
  const minV = allVals.length ? Math.min(...allVals, 0) : 0;
  const range = (maxV - minV) || 1;
  const n = monthLabels.length;
  const xStep = (W - padL - padR) / Math.max(n-1,1);
  const yFor = v => H - padB - ((v - minV)/range) * (H - padT - padB);
  const xFor = i => padL + i*xStep;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:600px;display:block;">`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="currentColor" stroke-opacity="0.25" stroke-width="1"/>`;
  seriesList.forEach(s => {
    const pts = [];
    s.values.forEach((v,i) => { if(v!==null && v!==undefined && !isNaN(v)) pts.push(`${xFor(i)},${yFor(v)}`); });
    if(pts.length > 1) svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    s.values.forEach((v,i) => { if(v!==null && v!==undefined && !isNaN(v)) svg += `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${s.color}"/>`; });
  });
  monthLabels.forEach((mo,i) => { svg += `<text x="${xFor(i)}" y="${H-6}" font-size="9" fill="currentColor" fill-opacity="0.6" text-anchor="middle">${escapeHtml(mo)}</text>`; });
  svg += `</svg>`;
  return svg;
}
function svgBarChart(bars){
  const W=260, H=140, padL=8, padR=8, padT=16, padB=22;
  const maxV = Math.max(...bars.map(b=>Math.abs(b.value||0)), 1);
  const slot = (W-padL-padR)/bars.length;
  const bw = Math.max(slot - 14, 18);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:260px;height:auto;display:block;">`;
  bars.forEach((b,i) => {
    const h = maxV ? (Math.abs(b.value||0)/maxV)*(H-padT-padB) : 0;
    const x = padL + i*slot + (slot-bw)/2;
    const y = H - padB - h;
    svg += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${b.color}" rx="3"/>`;
    svg += `<text x="${x+bw/2}" y="${H-6}" font-size="9" text-anchor="middle" fill="currentColor" fill-opacity="0.7">${escapeHtml(b.label)}</text>`;
    svg += `<text x="${x+bw/2}" y="${y-4}" font-size="10" text-anchor="middle" fill="currentColor" font-weight="700">${b.value !== null && b.value !== undefined ? b.value : '—'}</text>`;
  });
  svg += `</svg>`;
  return svg;
}
// Visual tab: financials-only for now (per Rob's call) - monthly trend over the last 6 months

      <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">${escapeHtml(name)}</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;">

          ${svgLineChart(seriesList, monthLabels)}
          <div style="display:flex;gap:12px;margin-top:4px;flex-wrap:wrap;">${seriesList.map(s=>`<span style="font-size:11px;color:var(--win-text-secondary);"><span style="display:inline-block;width:9px;height:9px;background:${s.color};border-radius:2px;margin-right:4px;"></span>${escapeHtml(s.label)}</span>`).join('')}</div>

        <div style="flex:1;min-width:220px;">

function weeksTouchingMonth(monthDate){
  const n = daysInMonthOf(monthDate);
  const seen = {};
  const out = [];
  for(let day=1; day<=n; day++){
    const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const mon = mondayOf(d);
    const key = isoDate(mon);
    if(!seen[key]){ seen[key] = true; out.push(mon); }
  }
  out.sort((a,b) => a-b);
  return out;
}
function sumInMonth(entries, dateStrs, monthDate){
  const y = monthDate.getFullYear(), m = monthDate.getMonth();
  let total = 0, any = false;
  dateStrs.forEach(ds => {
    const v = entries[ds];
    if(v === undefined || v === '') return;
    const d = new Date(ds + 'T00:00:00');
    if(d.getFullYear() === y && d.getMonth() === m){
      const n = parseFloat(v);
      if(!isNaN(n)){ total += n; any = true; }
    }
  });
  return any ? total : null;
}

async function renderDashboard(){
  await refreshServerState();
  const view = document.getElementById('dashboardView');
  const monthLabel = fmtMonthLabel(dashboardMonthCursor);
  const goalMonthKey = monthKey(dashboardMonthCursor);
  const weeks = weeksTouchingMonth(dashboardMonthCursor);

  let html = `
    <div class="monthly-header"><h1>Metrics Dashboard \u2014 ${monthLabel}</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="month-nav">
          <button id="dbPrevMonth" title="Previous month">&#8592;</button>
          <span class="month-label">${monthLabel}</span>
          <button id="dbNextMonth" title="Next month">&#8594;</button>
        </div>
        <span class="month-today-pill" id="dbThisMonthBtn">This month</span>
      </div>
    </div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 18px;">
      Side-by-side store view of every KPI, for anyone to check. Metrics defined under the same
      name at more than one store line up in the same card. Numbers are entered day to day by
      whoever's assigned - see the Metrics area if you're setting up what gets tracked.
    </p>
    <div style="display:flex;gap:6px;margin-bottom:14px;">
      <button class="mini-btn ${dashboardTab==='Entry'?'primary-mini':''}" id="dbTabEntry">Entry</button>
      <button class="mini-btn ${dashboardTab==='Visual'?'primary-mini':''}" id="dbTabVisual">Visual</button>
    </div>
  `;

  if(dashboardTab === 'Visual'){
    html += `<p style="font-size:12.5px;color:var(--win-text-secondary);max-width:760px;margin:0 0 14px;">Monthly trend and store-vs-store comparison for metrics tagged "Dealership financials." Tag more metrics with that category from the Metrics admin page to see them here.</p>`;
    html += await financialsVisualHtml();
    const paceHtml = await paceVisualHtml();
    if(paceHtml){
      html += `<div style="font-weight:700;font-size:14px;margin:22px 0 10px;">Sales Pace</div>`;
      html += paceHtml;
    }
    view.innerHTML = html;
    wireDashboardHandlers();
    return;
  }

  if(METRICS.length === 0){
    html += `<div class="empty-note">No metrics set up yet.</div>`;
    view.innerHTML = html;
    wireDashboardHandlers();
    return;
  }

  const targets = allRosterTargets();

  // Department (category) sections first, then metric-name groups (same-named metrics from
  // different stores line up side by side) within each department - keeps the whole page
  // scannable by department instead of one long flat list. A metric tagged under more than
  // one department (e.g. a number Finance and Service both care about) shows up in each of
  // those sections - it's not copied, just listed twice, so entering it once still updates
  // both views.
  const DEPT_ORDER = METRIC_CATEGORIES;
  const byDept = {};
  METRICS.filter(m => m.status !== 'review' && !m.archived).forEach(m => {
    const depts = (m.categories && m.categories.length) ? m.categories : ['Uncategorized'];
    depts.forEach(dept => {
      (byDept[dept] = byDept[dept] || {});
      (byDept[dept][m.name] = byDept[dept][m.name] || []).push(m);
    });
  });
  const deptNames = Object.keys(byDept).sort((a,b) => {
    const ia = DEPT_ORDER.indexOf(a), ib = DEPT_ORDER.indexOf(b);
    if(ia !== -1 && ib !== -1) return ia - ib;
    if(ia !== -1) return -1;
    if(ib !== -1) return 1;
    if(a === 'Uncategorized') return 1;
    if(b === 'Uncategorized') return -1;
    return a.localeCompare(b);
  });

  for(const dept of deptNames){
    html += `<div class="dept-section"><div class="dept-title">${escapeHtml(dept)}</div>`;
    const groups = byDept[dept];

    for(const [name, metrics] of Object.entries(groups)){
      html += `<div class="monthly-loc-group"><div class="monthly-loc-title">${escapeHtml(name)}</div>
        <table class="monthly-table"><thead><tr><th>Store / who</th>`;
      weeks.forEach(w => {
        html += `<th class="num">Wk of ${w.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}</th>`;
      });
      html += `<th class="num">Month to date</th><th class="num">Goal</th></tr></thead><tbody>`;

      for(const m of metrics){
        if(!m.goals) m.goals = {};
        const entries = await loadMetricEntries(m.id);
        const assignedLabel = targets.find(x => x.locKey===m.assignedLoc && x.empIdx===m.assignedEmp);
        const goal = m.goals[goalMonthKey];
        const hasInfo = !!(m.calculation || m.source);

        html += `<tr><td><div class="metric-name-cell">${assignedLabel ? escapeHtml(assignedLabel.label) : 'Unassigned'}${m.storeLabel ? ` <span style="color:var(--win-text-secondary);">(${escapeHtml(m.storeLabel)})</span>` : ''}${m.unit ? ` <span style="color:var(--win-text-secondary);">(${escapeHtml(m.unit)})</span>` : ''}${hasInfo ? `<button class="info-btn dash-info-btn" data-mid="${m.id}" title="How it's calculated">ⓘ</button>` : ''}</div></td>`;

        let monthDateStrs = [];
        weeks.forEach(w => {
          let wVal;
          if(m.cadence === 'Weekly'){
            const v = entries[isoDate(w)];
            wVal = (v !== undefined && v !== '') ? parseFloat(v) : null;
            monthDateStrs.push(isoDate(w));
          } else {
            let sum = 0, any = false;
            for(let i=0;i<5;i++){
              const d = new Date(w); d.setDate(d.getDate()+i);
              const ds = isoDate(d);
              monthDateStrs.push(ds);
              const v = entries[ds];
              if(v !== undefined && v !== ''){ const n = parseFloat(v); if(!isNaN(n)){ sum += n; any = true; } }
            }
            wVal = any ? sum : null;
          }
          html += `<td class="num">${wVal !== null && !isNaN(wVal) ? wVal : '—'}</td>`;
        });

        const mtd = sumInMonth(entries, monthDateStrs, dashboardMonthCursor);
        html += `<td class="num"><b>${mtd !== null ? mtd : '—'}</b></td>`;
        html += `<td class="num">${goal ? escapeHtml(String(goal)) : '<span style="color:var(--kpi-risk);font-weight:600;">not set</span>'}</td>`;
        html += `</tr>`;
      }

      html += `</tbody></table></div>`;
    }
    html += `</div>`;
  }

  view.innerHTML = html;
  wireDashboardHandlers();
}

// ---- Setup (roster admin: add roles, reassign/add/remove tasks, cadence incl. Awareness,
// how-to notes + training video links). Everything here writes straight to the shared
// roster, so it's the same list every employee's daily view reads from. ----
let setupShown = false;
let expandedRoleKeys = new Set(); // keeps a role's card open across re-renders, same fix as meetings
let deptManagerExpanded = false; // keeps "Manage departments" open across renderMetrics() re-renders
let catManagerExpanded = false; // keeps "Manage categories" open across renderMetrics() re-renders
let expandedArchivedMetrics = false; // keeps "Archived / Review metrics" open across renderMetrics() re-renders
let metricsCadenceTab = 'Daily'; // which tab (Daily/Weekly) the Metrics admin page shows

async function reassignTask(taskId, fromLoc, fromEmpIdx, toLoc, toEmpIdx){
  const fromTasks = LOCATIONS[fromLoc].data[fromEmpIdx].tasks;
  const i = fromTasks.findIndex(t => t.id === taskId);
  if(i === -1) return;
  const [task] = fromTasks.splice(i, 1);
  LOCATIONS[toLoc].data[toEmpIdx].tasks.push(task);
  await saveRoster();

  // carry any mapped KPI (from the Task Workflow Mapper) along so it isn't orphaned
  const oldKey = `map:${fromLoc}:${fromEmpIdx}:${taskId}`;
  const mapped = SERVER_STATE[oldKey];
  if(mapped){
    await storSet(`map:${toLoc}:${toEmpIdx}:${taskId}`, mapped);
    await storSet(oldKey, null);
  }
}

async function removeTask(taskId, loc, empIdx){
  const tasks = LOCATIONS[loc].data[empIdx].tasks;
  const i = tasks.findIndex(t => t.id === taskId);
  if(i === -1) return;
  if(!await appConfirm('Remove this task? Past check-ins for it are kept but will no longer be shown.')) return;
  tasks.splice(i,1);
  await saveRoster();
  await renderSetup();
}

async function renderSetup(){
  await refreshServerState();
  const view = document.getElementById('setupView');

  const allTargets = activeRosterTargets();
  const CADENCES = ['Daily','Specific Days','Weekly','Saturday','Sunday','Monthly','Quarterly','As Needed','Awareness'];
  const DOW_OPTS = [['Mon','Mon'],['Tue','Tue'],['Wed','Wed'],['Thu','Thu'],['Fri','Fri'],['Sat','Sat'],['Sun','Sun']];

  let html = `
    <div class="monthly-header"><h1>Setup</h1></div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 18px;">
      The roster and task list exactly as it sits today, for every location. Add roles, reassign
      tasks between people (history follows the task automatically), change cadence, park
      something in <b>Awareness</b> so it stays visible without counting against completion, or
      attach how-to notes and a training video link. Everything here saves immediately and is
      shared with every employee's view.
    </p>
  `;

  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    html += `<div class="monthly-loc-group">
      <div class="monthly-loc-title">${loc.name}</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="text" class="add-role-input" placeholder="New role name at ${escapeAttr(loc.name)}..." style="border:1px solid var(--win-border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;width:280px;">
        <button class="mini-btn primary-mini add-role-btn" data-loc="${locKey}">+ Add role</button>
      </div>`;

    // Roles line up by department first (so e.g. every Service role in one location groups
    // together), then keep their original order within the same department - stable sort, so
    // this never reshuffles two roles that are already in the same department relative to each
    // other. Roles with no department set sort to the end, in original order.
    const deptOrderIdx = (dept) => { const i = DEPARTMENTS.indexOf(dept); return i === -1 ? DEPARTMENTS.length : i; };
    const visibleRoles = loc.data
      .map((emp, empIdx) => ({ emp, empIdx }))
      .filter(x => !x.emp.archived)
      .sort((a, b) => deptOrderIdx(a.emp.department) - deptOrderIdx(b.emp.department));

    visibleRoles.forEach(({ emp, empIdx }) => {
      const deptOpts = DEPARTMENTS.map(d => `<option value="${escapeAttr(d)}" ${emp.department===d?'selected':''}>${escapeAttr(d)}</option>`).join('');
      html += `<details class="setup-role" data-loc="${locKey}" data-emp="${empIdx}" ${expandedRoleKeys.has(locKey+'::'+empIdx) ? 'open' : ''} style="margin-bottom:10px;border:1px solid var(--win-border);border-radius:8px;background:var(--win-surface);">
        <summary style="cursor:pointer;padding:10px 14px;font-weight:600;font-size:13px;">${escapeHtml(emp.label)}${emp.name ? ` <span style="font-weight:400;">— ${escapeHtml(emp.name)}</span>` : ''} <span style="font-weight:400;color:var(--win-text-secondary);">${emp.department ? `· ${escapeHtml(emp.department)} ` : ''}(${emp.tasks.length} tasks)</span></summary>
        <div style="padding:2px 14px 14px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
          <input type="text" class="st-role-name" placeholder="Person's name..." value="${escapeAttr(emp.name||'')}" style="width:200px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
          <select class="st-role-dept" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="">Department…</option>${deptOpts}
          </select>
          <button class="mini-btn danger-mini role-remove">Remove role</button>
        </div>`;

      emp.tasks.forEach((t) => {
        const cadOpts = CADENCES.map(c => `<option value="${c}" ${t.cadence===c?'selected':''}>${c}</option>`).join('');
        const targetOpts = allTargets
          .filter(x => !(x.locKey===locKey && x.empIdx===empIdx))
          .map(x => `<option value="${x.locKey}::${x.empIdx}">${escapeAttr(x.label)}</option>`).join('');
        const appliesSelect = loc.dual ? `<select class="st-applies" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
              <option value="bridgeland" ${t.appliesTo==='bridgeland'?'selected':''}>Bridgeland only</option>
              <option value="candycars" ${t.appliesTo==='candycars'?'selected':''}>Candy Cars only</option>
              <option value="both" ${t.appliesTo==='both'?'selected':''}>Both locations</option>
            </select>` : '';
        const dowRowVisible = t.cadence === 'Specific Days';
        const dowChecks = `<div class="st-dow-row" style="display:${dowRowVisible ? 'flex' : 'none'};gap:10px;margin-top:6px;align-items:center;flex-wrap:wrap;background:#FFF8E5;border:1px solid #F0D98A;border-radius:6px;padding:6px 10px;">
              <span style="font-size:11.5px;color:var(--win-text-secondary);font-weight:600;">Due on:</span>
              ${DOW_OPTS.map(([val,lbl]) => `<label style="display:flex;align-items:center;gap:4px;font-size:12px;"><input type="checkbox" class="st-dow" value="${val}" ${(t.specificDays||[]).includes(val)?'checked':''}> ${lbl}</label>`).join('')}
            </div>`;
        const metricOpts = METRICS.map(m => `<option value="${m.id}" ${t.linkedMetricId===m.id?'selected':''}>${escapeAttr(m.name)} (${escapeAttr(m.cadence)})</option>`).join('');
        html += `<div class="setup-task-row" data-taskid="${t.id}" data-loc="${locKey}" data-emp="${empIdx}" style="border-top:1px solid var(--win-border);padding:10px 0;">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="text" class="st-text" value="${escapeAttr(t.text)}" style="flex:1;min-width:220px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
            <select class="st-cadence" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">${cadOpts}</select>
            ${appliesSelect}
            <select class="st-reassign" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
              <option value="">Reassign to\u2026</option>${targetOpts}
            </select>
            <button class="mini-btn danger-mini st-remove">Remove</button>
          </div>
          ${dowChecks}
          <div style="display:flex;gap:8px;margin-top:6px;">
            <input type="text" class="st-howto" placeholder="How to perform this task..." value="${escapeAttr(t.howTo||'')}" style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            <input type="text" class="st-video" placeholder="Training video URL" value="${escapeAttr(t.videoUrl||'')}" style="width:260px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
          </div>
          <div style="display:flex;gap:8px;margin-top:6px;align-items:center;">
            <span style="font-size:11.5px;color:var(--win-text-secondary);white-space:nowrap;">Linked metric (for verification):</span>
            <select class="st-linked-metric" style="flex:1;max-width:340px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
              <option value="">\u2014 None \u2014</option>${metricOpts}
            </select>
          </div>
        </div>`;
      });

      html += `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <input type="text" class="add-task-input" placeholder="New task text..." style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;">
          ${loc.dual ? `<select class="add-task-applies" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:7px;font-size:12.5px;">
            <option value="both" selected>Both locations</option>
            <option value="bridgeland">Bridgeland only</option>
            <option value="candycars">Candy Cars only</option>
          </select>` : ''}
          <button class="mini-btn primary-mini add-task-btn" data-loc="${locKey}" data-emp="${empIdx}">+ Add task</button>
        </div>`;
      html += `</div></details>`;
    });

    const removedHere = loc.data.map((emp,empIdx)=>({emp,empIdx})).filter(x => x.emp.archived);
    if(removedHere.length){
      html += `<details class="setup-removed-roles" style="margin-top:6px;">
        <summary style="cursor:pointer;font-size:12px;color:var(--win-text-secondary);padding:6px 2px;">Removed roles (${removedHere.length})</summary>
        <div style="padding:6px 2px;">
          ${removedHere.map(({emp,empIdx}) => `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--win-border);font-size:12.5px;">
            <span style="flex:1;color:var(--win-text-secondary);">${escapeHtml(emp.label)}</span>
            <button class="mini-btn role-restore" data-loc="${locKey}" data-emp="${empIdx}">Restore</button>
          </div>`).join('')}
        </div>
      </details>`;
    }

    html += `</div>`;
  });

  view.innerHTML = html;

  view.querySelectorAll('.setup-role').forEach(card => {
    const key = card.dataset.loc + '::' + card.dataset.emp;
    card.addEventListener('toggle', () => {
      if(card.open) expandedRoleKeys.add(key); else expandedRoleKeys.delete(key);
    });
  });

  view.querySelectorAll('.st-role-name').forEach(input => {
    input.onchange = async (e) => {
      const card = input.closest('.setup-role');
      const locKey = card.dataset.loc, empIdx = parseInt(card.dataset.emp, 10);
      LOCATIONS[locKey].data[empIdx].name = e.target.value.trim();
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.st-role-dept').forEach(select => {
    select.onchange = async (e) => {
      const card = select.closest('.setup-role');
      const locKey = card.dataset.loc, empIdx = parseInt(card.dataset.emp, 10);
      LOCATIONS[locKey].data[empIdx].department = e.target.value;
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.add-role-btn').forEach(btn => {
    btn.onclick = async () => {
      const input = btn.previousElementSibling;
      const name = (input.value || '').trim();
      if(!name) return;
      LOCATIONS[btn.dataset.loc].data.push({ label: name, tasks: [] });
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.role-remove').forEach(btn => {
    btn.onclick = async () => {
      const card = btn.closest('.setup-role');
      const locKey = card.dataset.loc, empIdx = parseInt(card.dataset.emp, 10);
      const emp = LOCATIONS[locKey].data[empIdx];
      if(!await appConfirm(`Remove "${emp.label}"? It disappears from the roster and every assignment dropdown right away. Anything already assigned to them (past metrics, action items, meeting attendance) keeps showing their name so history stays intact — nothing is deleted, and you can restore the role later from "Removed roles" at the bottom of this location.`, 'Remove')) return;
      emp.archived = true;
      expandedRoleKeys.delete(locKey+'::'+empIdx);
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.role-restore').forEach(btn => {
    btn.onclick = async () => {
      const locKey = btn.dataset.loc, empIdx = parseInt(btn.dataset.emp, 10);
      LOCATIONS[locKey].data[empIdx].archived = false;
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.add-task-btn').forEach(btn => {
    btn.onclick = async () => {
      const row = btn.parentElement;
      const input = row.querySelector('.add-task-input');
      const appliesSelect = row.querySelector('.add-task-applies');
      const text = (input.value || '').trim();
      if(!text) return;
      const empIdx = parseInt(btn.dataset.emp, 10);
      const appliesTo = appliesSelect ? appliesSelect.value : 'both';
      LOCATIONS[btn.dataset.loc].data[empIdx].tasks.push({ id: newTaskId(), text, cadence: 'Daily', howTo: '', videoUrl: '', appliesTo });
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.setup-task-row').forEach(row => {
    const taskId = row.dataset.taskid;
    const loc = row.dataset.loc;
    const empIdx = parseInt(row.dataset.emp, 10);
    const findTask = () => LOCATIONS[loc].data[empIdx].tasks.find(t => t.id === taskId);

    row.querySelector('.st-text').onchange = async (e) => { const t = findTask(); if(t){ t.text = e.target.value; await saveRoster(); } };
    row.querySelector('.st-cadence').onchange = async (e) => {
      const t = findTask();
      if(t){
        t.cadence = e.target.value;
        if(t.cadence !== 'Specific Days') t.specificDays = [];
        const dowRow = row.querySelector('.st-dow-row');
        if(dowRow) dowRow.style.display = (t.cadence === 'Specific Days') ? 'flex' : 'none';
        await saveRoster();
      }
    };
    row.querySelector('.st-howto').onchange = async (e) => { const t = findTask(); if(t){ t.howTo = e.target.value; await saveRoster(); } };
    row.querySelector('.st-video').onchange = async (e) => { const t = findTask(); if(t){ t.videoUrl = e.target.value; await saveRoster(); } };
    const appliesEl = row.querySelector('.st-applies');
    if(appliesEl) appliesEl.onchange = async (e) => { const t = findTask(); if(t){ t.appliesTo = e.target.value; await saveRoster(); } };
    row.querySelectorAll('.st-dow').forEach(cb => {
      cb.onchange = async () => {
        const t = findTask();
        if(!t) return;
        const checked = Array.from(row.querySelectorAll('.st-dow')).filter(x => x.checked).map(x => x.value);
        t.specificDays = checked;
        await saveRoster();
      };
    });
    const linkedMetricEl = row.querySelector('.st-linked-metric');
    if(linkedMetricEl) linkedMetricEl.onchange = async (e) => { const t = findTask(); if(t){ t.linkedMetricId = e.target.value || null; await saveRoster(); } };
    row.querySelector('.st-remove').onclick = () => removeTask(taskId, loc, empIdx);
    row.querySelector('.st-reassign').onchange = async (e) => {
      const val = e.target.value;
      if(!val) return;
      const [toLoc, toEmpIdxStr] = val.split('::');
      await reassignTask(taskId, loc, empIdx, toLoc, parseInt(toEmpIdxStr, 10));
      await renderSetup();
    };
  });
}
