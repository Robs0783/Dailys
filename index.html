<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dealership Daily Ops</title>
<style>
  :root{
    --win-bg:#F3F3F3;
    --win-surface:#FFFFFF;
    --win-sidebar:#FAFAFA;
    --win-border:#E1DFDD;
    --win-border-strong:#D2D0CE;
    --win-text:#1B1A19;
    --win-text-secondary:#605E5C;
    --win-accent:#0F6CBD;
    --win-accent-light:#E9F1FB;
    --c-complete:#107C10;
    --c-incomplete:#C42B1C;
    --c-off:#605E5C;
    --kpi-good:#107C10;
    --kpi-risk:#BA7517;
    --kpi-bad:#C42B1C;
    --kpi-none:#8A8886;
    --radius:8px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.08), 0 0.5px 1.5px rgba(0,0,0,0.06);
    --shadow-2: 0 4px 8px rgba(0,0,0,0.10), 0 1.5px 4px rgba(0,0,0,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--win-bg); color:var(--win-text); -webkit-font-smoothing:antialiased;
  }
  .app-window{
    display:flex; flex-direction:column; height:100vh; min-height:640px;
    border:1px solid var(--win-border-strong); border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow-2); background:var(--win-bg);
  }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--win-surface); border-bottom:1px solid var(--win-border);
    padding:0 8px 0 14px; height:40px; flex-shrink:0; user-select:none;
  }
  .titlebar-left{ display:flex; align-items:center; gap:10px; }
  .app-icon{ width:18px;height:18px;border-radius:4px; background:linear-gradient(135deg,var(--win-accent),#59B0F5);
    display:flex;align-items:center;justify-content:center; color:white;font-size:11px;font-weight:700; }
  .titlebar-title{ font-size:13px; font-weight:600; }
  .loc-switch{ display:flex; gap:2px; background:var(--win-bg); border-radius:6px; padding:2px; margin-left:16px; }
  .loc-btn{ border:none; background:transparent; padding:5px 14px; font-size:12.5px; font-weight:600;
    border-radius:5px; cursor:pointer; color:var(--win-text-secondary); }
  .loc-btn.active{ background:var(--win-accent); color:#fff; }
  .titlebar-controls{ display:flex; }
  .tc-btn{ width:44px;height:40px;border:none;background:transparent; display:flex;align-items:center;justify-content:center;
    cursor:default; color:#444; font-size:10px; }
  .tc-btn:hover{ background:rgba(0,0,0,0.05); }
  .tc-btn.close:hover{ background:#E81123; color:white; }

  .app-body{ flex:1; display:flex; min-height:0; }
  .sidebar{ width:230px; flex-shrink:0; background:var(--win-sidebar); border-right:1px solid var(--win-border);
    padding:14px 8px; overflow-y:auto; }
  .sidebar-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    color:var(--win-text-secondary); padding:4px 10px 8px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; margin:2px 0; border-radius:6px;
    cursor:pointer; font-size:13px; position:relative; transition:background .12s ease; }
  .nav-item:hover{ background:rgba(0,0,0,0.04); }
  .nav-item.active{ background:var(--win-accent-light); font-weight:600; }
  .nav-item.active::before{ content:''; position:absolute; left:-8px; top:8px; bottom:8px; width:3px;
    border-radius:2px; background:var(--win-accent); }
  .nav-avatar{ width:26px;height:26px;border-radius:50%; background:#EDEBE9; color:#3B3A39;
    display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .nav-item.active .nav-avatar{ background:var(--win-accent); color:#fff; }
  .nav-progress{ margin-left:auto; font-size:10.5px; color:var(--win-text-secondary); font-variant-numeric:tabular-nums; }
  .nav-item.active .nav-progress{ color:var(--win-accent); font-weight:600; }

  .main{ flex:1; overflow-y:auto; overflow-x:auto; padding:20px 26px 40px; }
  .content-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .employee-title{ display:flex; align-items:center; gap:12px; }
  .employee-avatar-lg{ width:40px;height:40px;border-radius:50%; background:var(--win-accent); color:#fff;
    display:flex;align-items:center;justify-content:center; font-size:14px; font-weight:700; }
  .employee-title h1{ font-size:18px; margin:0; font-weight:600; }
  .employee-title .sub{ font-size:12px; color:var(--win-text-secondary); }

  .week-nav{ display:flex; align-items:center; gap:6px; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:6px; padding:4px 6px; box-shadow:var(--shadow-1); }
  .week-nav button{ border:none; background:transparent; width:26px;height:26px; border-radius:4px; cursor:pointer;
    font-size:13px; display:flex;align-items:center;justify-content:center; }
  .week-nav button:hover{ background:rgba(0,0,0,.05); }
  .week-label{ font-size:12.5px; font-weight:600; padding:0 6px; white-space:nowrap; }
  .today-pill{ font-size:11.5px; padding:4px 10px; border-radius:12px; background:var(--win-accent-light);
    color:var(--win-accent); font-weight:600; cursor:pointer; border:1px solid transparent; }
  .today-pill:hover{ border-color:var(--win-accent); }

  .summary-bar{ display:flex; align-items:center; gap:16px; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:var(--radius); padding:12px 18px; margin-bottom:16px; box-shadow:var(--shadow-1); flex-wrap:wrap; }
  .legend{ display:flex; gap:14px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--win-text-secondary); }
  .legend-dot{ width:10px;height:10px;border-radius:3px; }
  .legend-item.camera::before{ content:'\\1F4F7'; font-size:12px; }
  .summary-stat{ margin-left:auto; font-size:12px; color:var(--win-text-secondary); }
  .summary-stat b{ color:var(--win-text); }

  table.week-table{ border-collapse:collapse; width:100%; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-1); }
  table.week-table th, table.week-table td{ border-bottom:1px solid var(--win-border); padding:0; }
  table.week-table thead th{ background:#FAFAFA; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--win-text-secondary); padding:8px 6px; text-align:center; border-bottom:1px solid var(--win-border-strong); }
  table.week-table thead th.task-col{ text-align:left; padding-left:16px; }
  table.week-table thead th .dow-date{ display:block; font-weight:400; font-size:9.5px; color:#A19F9D; margin-top:1px; }
  .cadence-row td{ background:#F7F7F7; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--win-text-secondary); padding:6px 16px; border-bottom:1px solid var(--win-border); }
  .task-cell{ padding:8px 14px; font-size:13px; line-height:1.3; display:flex; align-items:center; gap:8px; min-width:220px; flex-wrap:wrap; }
  .toolbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; margin-right:4px; }
  .tb-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:6px; padding:6px 14px;
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--win-text-secondary); }
  .tb-btn:hover{ background:var(--win-accent-light); border-color:var(--win-accent); color:var(--win-accent); }
  .kpi-badge{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; color:#fff; white-space:nowrap; flex-shrink:0; cursor:default; }
  .kpi-badge.kpi-good{ background:var(--kpi-good); }
  .kpi-badge.kpi-risk{ background:var(--kpi-risk); }
  .kpi-badge.kpi-bad{ background:var(--kpi-bad); }
  .kpi-badge.kpi-none{ background:var(--kpi-none); }
  .spec-stats{ display:flex; gap:24px; flex-wrap:wrap; margin-bottom:6px; }
  .spec-stat{ background:var(--win-surface); border:1px solid var(--win-border); border-radius:var(--radius);
    padding:10px 16px; box-shadow:var(--shadow-1); }
  .spec-stat .num{ font-size:20px; font-weight:700; color:var(--win-accent); }
  .spec-stat .lbl{ font-size:11px; color:var(--win-text-secondary); text-transform:uppercase; letter-spacing:.04em; }
  .cadence-row.awareness-row{ background:#F0EFED !important; color:#8A8886 !important; }
  tr.awareness-task{ opacity:.72; }
  tr.awareness-task .task-cell{ font-style:italic; }
  .tb-btn.active{ background:var(--win-accent); border-color:var(--win-accent); color:#fff; }
  .monthly-view{ flex:1; overflow-y:auto; padding:24px 32px 60px; display:none; }
  .monthly-view.show{ display:block; }
  .monthly-header{ margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .monthly-header h1{ font-size:20px; margin:0; font-weight:600; }
  .month-nav{ display:flex; align-items:center; gap:6px; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:6px; padding:4px 6px; box-shadow:var(--shadow-1); }
  .month-nav button{ border:none; background:transparent; width:26px;height:26px; border-radius:4px; cursor:pointer;
    font-size:13px; display:flex;align-items:center;justify-content:center; }
  .month-nav button:hover{ background:rgba(0,0,0,.05); }
  .month-label{ font-size:12.5px; font-weight:600; padding:0 6px; white-space:nowrap; }
  .month-today-pill{ font-size:11.5px; padding:4px 10px; border-radius:12px; background:var(--win-accent-light);
    color:var(--win-accent); font-weight:600; cursor:pointer; border:1px solid transparent; }
  .month-today-pill:hover{ border-color:var(--win-accent); }
  .monthly-actions{ display:flex; gap:10px; margin:14px 0 20px; }
  .monthly-actions button{ border:1px solid var(--win-border-strong); background:#fff; border-radius:6px; padding:8px 16px;
    font-size:12.5px; font-weight:600; cursor:pointer; }
  .monthly-actions button:hover{ background:var(--win-accent-light); }
  .monthly-loc-group{ margin-bottom:26px; }
  .monthly-loc-title{ font-size:15px; font-weight:700; margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid var(--win-accent); }
  table.monthly-table{ border-collapse:collapse; width:100%; background:var(--win-surface); border:1px solid var(--win-border);
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-1); }
  table.monthly-table th, table.monthly-table td{ border-bottom:1px solid var(--win-border); padding:10px 14px; font-size:12.5px; text-align:left; }
  table.monthly-table thead th{ background:#FAFAFA; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--win-text-secondary); border-bottom:1px solid var(--win-border-strong); }
  table.monthly-table td.num, table.monthly-table th.num{ text-align:center; font-variant-numeric:tabular-nums; }
  .rate-pill{ display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:10px; color:#fff; }
  .rate-pill.rate-good{ background:var(--kpi-good); }
  .rate-pill.rate-risk{ background:var(--kpi-risk); }
  .rate-pill.rate-bad{ background:var(--kpi-bad); }
  .rate-pill.rate-none{ background:var(--kpi-none); }
  @media print{
    body{ background:#fff; }
    .app-window{ border:none; border-radius:0; box-shadow:none; height:auto; }
    .titlebar, .sidebar, .app-body > .main{ display:none !important; }
    .monthly-view{ display:block !important; padding:0; overflow:visible; }
    .monthly-actions{ display:none; }
  }
  .photo-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:5px; width:24px;height:24px;
    flex-shrink:0; cursor:pointer; font-size:12px; display:flex;align-items:center;justify-content:center; padding:0; }
  .photo-btn:hover{ background:var(--win-accent-light); border-color:var(--win-accent); }
  .photo-btn.has-photo{ border-color:var(--c-complete); background:#DFF6DD; }
  .photo-thumb{ width:24px;height:24px;border-radius:4px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--win-border-strong); }
  .onetime-chip{ font-size:9.5px; font-weight:700; color:#fff; background:#8764B8; border-radius:4px; padding:2px 5px; flex-shrink:0; }
  .day-cell{ text-align:center; padding:0; }
  .seg{ display:flex; justify-content:center; gap:3px; padding:8px 4px; }
  .seg-btn{ width:22px;height:22px; border-radius:5px; border:1px solid var(--win-border-strong); background:#fff;
    font-size:10.5px; font-weight:700; cursor:pointer; color:var(--win-text-secondary); padding:0; }
  .seg-btn:hover{ background:rgba(0,0,0,.04); }
  .seg-btn.sel-C{ background:var(--c-complete); color:#fff; border-color:var(--c-complete); }
  .seg-btn.sel-I{ background:var(--c-incomplete); color:#fff; border-color:var(--c-incomplete); }
  .seg-btn.sel-O{ background:var(--c-off); color:#fff; border-color:var(--c-off); }
  .completion-cell{ text-align:center; padding:6px; }

  .status-toast{ position:fixed; bottom:18px; right:18px; background:#1B1A19; color:#fff; padding:8px 14px;
    border-radius:6px; font-size:12.5px; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease;
    pointer-events:none; box-shadow:var(--shadow-2); z-index:50; }
  .status-toast.show{ opacity:1; transform:translateY(0); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-backdrop.show{ display:flex; }
  .modal{ background:#fff; border-radius:10px; padding:18px; max-width:520px; width:90%; box-shadow:var(--shadow-2); }
  .modal h3{ margin:0 0 10px; font-size:14px; }
  .modal img{ max-width:100%; border-radius:6px; display:block; margin-bottom:10px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{ border:1px solid var(--win-border-strong); background:#fff; border-radius:6px; padding:6px 14px;
    font-size:12.5px; cursor:pointer; }
  .modal-actions button.primary{ background:var(--win-accent); color:#fff; border-color:var(--win-accent); }
  .modal-actions button.danger{ color:var(--c-incomplete); }
  .file-input{ display:none; }
  .empty-note{ font-size:12px; color:var(--win-text-secondary); padding:14px 16px; }

  .onetime-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid var(--win-border); }
  .onetime-row:last-child{ border-bottom:none; }
  .onetime-row.done{ opacity:.6; }
  .onetime-row.done .onetime-text{ text-decoration:line-through; }
  .onetime-thumb-wrap{ flex-shrink:0; }
  .onetime-text{ flex:1; font-size:13px; }
  .mini-btn{ border:1px solid var(--win-border-strong); background:#fff; border-radius:5px; padding:5px 10px;
    font-size:11.5px; font-weight:600; cursor:pointer; color:var(--win-text-secondary); white-space:nowrap; }
  .mini-btn:hover{ background:rgba(0,0,0,.04); }
  .mini-btn.sel-C{ background:var(--c-complete); color:#fff; border-color:var(--c-complete); }
  .mini-btn.primary-mini{ background:var(--win-accent); color:#fff; border-color:var(--win-accent); }
  .mini-btn.danger-mini{ color:var(--c-incomplete); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#C8C6C4; border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .admin-only{ display:none !important; }
  body.is-admin .admin-only{ display:inline-block !important; }
  #adminToggleBtn.is-locked-state{ background:var(--win-accent); color:#fff; border-color:var(--win-accent); }
  .proj-card{ border:1px solid var(--win-border); border-radius:8px; background:var(--win-surface); margin-bottom:12px; }
  .proj-step-row{ border-top:1px solid var(--win-border); padding:10px 0; }
  .attach-chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--win-border-strong); border-radius:5px; padding:3px 8px; font-size:11.5px; margin:2px 4px 2px 0; background:#fff; }
  .attach-chip a{ color:var(--win-accent); text-decoration:none; }
  .attach-chip .rm{ cursor:pointer; color:var(--c-incomplete); font-weight:700; }
  .status-pill-sm{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9px; color:#fff; }
  .status-pill-sm.st-done{ background:var(--c-complete); }
  .status-pill-sm.st-progress{ background:var(--kpi-risk); }
  .status-pill-sm.st-notstarted{ background:var(--kpi-none); }
</style>
</head>
<body>

<div class="app-window">
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="app-icon" id="appIcon">B</div>
      <div class="titlebar-title">Dealership Daily Ops</div><span style="font-size:10.5px;font-weight:700;color:var(--win-accent);background:var(--win-accent-light);padding:2px 8px;border-radius:10px;margin-left:4px;">Live &middot; shared</span><a href="/mapper" id="mapperLink" class="admin-only" style="font-size:11.5px;color:var(--win-text-secondary);text-decoration:none;margin-left:10px;border:1px solid var(--win-border-strong);border-radius:6px;padding:3px 9px;">Open Task Workflow Mapper &rarr;</a>
      <div class="loc-switch" id="locSwitch"></div>
    </div>
    <div class="toolbar-actions">
      <button class="tb-btn admin-only" id="setupToggleBtn">Setup</button>
      <button class="tb-btn admin-only" id="onetimeToggleBtn">One-Time Tasks</button>
      <button class="tb-btn admin-only" id="meetingsToggleBtn">Meetings</button>
      <button class="tb-btn admin-only" id="projectsToggleBtn">Projects</button>
      <button class="tb-btn admin-only" id="monthlyToggleBtn">Monthly Overview</button>
      <button class="tb-btn admin-only" id="exportBtn">Export Data</button>
      <button class="tb-btn admin-only" id="importBtn">Import Data</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="tb-btn" id="adminToggleBtn" style="margin-left:6px;">Admin</button>
    </div>
    <div class="titlebar-controls">
      <button class="tc-btn">&#8211;</button>
      <button class="tc-btn">&#9633;</button>
      <button class="tc-btn close">&#10005;</button>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <div class="sidebar-label">Team</div>
      <div id="navList"></div>
    </div>

    <div class="main">
      <div class="content-header">
        <div class="employee-title">
          <div class="employee-avatar-lg" id="empAvatar">?</div>
          <div>
            <h1 id="empName">Loading…</h1>
            <div class="sub" id="empSub"></div>
          </div>
        </div>
        <div class="week-nav">
          <button id="prevWeek" title="Previous week">&#8592;</button>
          <span class="week-label" id="weekLabel">Week</span>
          <button id="nextWeek" title="Next week">&#8594;</button>
          <span class="today-pill" id="todayBtn">This week</span>
        </div>
      </div>

      <div class="summary-bar">
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--c-complete)"></div>Complete</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--c-incomplete)"></div>Incomplete</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--c-off)"></div>Off</div>
          <div class="legend-item camera">Reference / completion photo attached</div>
        </div>
        <div class="summary-stat" id="summaryStat"></div>
      </div>

      <div id="tableWrap"></div>

      <div id="meetingsPanelWrap" style="margin-top:22px;"></div>

      <div id="projectsPanelWrap" style="margin-top:22px;"></div>

      <div id="onetimeWrap" style="display:none; margin-top:22px;">
        <div class="group-title" style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--win-text-secondary);margin:0 0 8px 2px;">One-Time Tasks</div>
        <div class="task-card" style="padding:10px 12px; display:flex; gap:8px; margin-bottom:10px;">
          <input type="text" id="addOnetimeInput" placeholder="Describe the one-time task…" style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;">
          <button id="addOnetimeBtn" class="mini-btn primary-mini">+ Add task</button>
        </div>
        <div class="task-card" id="onetimeList" style="padding:4px;"></div>
      </div>
    </div>

    <div class="monthly-view" id="monthlyView"></div>
    <div class="monthly-view" id="setupView"></div>
    <div class="monthly-view" id="onetimeReviewView"></div>
    <div class="monthly-view" id="meetingsView"></div>
    <div class="monthly-view" id="projectsView"></div>
  </div>
</div>

<div class="status-toast" id="toast">Saved</div>

<div class="modal-backdrop" id="photoModal">
  <div class="modal">
    <h3 id="photoModalTitle">Task photo</h3>
    <div id="photoModalBody"></div>
    <div class="modal-actions" id="photoModalActions"></div>
  </div>
</div>
<input type="file" accept="image/*" class="file-input" id="fileInput">

let LOCATIONS = DEFAULT_LOCATIONS;

// Give every task a permanent id so it can be reassigned between roles/locations without
// scrambling historical check-ins or KPI mappings (which are also keyed by this id).
function assignTaskIds(locs){
  let n = 0;
  Object.entries(locs).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => {
      emp.tasks.forEach((t) => {
        if(!t.id){ t.id = `seed-${locKey}-${empIdx}-${n++}`; }
        if(t.howTo === undefined) t.howTo = '';
        if(t.videoUrl === undefined) t.videoUrl = '';
      });
    });
  });
  return locs;
}
function newTaskId(){
  return 'tsk-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function weekDates(monday){
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(d.getDate()+i); out.push(d); }
  return out;
}

function initials(label){
  const clean = label.replace(/Bridgeland|Candy ?Cars|CC\\b/gi,'').trim();
  const parts = clean.split(/\\s+/).filter(Boolean);
  if(parts.length === 0) return label.slice(0,2).toUpperCase();
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

// data through this API - this is what makes it live/shared instead of per-device) ----
let SERVER_STATE = {};

async function refreshServerState(){
  try{
    const res = await fetch('/api/state');
    SERVER_STATE = await res.json();
    if(SERVER_STATE['roster']){
      try{ LOCATIONS = JSON.parse(SERVER_STATE['roster']); }
      catch(e){ console.error('Bad roster data, falling back to default', e); LOCATIONS = assignTaskIds(DEFAULT_LOCATIONS); }
    } else {
      LOCATIONS = assignTaskIds(DEFAULT_LOCATIONS);
      await saveRoster(); // first client to see an empty store seeds the shared roster for everyone
    }
    try{ MEETINGS = SERVER_STATE['meetings'] ? JSON.parse(SERVER_STATE['meetings']) : []; }
    catch(e){ console.error('Bad meetings data, resetting', e); MEETINGS = []; }
    try{ PROJECTS = SERVER_STATE['projects'] ? JSON.parse(SERVER_STATE['projects']) : []; }
    catch(e){ console.error('Bad projects data, resetting', e); PROJECTS = []; }
    return true;
  }catch(e){
    console.error('Failed to load shared state', e);
    showToast('Could not reach server \u2014 showing last known data');
    return false;
  }
}

const DOW_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function meetingOccursOn(meeting, date){
  if(meeting.cadence === 'Weekly') return DOW_NAMES[date.getDay()] === meeting.dayOfWeek;
  if(meeting.cadence === 'Monthly') return date.getDate() === Number(meeting.dayOfMonth);
  if(meeting.cadence === 'One-time') return isoDate(date) === meeting.onDate;
  return false;
}
async function storGet(key){
  return Object.prototype.hasOwnProperty.call(SERVER_STATE, key) ? SERVER_STATE[key] : null;
}
async function storSet(key, value, requireAdmin){
  SERVER_STATE[key] = value;
  try{
    const body = { key, value };
    if(requireAdmin) body.adminCode = getAdminCode();
    const res = await fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.ok;
  }catch(e){ console.error('storage set failed', e); return false; }
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getKpiForTask(loc, empIdx, taskId){
  try{
    const raw = SERVER_STATE[`map:${loc}:${empIdx}:${taskId}`];
    if(!raw) return null;
    const f = JSON.parse(raw);
    if(!f || !f.metric) return null;
    const label = (f.current && f.target) ? `${f.current} \u2192 ${f.target}`
                : (f.current || f.target || f.metric);
    const cls = f.onTrack === 'On track' ? 'good'
              : f.onTrack === 'At risk' ? 'risk'
              : f.onTrack === 'Off track' ? 'bad'
              : 'none';
    const title = f.metric + (f.onTrack ? ' \u2014 ' + f.onTrack : '');
    return { label, cls, title };
  }catch(e){ return null; }
}

// ---- Monthly Overview (resets automatically each calendar month - nothing is deleted, each month's
// numbers are computed live from that month's own daily entries) ----
let monthCursor = firstOfMonth(new Date());
let monthlyShown = false;

function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function daysInMonthOf(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function fmtMonthLabel(d){ return d.toLocaleDateString('en-US', {month:'long', year:'numeric'}); }
function rateClass(rate){
  if(rate === null) return 'none';
  if(rate >= 90) return 'good';
  if(rate >= 75) return 'risk';
  return 'bad';
}

async function computeMonthlyStats(loc, empIdx, monthDate){
  const emp = LOCATIONS[loc].data[empIdx];
  const countable = emp.tasks.filter(t => t.cadence !== 'Awareness');
  const numTasks = countable.length;
  const nDays = daysInMonthOf(monthDate);
  let complete=0, incomplete=0, off=0, filled=0;
  const jobs = [];
  for(let day=1; day<=nDays; day++){
    const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const dateStr = isoDate(d);
    jobs.push(loadStatuses(loc, empIdx, dateStr).then(obj => {
      countable.forEach(t => {
        const v = obj[t.id];
        if(v === 'C'){ complete++; filled++; }
        else if(v === 'I'){ incomplete++; filled++; }
        else if(v === 'O'){ off++; filled++; }
      });
    }));
  }
  await Promise.all(jobs);
  const totalPossible = numTasks * nDays;
  const denom = complete + incomplete;
  const completionRate = denom > 0 ? Math.round((complete/denom)*100) : null;
  const fillRate = totalPossible > 0 ? Math.round((filled/totalPossible)*100) : 0;
  return { complete, incomplete, off, filled, totalPossible, completionRate, fillRate };
}

async function renderMonthlyOverview(){
  await refreshServerState();
  const view = document.getElementById('monthlyView');
  view.innerHTML = '<div class="empty-note">Crunching this month\'s numbers...</div>';

  const monthLabel = fmtMonthLabel(monthCursor);
  let bodyHtml = `
    <div class="monthly-header">
      <h1>Monthly Overview \u2014 ${monthLabel}</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="month-nav">
          <button id="prevMonth" title="Previous month">&#8592;</button>
          <span class="month-label">${monthLabel}</span>
          <button id="nextMonth" title="Next month">&#8594;</button>
        </div>
        <span class="month-today-pill" id="thisMonthBtn">This month</span>
      </div>
    </div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 4px;">
      Resets automatically every calendar month \u2014 each month starts at 0% and is computed live from that
      month's daily check-ins. Nothing is ever deleted; past months stay available by navigating back with the arrows above.
    </p>
    <div class="monthly-actions">
      <button id="copyMonthlyBtn">Copy as text</button>
      <button id="printMonthlyBtn">Print / Save as PDF</button>
    </div>
  `;

  const allRows = [];

  for(const [locKey, loc] of Object.entries(LOCATIONS)){
    bodyHtml += `<div class="monthly-loc-group"><div class="monthly-loc-title">${loc.name}</div>
      <table class="monthly-table"><thead><tr>
        <th>Employee</th><th class="num">Tasks tracked</th><th class="num">Complete</th><th class="num">Incomplete</th><th class="num">Off</th><th class="num">Completion rate</th><th class="num">Logging rate</th>
      </tr></thead><tbody>`;
    for(let empIdx=0; empIdx<loc.data.length; empIdx++){
      const emp = loc.data[empIdx];
      if(emp.tasks.length === 0) continue;
      const stats = await computeMonthlyStats(locKey, empIdx, monthCursor);
      const rc = rateClass(stats.completionRate);
      const rateLabel = stats.completionRate === null ? '\u2014' : stats.completionRate + '%';
      bodyHtml += `<tr>
        <td>${emp.label}</td>
        <td class="num">${stats.totalPossible}</td>
        <td class="num">${stats.complete}</td>
        <td class="num">${stats.incomplete}</td>
        <td class="num">${stats.off}</td>
        <td class="num"><span class="rate-pill rate-${rc}">${rateLabel}</span></td>

      allRows.push({ loc: loc.name, employee: emp.label, ...stats, rateLabel });
    }
    bodyHtml += `</tbody></table></div>`;
  }

  view.innerHTML = bodyHtml;

  document.getElementById('prevMonth').onclick = () => { monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()-1, 1); renderMonthlyOverview(); };
  document.getElementById('nextMonth').onclick = () => { monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 1); renderMonthlyOverview(); };
  document.getElementById('thisMonthBtn').onclick = () => { monthCursor = firstOfMonth(new Date()); renderMonthlyOverview(); };
  document.getElementById('copyMonthlyBtn').onclick = () => copyMonthlyAsText(monthLabel, allRows);
  document.getElementById('printMonthlyBtn').onclick = () => window.print();
}

function copyMonthlyAsText(monthLabel, rows){
  let text = `MONTHLY OVERVIEW \u2014 ${monthLabel}\n\n`;

    text += `${r.employee}: ${r.rateLabel} complete (${r.complete}C / ${r.incomplete}I / ${r.off}O) \u2014 ${r.fillRate}% logged\n`;
  });

async function loadStatuses(loc, empIdx, dateStr){
  const key = statusKey(loc, empIdx, dateStr);
  if(statusCache[key]) return statusCache[key];
  const raw = await storGet(key);
  // stored keyed by stable task id (not array position), so reassigning a task between
  // roles never scrambles anyone's history
  const obj = raw ? JSON.parse(raw) : {};
  statusCache[key] = obj;
  return obj;
}
async function saveStatuses(loc, empIdx, dateStr, obj){
  const key = statusKey(loc, empIdx, dateStr);
  statusCache[key] = obj;

}

function groupTasks(tasks){
  const order = ['Daily','Weekly','Saturday','Sunday','Monthly','Quarterly','As Needed','Awareness'];
  const groups = {};
  tasks.forEach((t) => {
    const c = t.cadence || 'Daily';
    if(!groups[c]) groups[c] = [];
    groups[c].push(t);
  });
  return order.filter(o => groups[o]).map(o => ({cadence:o, tasks:groups[o]}));
}

function renderMeetingsPanel(dates){
  const wrap = document.getElementById('meetingsPanelWrap');
  if(!wrap) return;
  const myKey = `${currentLoc}::${currentEmployee}`;
  const rows = [];
  dates.forEach((d) => {
    MEETINGS.forEach(m => {
      if((m.attendeeRoles||[]).includes(myKey) && meetingOccursOn(m, d)){
        rows.push({ date: d, meeting: m });
      }
    });
  });
  if(rows.length === 0){ wrap.innerHTML = ''; return; }
  rows.sort((a,b) => a.date - b.date);
  const dowFmt = (d) => d.toLocaleDateString('en-US', {weekday:'short', month:'numeric', day:'numeric'});
  let html = `<div class="group-title" style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--win-text-secondary);margin:0 0 8px 2px;">Meetings this week</div>`;
  rows.forEach(({date, meeting}) => {
    html += `<div style="border:1px solid var(--win-border);border-radius:6px;padding:9px 12px;margin-bottom:6px;background:var(--win-surface);">
      <div style="font-size:12.5px;font-weight:600;">${escapeHtml(meeting.title||'Untitled meeting')} <span style="font-weight:400;color:var(--win-text-secondary);">\u00b7 ${dowFmt(date)}${meeting.time ? ' \u00b7 ' + escapeHtml(meeting.time) : ''} \u00b7 ${escapeHtml(meeting.type||'')}</span></div>
      ${meeting.agenda ? `<div style="font-size:12px;color:var(--win-text-secondary);margin-top:4px;white-space:pre-line;">${escapeHtml(meeting.agenda)}</div>` : ''}
    </div>`;
  });
  wrap.innerHTML = html;
}

async function renderOnetimePanel(){
  const list = await loadOnetimeList(currentLoc, currentEmployee);
  const panel = document.getElementById('onetimeList');
  panel.innerHTML = '';

  if(list.length === 0){
    panel.innerHTML = '<div class="empty-note" style="padding:10px 4px">No one-time tasks added yet.</div>';
  }

  list.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'onetime-row' + (item.done ? ' done' : '');
    row.innerHTML = `
      <div class="onetime-thumb-wrap">${item.refPhoto ? `<img class="photo-thumb" src="${item.refPhoto}">` : `<div class="photo-btn" style="cursor:default">&#128247;</div>`}</div>
      <div class="onetime-text">${item.text}</div>
      <button class="mini-btn" data-action="ref">${item.refPhoto ? 'View photo' : 'Add photo'}</button>
      <button class="mini-btn ${item.done ? 'sel-C' : ''}" data-action="done">${item.done ? 'Complete' : 'Mark complete'}</button>
      ${item.done ? `<button class="mini-btn" data-action="donephoto">${item.donePhoto ? 'View completion photo' : 'Add completion photo'}</button>` : ''}
      <button class="mini-btn danger-mini" data-action="delete">Remove</button>
    `;
    row.querySelector('[data-action="ref"]').onclick = () => {
      const actions = [
        { label:'Close', onClick: closePhotoModal },
        { label: item.refPhoto ? 'Replace photo' : 'Add photo', onClick: () => triggerUpload(async (durl) => {
            item.refPhoto = durl;
            await saveOnetimeList(currentLoc, currentEmployee, list);
            closePhotoModal(); renderOnetimePanel();
          })
        }
      ];
      if(item.refPhoto) actions.push({ label:'Remove photo', cls:'danger', onClick: async () => { item.refPhoto = null; await saveOnetimeList(currentLoc, currentEmployee, list); closePhotoModal(); renderOnetimePanel(); } });
      openPhotoModal('Task photo — ' + item.text, item.refPhoto, actions);
    };
    row.querySelector('[data-action="done"]').onclick = async () => {
      item.done = !item.done;
      await saveOnetimeList(currentLoc, currentEmployee, list);
      renderOnetimePanel();
    };
    const donephotoBtn = row.querySelector('[data-action="donephoto"]');
    if(donephotoBtn){
      donephotoBtn.onclick = () => {
        const actions = [
          { label:'Close', onClick: closePhotoModal },
          { label: item.donePhoto ? 'Replace photo' : 'Add completion photo', onClick: () => triggerUpload(async (durl) => {
              item.donePhoto = durl;
              await saveOnetimeList(currentLoc, currentEmployee, list);
              closePhotoModal(); renderOnetimePanel();
            })
          }
        ];
        if(item.donePhoto) actions.push({ label:'Remove photo', cls:'danger', onClick: async () => { item.donePhoto = null; await saveOnetimeList(currentLoc, currentEmployee, list); closePhotoModal(); renderOnetimePanel(); } });
        openPhotoModal('Completion photo — ' + item.text, item.donePhoto, actions);
      };
    }
    row.querySelector('[data-action="delete"]').onclick = async () => {
      if(!confirm('Remove this one-time task?')) return;
      list.splice(i,1);
      await saveOnetimeList(currentLoc, currentEmployee, list);
      renderOnetimePanel();
    };
    panel.appendChild(row);
  });
}

function triggerUpload(cb){
  const input = document.getElementById('fileInput');
  input.value = '';
  input.onchange = async () => {
    if(input.files && input.files[0]){
      const durl = await fileToDataUrl(input.files[0]);

    }
  };
  input.click();
}

function computeSummary(dates, countableIds){
  // quick aggregate across cached day statuses already in statusCache, restricted to
  // non-Awareness task ids so parked tasks never affect the reported rate
  let filled=0, total=0, complete=0;
  dates.forEach(d => {
    const key = statusKey(currentLoc, currentEmployee, isoDate(d));
    const obj = statusCache[key] || {};
    countableIds.forEach(id => {
      total++;
      const v = obj[id];
      if(v){ filled++; if(v==='C') complete++; }
    });
  });
  updateSummaryStat(filled, total, complete);
}
function updateSummaryStat(filled, total, complete){
  const pct = total ? Math.round((filled/total)*100) : 0;
  document.getElementById('summaryStat').innerHTML =
    `<b>${pct}%</b> of this week's checkboxes filled &middot; <b>${complete}</b> marked complete`;
}

async function renderNavProgress(){
  const items = document.querySelectorAll('#navList .nav-progress');
  const dates = weekDates(weekStart);
  for(const el of items){
    const idx = parseInt(el.dataset.idx,10);
    const countableIds = LOCATIONS[currentLoc].data[idx].tasks.filter(t => t.cadence !== 'Awareness').map(t => t.id);
    let filled=0, total=0;
    for(const d of dates){
      const obj = await loadStatuses(currentLoc, idx, isoDate(d));
      countableIds.forEach(id => { total++; if(obj[id]) filled++; });
    }
    el.textContent = total ? `${filled}/${total}` : '';
  }
}

// ---- Export / Import (backup, sharing between devices, and pulling in KPI mappings from Task Workflow Mapper) ----
async function exportData(){
  await refreshServerState();
  const data = SERVER_STATE;
  if(Object.keys(data).length === 0){ showToast('Nothing to export yet'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `dealership-daily-ops-data-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported (this is a backup - the live data already lives on the server)');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const data = JSON.parse(e.target.result);
      const res = await fetch('/api/state/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminCode: getAdminCode(), data })
      });
      if(res.status === 403){ showToast('Import blocked \u2014 admin code required'); return; }
      const result = await res.json();
      statusCache = {};
      onetimeListCache = {};
      await renderAll();
      showToast(`Imported ${result.count || 0} entries into the shared store`);
    }catch(err){
      console.error(err);
      showToast('Import failed - invalid file');
    }
  };
  reader.readAsText(file);
}

// one off leaves it visible with a strikethrough instead of removing it, so Rob can review
// what's done vs still open from one place instead of hunting through each person's view) ----
let onetimeReviewShown = false;

async function renderOnetimeReview(){
  const view = document.getElementById('onetimeReviewView');
  await refreshServerState();

  const allTargets = [];
  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => allTargets.push({ locKey, empIdx, label: `${loc.name} \u2014 ${emp.label}` }));
  });

  let html = `
    <div class="monthly-header"><h1>One-Time Tasks</h1></div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 16px;">
      For anything random you need a specific manager or employee to handle that isn't on their
      regular list. Assign it below - it shows up right in their daily view. Once they check it
      off it stays visible with a line through it (nothing disappears), so you can review
      completion here any time.
    </p>
    <div style="display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;">
      <select id="otAssignTarget" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:8px;font-size:12.5px;">
        <option value="">Assign to\u2026</option>
        ${allTargets.map(x => `<option value="${x.locKey}::${x.empIdx}">${escapeAttr(x.label)}</option>`).join('')}
      </select>
      <input type="text" id="otAssignText" placeholder="Describe the task..." style="flex:1;min-width:260px;border:1px solid var(--win-border-strong);border-radius:6px;padding:8px 10px;font-size:12.5px;">
      <button class="mini-btn primary-mini" id="otAssignBtn">Assign</button>
    </div>
  `;

  const sections = [];
  for(const [locKey, loc] of Object.entries(LOCATIONS)){
    for(let empIdx=0; empIdx<loc.data.length; empIdx++){
      const emp = loc.data[empIdx];
      const list = await loadOnetimeList(locKey, empIdx);
      if(list.length) sections.push({ locName: loc.name, empLabel: emp.label, list });
    }
  }

  if(sections.length === 0){
    html += `<div class="empty-note">No one-time tasks assigned yet.</div>`;
  } else {
    const pendingCount = sections.reduce((n,s) => n + s.list.filter(i=>!i.done).length, 0);
    const doneCount = sections.reduce((n,s) => n + s.list.filter(i=>i.done).length, 0);
    html += `<div class="spec-stats" style="margin-bottom:18px;">
      <div class="spec-stat"><div class="num">${pendingCount}</div><div class="lbl">Open</div></div>
      <div class="spec-stat"><div class="num">${doneCount}</div><div class="lbl">Completed</div></div>
    </div>`;
  }

  sections.forEach(({locName, empLabel, list}) => {
    html += `<div class="monthly-loc-group"><div class="monthly-loc-title">${escapeHtml(locName)} \u2014 ${escapeHtml(empLabel)}</div>`;
    list.forEach((item) => {
      html += `<div class="onetime-row${item.done ? ' done' : ''}" style="border:1px solid var(--win-border);border-radius:6px;margin-bottom:6px;padding:9px 12px;">
        ${item.refPhoto ? `<img class="photo-thumb" src="${item.refPhoto}">` : ''}
        <div class="onetime-text">${escapeHtml(item.text)}</div>
        <span style="font-size:11px;font-weight:700;flex-shrink:0;color:${item.done ? 'var(--c-complete)' : 'var(--win-text-secondary)'};">${item.done ? 'Completed' : 'Open'}</span>
      </div>`;
    });
    html += `</div>`;
  });

  view.innerHTML = html;

  document.getElementById('otAssignBtn').onclick = async () => {
    const val = document.getElementById('otAssignTarget').value;
    const text = document.getElementById('otAssignText').value.trim();
    if(!val || !text) return;
    const [locKey, empIdxStr] = val.split('::');
    const empIdx = parseInt(empIdxStr, 10);
    const list = await loadOnetimeList(locKey, empIdx);
    list.push({ text, refPhoto: null, done: false, donePhoto: null });
    await saveOnetimeList(locKey, empIdx, list);
    showToast('Assigned');
    await renderOnetimeReview();
  };
}

function wireMeetingsHandlers(view){
  document.getElementById('addMeetingBtn').onclick = async () => {
    MEETINGS.push({ id: newMeetingId(), title: 'New meeting', type: 'In-house', cadence: 'Weekly', dayOfWeek: 'Monday', dayOfMonth: '', onDate: '', time: '', attendeeRoles: [], externalAttendees: '', agenda: '', notesLog: [] });
    await saveMeetingsList();
    await renderMeetings();
  };

  view.querySelectorAll('details[data-mid]').forEach(card => {
    const mid = card.dataset.mid;
    const findM = () => MEETINGS.find(m => m.id === mid);

    const bind = (sel, prop, parse) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => {
        const m = findM(); if(!m) return;
        m[prop] = parse ? parse(e.target.value) : e.target.value;
        await saveMeetingsList();
      };
    };
    bind('.m-title', 'title');
    bind('.m-type', 'type');
    bind('.m-dow', 'dayOfWeek');
    bind('.m-dom', 'dayOfMonth');
    bind('.m-date', 'onDate');
    bind('.m-time', 'time');
    bind('.m-external', 'externalAttendees');
    bind('.m-agenda', 'agenda');

    const cadenceEl = card.querySelector('.m-cadence');
    if(cadenceEl) cadenceEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.cadence = e.target.value;
      await saveMeetingsList();
      await renderMeetings(); // re-render so the right day/date field shows for the new cadence
    };

    const attendeesEl = card.querySelector('.m-attendees');
    if(attendeesEl) attendeesEl.onchange = async (e) => {
      const m = findM(); if(!m) return;
      m.attendeeRoles = Array.from(e.target.selectedOptions).map(o => o.value);
      await saveMeetingsList();
    };

    const removeEl = card.querySelector('.m-remove');
    if(removeEl) removeEl.onclick = async () => {
      if(!confirm('Remove this meeting series? Its notes log goes with it.')) return;
      const i = MEETINGS.findIndex(x => x.id === mid);
      if(i > -1) MEETINGS.splice(i, 1);
      await saveMeetingsList();
      await renderMeetings();
    };

    const addNoteBtn = card.querySelector('.m-addnote');
    if(addNoteBtn) addNoteBtn.onclick = async () => {
      const ta = card.querySelector('.m-newnote');
      const text = (ta.value || '').trim();
      if(!text) return;
      const m = findM(); if(!m) return;
      if(!m.notesLog) m.notesLog = [];
      m.notesLog.push({ date: isoDate(new Date()), notes: text });
      await saveMeetingsList();
      await renderMeetings();
    };
  });
}

      <button class="mini-btn primary-mini" id="newProjBtn">+ New project</button>
    </div>
  `;

  if(PROJECTS.length === 0){
    html += `<div class="empty-note">No projects yet.</div>`;
  }

  PROJECTS.forEach(p => {
    const doneCount = (p.steps||[]).filter(s => s.status === 'Done').length;
    const totalCount = (p.steps||[]).length;
    html += `<details class="proj-card" data-pid="${p.id}" style="padding:0;">
      <summary style="cursor:pointer;padding:10px 14px;font-weight:600;font-size:13px;">
        ${escapeHtml(p.name)}
        <span style="font-weight:400;color:var(--win-text-secondary);">\u00b7 ${escapeHtml(p.status||'Active')}${p.deadline ? ' \u00b7 due ' + escapeHtml(p.deadline) : ''} \u00b7 ${doneCount}/${totalCount} steps done</span>
      </summary>
      <div style="padding:4px 14px 16px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <input type="text" class="p-name" value="${escapeAttr(p.name)}" placeholder="Project name" style="flex:1;min-width:220px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
          <select class="p-status" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="Active" ${p.status==='Active'?'selected':''}>Active</option>
            <option value="On Hold" ${p.status==='On Hold'?'selected':''}>On Hold</option>
            <option value="Completed" ${p.status==='Completed'?'selected':''}>Completed</option>
          </select>
          <input type="date" class="p-deadline" value="${escapeAttr(p.deadline||'')}" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
          <button class="mini-btn danger-mini p-remove">Delete project</button>
        </div>
        <textarea class="p-desc" placeholder="Project description..." style="width:100%;min-height:48px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;margin-bottom:12px;">${escapeHtml(p.description||'')}</textarea>

        <div class="p-steps">`;

    (p.steps||[]).forEach(s => {
      const targetOpts = targets.map(x => `<option value="${x.locKey}::${x.empIdx}" ${(s.assignedLoc===x.locKey && s.assignedEmp===x.empIdx)?'selected':''}>${escapeAttr(x.label)}</option>`).join('');
      html += `<div class="proj-step-row" data-sid="${s.id}">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <input type="text" class="s-title" value="${escapeAttr(s.title)}" placeholder="Step / task" style="flex:1;min-width:200px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
          <select class="s-assign" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="">Unassigned</option>${targetOpts}
          </select>
          <input type="date" class="s-due" value="${escapeAttr(s.dueDate||'')}" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
          <select class="s-status" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
            <option value="Not Started" ${s.status==='Not Started'?'selected':''}>Not Started</option>
            <option value="In Progress" ${s.status==='In Progress'?'selected':''}>In Progress</option>
            <option value="Done" ${s.status==='Done'?'selected':''}>Done</option>
          </select>
          <button class="mini-btn danger-mini s-remove">Remove</button>
        </div>
        <textarea class="s-notes" placeholder="Notes for this step..." style="width:100%;min-height:36px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;margin-top:6px;">${escapeHtml(s.notes||'')}</textarea>
        <div class="s-attachments" style="margin-top:6px;">${renderAttachmentChips(s.attachments)}</div>
        <div style="display:flex;gap:8px;margin-top:6px;">
          <input type="text" class="s-link-name" placeholder="Link name (e.g. Drive folder)" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:5px 8px;font-size:11.5px;width:180px;">
          <input type="text" class="s-link-url" placeholder="https://drive.google.com/..." style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:5px 8px;font-size:11.5px;">
          <button class="mini-btn s-addlink">+ Add link</button>
          <button class="mini-btn s-addfile">+ Add file</button>
        </div>
      </div>`;
    });

    html += `</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <input type="text" class="add-step-input" placeholder="New step / task..." style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;">
          <button class="mini-btn primary-mini add-step-btn">+ Add step</button>
        </div>
      </div>
    </details>`;
  });

  view.innerHTML = html;
  wireProjectsHandlers(view);
}

function wireProjectsHandlers(view){
  const newBtn = document.getElementById('newProjBtn');
  if(newBtn) newBtn.onclick = async () => {
    const input = document.getElementById('newProjName');
    const name = (input.value || '').trim();
    if(!name) return;
    PROJECTS.push({ id: newProjectId(), name, description: '', deadline: '', status: 'Active', createdAt: isoDate(new Date()), steps: [] });
    await saveProjects();
    await renderProjects();
  };

  view.querySelectorAll('details[data-pid]').forEach(card => {
    const pid = card.dataset.pid;
    const findP = () => PROJECTS.find(p => p.id === pid);

    const bindP = (sel, prop) => {
      const el = card.querySelector(sel);
      if(!el) return;
      el.onchange = async (e) => { const p = findP(); if(!p) return; p[prop] = e.target.value; await saveProjects(); };
    };
    bindP('.p-name', 'name');
    bindP('.p-status', 'status');
    bindP('.p-deadline', 'deadline');
    bindP('.p-desc', 'description');

    const removeBtn = card.querySelector('.p-remove');
    if(removeBtn) removeBtn.onclick = async () => {
      if(!confirm('Delete this project and all its steps? This cannot be undone.')) return;
      const i = PROJECTS.findIndex(p => p.id === pid);
      if(i > -1) PROJECTS.splice(i, 1);
      await saveProjects();
      await renderProjects();
    };

    const addStepBtn = card.querySelector('.add-step-btn');
    if(addStepBtn) addStepBtn.onclick = async () => {
      const input = card.querySelector('.add-step-input');
      const title = (input.value || '').trim();
      if(!title) return;
      const p = findP(); if(!p) return;
      if(!p.steps) p.steps = [];
      p.steps.push({ id: newStepId(), title, assignedLoc: '', assignedEmp: null, dueDate: '', status: 'Not Started', notes: '', attachments: [] });
      await saveProjects();
      await renderProjects();
    };

    card.querySelectorAll('.proj-step-row').forEach(row => {
      const sid = row.dataset.sid;
      const findS = () => { const p = findP(); return p && (p.steps||[]).find(s => s.id === sid); };

      const bindS = (sel, prop) => {
        const el = row.querySelector(sel);
        if(!el) return;
        el.onchange = async (e) => { const s = findS(); if(!s) return; s[prop] = e.target.value; await saveProjects(); };
      };
      bindS('.s-title', 'title');
      bindS('.s-due', 'dueDate');
      bindS('.s-status', 'status');
      bindS('.s-notes', 'notes');

      const assignEl = row.querySelector('.s-assign');
      if(assignEl) assignEl.onchange = async (e) => {
        const s = findS(); if(!s) return;
        const val = e.target.value;
        if(!val){ s.assignedLoc = ''; s.assignedEmp = null; }
        else { const [locKey, empIdxStr] = val.split('::'); s.assignedLoc = locKey; s.assignedEmp = parseInt(empIdxStr, 10); }
        await saveProjects();
      };

      const removeS = row.querySelector('.s-remove');
      if(removeS) removeS.onclick = async () => {
        if(!confirm('Remove this step?')) return;
        const p = findP(); if(!p) return;
        const i = (p.steps||[]).findIndex(s => s.id === sid);
        if(i > -1) p.steps.splice(i, 1);
        await saveProjects();
        await renderProjects();
      };

      const addLinkBtn = row.querySelector('.s-addlink');
      if(addLinkBtn) addLinkBtn.onclick = async () => {
        const nameInput = row.querySelector('.s-link-name');
        const urlInput = row.querySelector('.s-link-url');
        const url = (urlInput.value || '').trim();
        if(!url) return;
        const name = (nameInput.value || '').trim() || url;
        const s = findS(); if(!s) return;
        if(!s.attachments) s.attachments = [];
        s.attachments.push({ id: newAttachId(), kind:'link', name, url, addedAt: isoDate(new Date()) });
        await saveProjects();
        await renderProjects();
      };

      const addFileBtn = row.querySelector('.s-addfile');
      if(addFileBtn) addFileBtn.onclick = () => {
        const input = document.getElementById('fileInput');
        input.value = '';
        input.accept = '';
        input.onchange = async () => {
          if(input.files && input.files[0]){
            const file = input.files[0];
            const durl = await fileToDataUrl(file);
            const s = findS(); if(!s) return;
            if(!s.attachments) s.attachments = [];
            s.attachments.push({ id: newAttachId(), kind:'file', name: file.name, dataUrl: durl, addedAt: isoDate(new Date()) });
            await saveProjects();
            await renderProjects();
            input.accept = 'image/*';
          }
        };
        input.click();
      };
    });
  });
}

function closeOtherPanels(except){
  if(except !== 'monthly' && monthlyShown){ monthlyShown = false; document.getElementById('monthlyToggleBtn').classList.remove('active'); document.getElementById('monthlyView').classList.remove('show'); }
  if(except !== 'setup' && setupShown){ setupShown = false; document.getElementById('setupToggleBtn').classList.remove('active'); document.getElementById('setupView').classList.remove('show'); }
  if(except !== 'onetime' && onetimeReviewShown){ onetimeReviewShown = false; document.getElementById('onetimeToggleBtn').classList.remove('active'); document.getElementById('onetimeReviewView').classList.remove('show'); }
  if(except !== 'meetings' && meetingsShown){ meetingsShown = false; document.getElementById('meetingsToggleBtn').classList.remove('active'); document.getElementById('meetingsView').classList.remove('show'); }
  if(except !== 'projects' && projectsShown){ projectsShown = false; document.getElementById('projectsToggleBtn').classList.remove('active'); document.getElementById('projectsView').classList.remove('show'); }
}
function updatePanelVisibility(){
  const anyShown = monthlyShown || setupShown || onetimeReviewShown || meetingsShown || projectsShown;
  document.querySelector('.sidebar').style.display = anyShown ? 'none' : '';
  document.querySelector('.main').style.display = anyShown ? 'none' : '';
  // Coming back from an admin panel (Setup/Meetings/Projects/etc.) to the main checklist view -
  // refresh it so anything just edited (roster changes, a newly-assigned project step, a new
  // meeting) shows up immediately instead of needing a manual page reload.
  if(!anyShown){ renderMain(); renderNavProgress(); }
}

// ---- Setup (roster admin: add roles, reassign/add/remove tasks, cadence incl. Awareness,
// how-to notes + training video links). Everything here writes straight to the shared
// roster, so it's the same list every employee's daily view reads from. ----
let setupShown = false;

async function reassignTask(taskId, fromLoc, fromEmpIdx, toLoc, toEmpIdx){
  const fromTasks = LOCATIONS[fromLoc].data[fromEmpIdx].tasks;
  const i = fromTasks.findIndex(t => t.id === taskId);
  if(i === -1) return;
  const [task] = fromTasks.splice(i, 1);
  LOCATIONS[toLoc].data[toEmpIdx].tasks.push(task);
  await saveRoster();

  // carry any mapped KPI (from the Task Workflow Mapper) along so it isn't orphaned
  const oldKey = `map:${fromLoc}:${fromEmpIdx}:${taskId}`;
  const mapped = SERVER_STATE[oldKey];
  if(mapped){
    await storSet(`map:${toLoc}:${toEmpIdx}:${taskId}`, mapped);
    await storSet(oldKey, null);
  }
}

async function removeTask(taskId, loc, empIdx){
  const tasks = LOCATIONS[loc].data[empIdx].tasks;
  const i = tasks.findIndex(t => t.id === taskId);
  if(i === -1) return;
  if(!confirm('Remove this task? Past check-ins for it are kept but will no longer be shown.')) return;
  tasks.splice(i,1);
  await saveRoster();
  await renderSetup();
}

async function renderSetup(){
  await refreshServerState();
  const view = document.getElementById('setupView');

  const allTargets = [];
  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    loc.data.forEach((emp, empIdx) => {
      allTargets.push({ locKey, empIdx, label: `${loc.name} \u2014 ${emp.label}` });
    });
  });
  const CADENCES = ['Daily','Weekly','Saturday','Sunday','Monthly','Quarterly','As Needed','Awareness'];

  let html = `
    <div class="monthly-header"><h1>Setup</h1></div>
    <p style="font-size:13px;color:var(--win-text-secondary);max-width:760px;margin:0 0 18px;">
      The roster and task list exactly as it sits today, for every location. Add roles, reassign
      tasks between people (history follows the task automatically), change cadence, park
      something in <b>Awareness</b> so it stays visible without counting against completion, or
      attach how-to notes and a training video link. Everything here saves immediately and is
      shared with every employee's view.
    </p>
  `;

  Object.entries(LOCATIONS).forEach(([locKey, loc]) => {
    html += `<div class="monthly-loc-group">
      <div class="monthly-loc-title">${loc.name}</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="text" class="add-role-input" placeholder="New role name at ${escapeAttr(loc.name)}..." style="border:1px solid var(--win-border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;width:280px;">
        <button class="mini-btn primary-mini add-role-btn" data-loc="${locKey}">+ Add role</button>
      </div>`;

    loc.data.forEach((emp, empIdx) => {
      html += `<details class="setup-role" style="margin-bottom:10px;border:1px solid var(--win-border);border-radius:8px;background:var(--win-surface);">
        <summary style="cursor:pointer;padding:10px 14px;font-weight:600;font-size:13px;">${escapeHtml(emp.label)} <span style="font-weight:400;color:var(--win-text-secondary);">(${emp.tasks.length} tasks)</span></summary>
        <div style="padding:2px 14px 14px;">`;

      emp.tasks.forEach((t) => {
        const cadOpts = CADENCES.map(c => `<option value="${c}" ${t.cadence===c?'selected':''}>${c}</option>`).join('');
        const targetOpts = allTargets
          .filter(x => !(x.locKey===locKey && x.empIdx===empIdx))
          .map(x => `<option value="${x.locKey}::${x.empIdx}">${escapeAttr(x.label)}</option>`).join('');
        html += `<div class="setup-task-row" data-taskid="${t.id}" data-loc="${locKey}" data-emp="${empIdx}" style="border-top:1px solid var(--win-border);padding:10px 0;">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="text" class="st-text" value="${escapeAttr(t.text)}" style="flex:1;min-width:220px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;">
            <select class="st-cadence" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">${cadOpts}</select>
            <select class="st-reassign" style="border:1px solid var(--win-border-strong);border-radius:6px;padding:6px;font-size:12px;">
              <option value="">Reassign to\u2026</option>${targetOpts}
            </select>
            <button class="mini-btn danger-mini st-remove">Remove</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <input type="text" class="st-howto" placeholder="How to perform this task..." value="${escapeAttr(t.howTo||'')}" style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
            <input type="text" class="st-video" placeholder="Training video URL" value="${escapeAttr(t.videoUrl||'')}" style="width:260px;border:1px solid var(--win-border-strong);border-radius:6px;padding:6px 9px;font-size:12px;">
          </div>
        </div>`;
      });

      html += `<div style="display:flex;gap:8px;margin-top:10px;">
          <input type="text" class="add-task-input" placeholder="New task text..." style="flex:1;border:1px solid var(--win-border-strong);border-radius:6px;padding:7px 10px;font-size:12.5px;">
          <button class="mini-btn primary-mini add-task-btn" data-loc="${locKey}" data-emp="${empIdx}">+ Add task</button>
        </div>`;
      html += `</div></details>`;
    });

    html += `</div>`;
  });

  view.innerHTML = html;

  view.querySelectorAll('.add-role-btn').forEach(btn => {
    btn.onclick = async () => {
      const input = btn.previousElementSibling;
      const name = (input.value || '').trim();
      if(!name) return;
      LOCATIONS[btn.dataset.loc].data.push({ label: name, tasks: [] });
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.add-task-btn').forEach(btn => {
    btn.onclick = async () => {
      const input = btn.previousElementSibling;
      const text = (input.value || '').trim();
      if(!text) return;
      const empIdx = parseInt(btn.dataset.emp, 10);
      LOCATIONS[btn.dataset.loc].data[empIdx].tasks.push({ id: newTaskId(), text, cadence: 'Daily', howTo: '', videoUrl: '' });
      await saveRoster();
      await renderSetup();
    };
  });

  view.querySelectorAll('.setup-task-row').forEach(row => {
    const taskId = row.dataset.taskid;
    const loc = row.dataset.loc;
    const empIdx = parseInt(row.dataset.emp, 10);
    const findTask = () => LOCATIONS[loc].data[empIdx].tasks.find(t => t.id === taskId);

    row.querySelector('.st-text').onchange = async (e) => { const t = findTask(); if(t){ t.text = e.target.value; await saveRoster(); } };
    row.querySelector('.st-cadence').onchange = async (e) => { const t = findTask(); if(t){ t.cadence = e.target.value; await saveRoster(); } };
    row.querySelector('.st-howto').onchange = async (e) => { const t = findTask(); if(t){ t.howTo = e.target.value; await saveRoster(); } };
    row.querySelector('.st-video').onchange = async (e) => { const t = findTask(); if(t){ t.videoUrl = e.target.value; await saveRoster(); } };
    row.querySelector('.st-remove').onclick = () => removeTask(taskId, loc, empIdx);
    row.querySelector('.st-reassign').onchange = async (e) => {
      const val = e.target.value;
      if(!val) return;
      const [toLoc, toEmpIdxStr] = val.split('::');
      await reassignTask(taskId, loc, empIdx, toLoc, parseInt(toEmpIdxStr, 10));
      await renderSetup();
    };
  });
}
